<main><section>Mechanical Design Engineer <h1>The other half of the craft: things you can hold.</h1>
<p>Mechanical design for automotive and aerospace. I model it, simulate it, make it, and take away what the part does not need.</p>
Automotive Aerospace Parametric CAD Fusion 360 3D printing <b>−59%</b>
Brake pedal mass, generative vs standard (simulation) <b>−52%</b>
Triple clamp mass, generative vs standard (simulation) <b>3</b>
Parts taken from a standard design to a generative one <a href="#generative">See the generative studies</a><a href="#gallery">Jump to the gallery</a></section>
<section>Generative design · Fusion 360 <h3>Before AI tools, I let the solver find the shape.</h3>
<p>Generative design in Fusion 360 showed me where a part carried no load. I removed that material, kept the strength, and checked it in simulation. Less metal, less weight, less fuel spent carrying it.</p>
<h4>Brake pedal</h4>
Titanium 6Al-4V · 2,000 N load Standard 138 g Safety factor 1.54 Optimized −25% 104 g Safety factor 1.54 Generative −59% 56 g Safety factor 1.5 <p>From an academic project, simulated in Fusion 360. Masses and safety factors come from the study’s validation tables.</p>
<h4>Triple clamp</h4>
Inconel 625 · 2,000 N torsion, 1,000 N tension and compression Standard 2,509 g Safety factor 2 (min) Optimized −26% 1,851 g Safety factor 2 (min) Generative −52% 1,197 g Safety factor 2 <p>From an academic project, simulated in Fusion 360. Masses and safety factors come from the study’s validation tables.</p>
<h4>Motorcycle swing arm</h4>
Load-path study Standard Starting part The part as designed. Analysis Load path Red carries the load. Blue can go. Generative Material kept Only where the load flows. <p>Simulation study in Fusion 360. Red marks material that carries the load, blue marks material the part can lose. Mass figures are not shown here.</p>
<b>Less material</b>
Metal stays only where the load flows. <b>Lighter parts</b>
Down 59% (pedal) and 52% (clamp) in simulation. <b>Less fuel</b>
Less self-weight to carry means lower running cost in a vehicle.</section>
<section>Method <h2>Same part, same loads, less metal.</h2>
<b>Start from a real part</b>
Take an existing, finished component as the baseline. <b>Set the loads and limits</b>
The same loads, materials and constraints for every version. <b>Remove what carries no load</b>
Shape optimization first, then generative design, with stiffness and weight as the goals. <b>Check it in simulation</b>
Safety factor and displacement, compared with the original. <p><strong>The trade-off.</strong>
Lighter parts flex more, so I checked displacement as well as strength. Brake pedal: 2.93 mm to 3.75 mm. Triple clamp: 0.047 mm to 0.76 mm. Shapes this complex are hard to machine, which is why 3D printing is the natural next step.</p>

.il .dash{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 5;stroke-linecap:round}
.il .fc{fill:var(--card2);stroke:var(--line);stroke-width:1.5}
.il .fb{fill:var(--line)}
.il .fa{fill:var(--acc)}
.il .fs{fill:var(--fill)}
.il .note{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.il .tx{fill:var(--ink2);font:600 10.5px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.04em}
@keyframes scan{0%,100%{transform:translateX(-66px)}50%{transform:translateX(52px)}}
@keyframes ilPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ilBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ilStep{0%,12%{opacity:.25}30%,100%{opacity:1}}
@keyframes pinRing{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.il .scan{animation:scan 5.5s ease-in-out infinite}
.il .pls{animation:ilPulse 2.4s ease-in-out infinite}
.il .bob{animation:ilBob 3s ease-in-out infinite}
.il .st1,.il .st2,.il .st3{animation:ilStep 6s ease-in-out infinite}
.il .st2{animation-delay:1.2s}.il .st3{animation-delay:2.4s}
.il .orbit{transform-origin:130px 130px;animation:spin 70s linear infinite}
.il .orbit .nn{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite reverse}
.gp .il .scan,.gp .il .pls,.gp .il .bob,.gp .il .st1,.gp .il .st2,.gp .il .st3,.gp .il .orbit,.gp .il .orbit .nn,.gp .pin::after{animation-play-state:paused}

.hwc{display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box}
.hwc .ilb{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:10px}

.aichip span:nth-child(2){color:var(--ink2)}
.aichip .aic{width:36px;height:36px;border-radius:12px;background:var(--fill);color:var(--fillink);display:flex;align-items:center;justify-content:center;flex:none}

/* industries tracker */
.trk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.ts{position:relative;padding-top:64px;min-width:0;display:flex;flex-direction:column}
.ts .tile{flex:1}
.tn{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s,color .3s,border-color .3s}
.ts:hover .tn{transform:scale(1.1) rotate(-6deg);border-color:var(--acc);color:var(--acc)}
.tl{position:absolute;left:48px;top:23px;height:2px;width:calc(100% + 18px - 48px);background:var(--line);border-radius:2px;z-index:1}
.tl i{position:absolute;inset:0;background:var(--fill);border-radius:2px;transform-origin:right}
.tl b{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkDot 2.6s ease-in-out infinite;box-shadow:0 0 0 4px var(--glow)}
.ts.now .tn{background:var(--fill);color:var(--fillink);border-color:var(--acc)}
.ts.now .tn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--acc);animation:trkRing 2.2s ease-out infinite}
.ts.now .tile{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 22px 50px -22px var(--glow)}
.nowb{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;background:var(--card)}
.nowb::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkBlink 1.4s ease-in-out infinite}
.ts:last-child .tl{display:none}
.ts .yr{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.ts.now .yr{display:none}
@keyframes trkRing{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes trkBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes trkDot{0%{left:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{left:0;opacity:0}}
@keyframes trkFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trkFillY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes trkPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@supports (animation-timeline: view()){
.tl i{animation:trkFill linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 6%) entry calc(70% + var(--i,0) * 6%)}
.tn{animation:trkPop linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 5%) entry calc(40% + var(--i,0) * 5%)}
}
@media (max-width:900px){
.trk{grid-template-columns:1fr;gap:18px}
.ts{padding-top:0;padding-left:68px}
.ts .tile{flex:none;height:auto!important}
.tl{left:23px;top:48px;width:2px;height:calc(100% + 18px - 48px)}
.tl i{transform-origin:bottom}
.tl b{top:0;left:-3px;animation-name:trkDotY}
.nowb,.ts .yr{position:static;margin-bottom:10px;align-self:flex-start}
}
@keyframes trkDotY{0%{top:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{top:0;opacity:0}}
@supports (animation-timeline: view()){@media (max-width:900px){.tl i{animation-name:trkFillY}}}

/* chapter 07 v2 */
.gcmp{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);gap:8px;align-items:stretch}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gc.hi{border-color:var(--acc);box-shadow:var(--e3)}
.gimg{background:#EEF1F4;aspect-ratio:4/3;display:flex}
.gimg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.gmeta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.gk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.gc.hi .gk{color:var(--acc)}
.gchip{display:inline-flex;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--fillink)}
.gbig{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.1;color:var(--ink)}
.gbar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;transform-origin:left}
.sl.on .gbar i{animation:gx 1s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gnote{font-size:14px;color:var(--ink2);line-height:1.45}
.garr{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.gwhy{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.gwhy>div{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.gwhy .wi{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.gwhy b{display:block;font-family:'Space Grotesk',system-ui,sans-serif;font-size:18px;color:var(--ink);margin-bottom:2px}
.gwhy span.t{font-size:15px;color:var(--ink2);line-height:1.45}
.pstrip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;-webkit-overflow-scrolling:touch}
.pstrip figure{margin:0;flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.gbtn{display:block;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card2);cursor:zoom-in;position:relative;font:inherit}
.gbtn img{display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gbtn:hover img{transform:scale(1.04)}
.gbtn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.pstrip .gbtn img{height:270px;width:auto}
.pstrip figcaption,.gal figcaption{font-size:14px;color:var(--ink2)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.gal .gbtn{aspect-ratio:4/3;width:100%}
.gal .gbtn img{width:100%;height:100%;object-fit:cover}
.gal .gbtn.ct{background:#fff}.gal .gbtn.ct img{object-fit:contain;mix-blend-mode:multiply}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.gal{grid-template-columns:minmax(0,1fr)}}
.sbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .25s,background .25s}
.sbtn:hover{border-color:var(--acc);background:var(--card2)}
.lbx{position:fixed;inset:0;z-index:300;background:rgba(7,9,13,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out}
.lbx img{max-width:min(1100px,100%);max-height:78vh;border-radius:12px;background:#fff;object-fit:contain}
.lbx p{margin:0;color:#E6EAF0;font-size:16px;font-family:Inter,system-ui,sans-serif}
.lbx button{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
@media (max-width:760px){
  .gcmp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:10px;margin:0 -4px;padding-left:4px;padding-right:4px}
  .gcmp .gc{flex:none;width:76%;scroll-snap-align:center}
  .garr{display:none}
  .pstrip .gbtn img{height:210px}
}
/* mechanical design page */
.mdstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px;max-width:960px}
.mdstats>div{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--e1)}
.mdstats b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(34px,4vw,52px);line-height:1;color:var(--acc);font-weight:700}
.mdstats span{font-size:15px;color:var(--ink2);line-height:1.45}
.mdsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px;counter-reset:st}
.mdsteps>div>div,.mdsteps>div{min-width:0}
.mdsteps>div{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:24px;height:100%;box-sizing:border-box}
