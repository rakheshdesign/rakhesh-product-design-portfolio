2,435.76735l-23.96207,25.48774a1.51428,1.51428,0,0,0,.30359,2.35587l21.618,10.33354c1.73335.82855,3.25713-1.75726,1.51415-2.59042l-21.618-10.33353.30358,2.35586,23.96207-25.48774c1.32175-1.40591-.79553-3.53153-2.12132-2.12132Z" transform="translate(-189.12054 -149.13349)" fill="var(--u-d3)"/><path d="M1009.68877,750.86651h-457.294a1.19068,1.19068,0,1,1,0-2.38137h457.294a1.19068,1.19068,0,1,1,0,2.38137Z" transform="translate(-189.12054 -149.13349)" fill="var(--u-g3)"/></svg></figure></div><span class="ud-cap">Me · the push-back</span></div><div class="ud-bs"><span class="ub " style="--k:0">Lighter parts <em>flex more</em>.</span><span class="ub " style="--k:1">So strength alone is the wrong test.</span><span class="ub " style="--k:2">I checked displacement as well as safety factor.</span></div></div></div><div class="cs-dcs"><div class="card cs-dc" data-rv><span class="tag">Call 1</span><h5>Same loads for every version</h5><dl><div><dt>Why</dt><dd>Parts compared under different conditions prove nothing.</dd></div><div><dt>The call</dt><dd class="c">Fix the loads, material and constraints across versions.</dd></div><div><dt>What it gives</dt><dd>Differences come from the shape alone.</dd></div></dl></div><div class="card cs-dc" data-rv><span class="tag">Call 2</span><h5>Optimize first, then generate</h5><dl><div><dt>Why</dt><dd>Jumping to a lattice hides what the part needs.</dd></div><div><dt>The call</dt><dd class="c">Shape optimization first, then generative design, with stiffness and weight as goals.</dd></div><div><dt>What it gives</dt><dd>Three versions per part: standard, optimized, generative.</dd></div></dl></div><div class="card cs-dc" data-rv><span class="tag">Call 3</span><h5>Check stiffness, not just strength</h5><dl><div><dt>Why</dt><dd>Lighter parts flex more.</dd></div><div><dt>The call</dt><dd class="c">Compare displacement beside safety factor.</dd></div><div><dt>What it gives</dt><dd>The trade-off is visible, not hidden.</dd></div></dl></div></div></div></div></section><section id="studies"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">03 · The studies</span><h2 class="h2 hd" style="max-width: 900px">Three parts. <span class="em">Three versions each.</span></h2><span class="q-dec"><b>Decision</b>Same loads, every version</span></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>Standard, optimized, generative</b><span class="q-who">Interactive</span></div><div class="cs-pt"><style>#mp0:checked~.cs-pk label[for=mp0]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}#mp0:checked~.p0{display:flex;animation:csIn .4s ease}#mp0:checked~.p0 .mbar i{width:var(--w)}#mp0:focus-visible~.cs-pk label[for=mp0]{outline:2px solid var(--acc);outline-offset:2px}#mp1:checked~.cs-pk label[for=mp1]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}#mp1:checked~.p1{display:flex;animation:csIn .4s ease}#mp1:checked~.p1 .mbar i{width:var(--w)}#mp1:focus-visible~.cs-pk label[for=mp1]{outline:2px solid var(--acc);outline-offset:2px}#mp2:checked~.cs-pk label[for=mp2]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}#mp2:checked~.p2{display:flex;animation:csIn .4s ease}#mp2:checked~.p2 .mbar i{width:var(--w)}#mp2:focus-visible~.cs-pk label[for=mp2]{outline:2px solid var(--acc);outline-offset:2px}</style><input class="cs-r" type="radio" name="mp" id="mp0" aria-label="Brake pedal" checked><input class="cs-r" type="radio" name="mp" id="mp1" aria-label="Triple clamp"><input class="cs-r" type="radio" name="mp" id="mp2" aria-label="Swing arm"><div class="cs-pk"><label for="mp0">Brake pedal</label><label for="mp1">Triple clamp</label><label for="mp2">Swing arm</label></div><div class="pn p0"><p class="sb"><b style="color:var(--ink)">Brake pedal</b> · Titanium 6Al-4V · 2,000 N load</p><div class="cs-3"><div class="mcd"><div class="im"><img src="/img/c2817e7b25cb.webp" alt="Standard brake pedal, a plain solid blade" loading="lazy"></div><div class="k">Standard</div><div class="g">138 g</div><div class="mbar"><i style="--w:100%"></i></div><div class="n">Safety factor 1.54</div></div><div class="mcd"><div class="im"><img src="/img/4a5d802dda79.webp" alt="Shape-optimized brake pedal with cut-out windows" loading="lazy"></div><div class="k">Optimized<em>−25%</em></div><div class="g">104 g</div><div class="mbar"><i style="--w:75%"></i></div><div class="n">Safety factor 1.54</div></div><div class="mcd hi"><div class="im"><img src="/img/aee2879600ff.webp" alt="Generative brake pedal, a lattice of thin struts" loading="lazy"></div><div class="k">Generative<em>−59%</em></div><div class="g">56 g</div><div class="mbar"><i style="--w:41%"></i></div><div class="n">Safety factor 1.5</div></div></div><p class="q-note" style="margin:0">From an academic project, simulated in Fusion 360. Masses and safety factors come from the study’s validation tables. Simulation, not a test rig.</p></div><div class="pn p1"><p class="sb"><b style="color:var(--ink)">Triple clamp</b> · Inconel 625 · 2,000 N torsion, 1,000 N tension and compression</p><div class="cs-3"><div class="mcd"><div class="im"><img src="/img/af46d626635c.webp" alt="Standard triple clamp, a solid block with two bores" loading="lazy"></div><div class="k">Standard</div><div class="g">2,509 g</div><div class="mbar"><i style="--w:100%"></i></div><div class="n">Safety factor 2 (min)</div></div><div class="mcd"><div class="im"><img src="/img/f4ae5f2834bb.webp" alt="Shape-optimized triple clamp with a pocket cut into the side" loading="lazy"></div><div class="k">Optimized<em>−26%</em></div><div class="g">1,851 g</div><div class="mbar"><i style="--w:74%"></i></div><div class="n">Safety factor 2 (min)</div></div><div class="mcd hi"><div class="im"><img src="/img/8cb7af2f25e4.webp" alt="Generative triple clamp, bores joined by thin struts" loading="lazy"></div><div class="k">Generative<em>−52%</em></div><div class="g">1,197 g</div><div class="mbar"><i style="--w:48%"></i></div><div class="n">Safety factor 2</div></div></div><p class="q-note" style="margin:0">From an academic project, simulated in Fusion 360. Masses and safety factors come from the study’s validation tables. Simulation, not a test rig.</p></div><div class="pn p2"><p class="sb"><b style="color:var(--ink)">Swing arm</b> · Motorcycle swing arm · load-path study</p><div class="cs-3"><div class="mcd"><div class="im"><img src="/img/9b09fd40d16d.webp" alt="Standard swing arm, a solid forked part" loading="lazy"></div><div class="k">Standard</div><div class="g">Starting part</div><div class="n">The part as designed.</div></div><div class="mcd"><div class="im"><img src="/img/a7bf1e38f5ad.webp" alt="Load path simulation, red where the load flows and blue where it does not" loading="lazy"></div><div class="k">Analysis</div><div class="g">Load path</div><div class="n">Red carries the load. Blue can go.</div></div><div class="mcd hi"><div class="im"><img src="/img/79d80148774a.webp" alt="Generative swing arm, an organic lattice of struts" loading="lazy"></div><div class="k">Generative</div><div class="g">Material kept</div><div class="n">Only where the load flows.</div></div></div><p class="q-note" style="margin:0">Simulation study in Fusion 360. Red marks material that carries the load, blue marks material the part can lose. Mass figures are not shown here.</p></div><span class="cs-hint" style="font:500 12.5px Inter,system-ui,sans-serif;color:var(--ink3)">Try it: switch the part. Same loads and material in every version. Simulation.</span></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">2</span><b>The method</b><span class="q-who">Interactive</span></div><div style="display:flex;flex-direction:column;gap:14px"><div class="card mt-card" data-rv><ol class="mt-st"><li><div class="mt-top"><span class="mt-n">1</span><span class="mt-tag">Start</span></div><b>Real part</b><p>Take an existing, finished component as the baseline.</p><small>Output: the standard part</small></li><li><div class="mt-top"><span class="mt-n">2</span><span class="mt-tag">Fix</span></div><b>Loads and limits</b><p>The same loads, materials and constraints for every version.</p><small>Output: a fair comparison</small></li><li><div class="mt-top"><span class="mt-n">3</span><span class="mt-tag">Optimize</span></div><b>Remove what carries no load</b><p>Shape optimization first, then generative design, with stiffness and weight as the goals.</p><small>Output: optimized and generative versions</small></li><li><div class="mt-top"><span class="mt-n">4</span><span class="mt-tag">Check</span></div><b>Simulation</b><p>Safety factor and displacement, compared with the original.</p><small>Output: the trade-off, in numbers</small></li></ol></div><p class="q-note">Same part, same loads, less metal.</p></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">3</span><b>The trade-off, in numbers</b><span class="q-who">Simulation</span></div><div class="cs-mx" data-rv><div class="r" style="--c:2"><b></b><span class="hi">Brake pedal</span><span class="lo">Triple clamp</span></div><div class="r" style="--c:2"><b>Material</b><span class="hi" data-h="Brake pedal">Titanium 6Al-4V</span><span class="lo" data-h="Triple clamp">Inconel 625</span></div><div class="r" style="--c:2"><b>Load</b><span class="hi" data-h="Brake pedal">2,000 N</span><span class="lo" data-h="Triple clamp">2,000 N torsion, 1,000 N tension and compression</span></div><div class="r" style="--c:2"><b>Mass</b><span class="hi" data-h="Brake pedal">138 g → 56 g (−59%)</span><span class="lo" data-h="Triple clamp">2,509 g → 1,197 g (−52%)</span></div><div class="r" style="--c:2"><b>Displacement</b><span class="hi" data-h="Brake pedal">2.93 mm → 3.75 mm</span><span class="lo" data-h="Triple clamp">0.047 mm → 0.76 mm</span></div><div class="r" style="--c:2"><b>Safety factor</b><span class="hi" data-h="Brake pedal">1.54 → 1.5</span><span class="lo" data-h="Triple clamp">2 → 2</span></div></div><p class="q-note">Masses and safety factors are from the study’s validation tables. Shapes this complex are hard to machine, which is why 3D printing is the natural next step.</p></div></div></section><section id="results" style="background: var(--bg2); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2)"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">04 · Outcome</span><h2 class="h2 hd" style="max-width: 900px">Lighter. Checked. <span class="em">Then made.</span></h2></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">★</span><b>The result</b><span class="q-who">Simulation</span></div><div class="cs-sdw"><div class="cs-big"><b class="disp" data-cnt="">−59%</b><span>brake pedal mass, generative vs standard. <span class="tag">Simulation</span></span><b class="disp" data-cnt="" style="margin-top:12px">−52%</b><span>triple clamp mass, generative vs standard. <span class="tag">Simulation</span></span></div><figure class="ud-sc pi" style="margin:0"><svg class="udsc" viewBox="0 0 1076.4 733.47" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient x1="487.42" y1="814.54" x2="487.42" y2="138.95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="gray" stop-opacity="0.25"/><stop offset="0.54" stop-color="gray" stop-opacity="0.12"/><stop offset="1" stop-color="gray" stop-opacity="0.1"/></linearGradient><linearGradient x1="875.73" y1="813.03" x2="875.73" y2="187.56" gradientTransform="matrix(-1, 0, 0, 1, 1751.04, 0)" xlink:href="#bc224463-365b-4973-a542-782a8bb75c72"/></defs><title>robotics</title><path d="M1130.38,364.35h-91.94V475.79h85.22c.22,1.15.44,2.3.68,3.45h-85.9v89.85l.43-.14c2.43-.85,4.84-1.75,7.23-2.72l1.55-.62q3.66-1.53,7.23-3.23c.84-.39,1.68-.8,2.51-1.22a150,150,0,0,0,36.17-25c.31-.26.6-.55.89-.82,1.46-1.41,2.9-2.85,4.3-4.32.52-.54,1-1.08,1.54-1.64,1.65-1.79,3.24-3.64,4.79-5.5.23-.28.45-.56.68-.82A115.92,115.92,0,0,0,11
