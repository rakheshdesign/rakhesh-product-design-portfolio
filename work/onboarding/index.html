@keyframes bpd{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}45%{transform:translate(55px,0)}60%{transform:translate(55px,calc(var(--bpy,60px)))}85%{opacity:1;transform:translate(90px,calc(var(--bpy,60px)))}100%{opacity:0;transform:translate(95px,calc(var(--bpy,60px)))}}

#bps0:checked~.bp-eco label[for=bps0],#bps1:checked~.bp-eco label[for=bps1],#bps2:checked~.bp-eco label[for=bps2],#bps3:checked~.bp-eco label[for=bps3]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--e2)}

#bps0:focus-visible~.bp-eco label[for=bps0],#bps1:focus-visible~.bp-eco label[for=bps1],#bps2:focus-visible~.bp-eco label[for=bps2],#bps3:focus-visible~.bp-eco label[for=bps3]{outline:2px solid var(--acc);outline-offset:2px}

#bpl0:checked~.bp-lanes .bp-l0,#bpl1:checked~.bp-lanes .bp-l1,#bpl2:checked~.bp-lanes .bp-l2,#bpl3:checked~.bp-lanes .bp-l3{display:flex}

.bp-fs{position:relative;padding:0 18px 0 0;display:flex;flex-direction:column;gap:8px;animation:pop .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 70ms)}

.ob-cards{display:flex;flex-direction:column;gap:12px}
.ob-bar{display:flex;gap:10px;flex-wrap:wrap}
.ob-c{border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--e1);transition:border-color .3s ease,box-shadow .35s ease}
.ob-c:hover{border-color:var(--acc)}
.ob-c[open]{box-shadow:var(--e2);border-color:var(--acc)}
.ob-c summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 22px;min-height:76px;border-radius:22px}
.ob-c summary::-webkit-details-marker{display:none}
.ob-c summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ob-c .n{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 15px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2);transition:background .3s ease,color .3s ease}
.ob-c[open] .n{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
.ob-c .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ob-c .tt b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(18px,1.8vw,22px);font-weight:600;letter-spacing:-.015em;line-height:1.2}
.ob-c .tt span{font-size:15px;color:var(--ink2);line-height:1.45}
.ob-c .rt{display:flex;align-items:center;gap:12px}
.ob-c .rt .tag{white-space:nowrap}
.ob-c .rt svg{width:22px;height:22px;color:var(--ink3);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.ob-c[open] .rt svg{transform:rotate(180deg);color:var(--acc)}
.ob-cb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,56px);padding:6px 22px 26px;align-items:start;animation:obdrop .4s ease both}
@keyframes obdrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ob-mw{width:204px;height:408px;position:relative;flex:none;border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.ob-mw .ob-ph{width:300px;transform:scale(.68);transform-origin:top left;position:absolute;left:0;top:0;border:0;border-radius:0;box-shadow:none;pointer-events:none}
.ob-mw .ob-ph .ob-sc{display:flex;animation:none}
.ob-dl{display:flex;flex-direction:column;gap:18px;margin:0;max-width:640px}
.ob-dl div{display:flex;flex-direction:column;gap:4px}
.ob-dl dt{font:700 12px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ob-dl dd{margin:0;font-size:17px;line-height:1.55;color:var(--ink2)}
.ob-dl dd.c{color:var(--ink);font-weight:500}
.ob-dl .src{font-size:13px;color:var(--ink3)}
@media (max-width:900px){.ob-try{grid-template-columns:minmax(0,1fr);justify-items:center}.ob-side{max-width:none;width:100%}.ob-cb{grid-template-columns:minmax(0,1fr);justify-items:start}}
@media (max-width:640px){.ob-c summary{grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:14px 16px}.ob-c .rt .tag{display:none}.ob-c .tt span{font-size:14px}.ob-cb{padding:4px 16px 22px}.ob-ph{width:min(300px,100%)}}
@media (prefers-reduced-motion:reduce){.ob-wait .ob-dc::after,.ob-sc.on,.ob-cb{animation:none!important}}

.dv-rl b{font:600 17px/1.3 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);transition:color .25s}

@media (min-width:901px){
.dv-rl li+li::before{content:"";position:absolute;top:14px;left:calc(38px - 100%);width:calc(100% - 52px);height:2px;border-radius:2px;background:var(--ink2)}
.dv-rl li+li::after{content:"";position:absolute;top:8.5px;left:-14px;border:5.5px solid transparent;border-left:8px solid var(--ink2);border-right:0}
}
@media (max-width:900px){
.dv-rail{grid-template-columns:minmax(0,1fr)}
.dv-rs{border-right:0;border-bottom:1px dashed var(--line);padding:0 0 18px}

.dv-rl li{padding:0 0 22px 48px}
.dv-rl li:last-child{padding-bottom:0}

.dv-rl li:not(:last-child)::before{content:"";position:absolute;left:14px;top:38px;bottom:4px;width:2px;border-radius:2px;background:var(--ink2)}
}

s type</b><span>Pick the side you are on.</span></span></div><span class="tag ob-tg">Pharmacy · Manufacturer · Wholesaler</span><div class="ob-mw" aria-hidden="true" inert><div class="ob-ph ob-pur"><div class="ob-lg"><svg viewBox="0 0 46 36" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M3 8h30c3 0 5 2 5 5v14c0 3-2 5-5 5H8c-3 0-5-2-5-5z"/><path d="M38 17h5v8h-5"/></svg><b>SAVEO</b><small>Healthcare distribution</small></div><div class="ob-cd"><h6 style="font-size:15px">Select your business type</h6><div class="ob-ty"><div class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9v10h16V9"/><path d="M4 9c0 2 2 2.5 4 2.5S12 11 12 9c0 2 2 2.5 4 2.5S20 11 20 9"/></svg><span><b>Pharmacy</b><span>50,000 SKUs &amp; 500+ companies available. Timely delivery of products.</span></span></div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V9l6 3V9l6 3V6h4l2 14z"/><path d="M3 20h18"/></svg><span><b>Manufacturer/Marketer</b><span>Showcase your products directly to wholesalers &amp; distributors across India.</span></span></div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span><b>Wholesaler/Stockist</b><span>Buy products in bulk at the best market rates &amp; get nationwide delivery in India.</span></span></div></div><div class="ob-sp"></div><button type="button" class="ob-b" tabindex="-1">Next</button></div></div></div><div class="ob-dw"><dl class="ob-dl"><div><dt>Why</dt><dd>Pharmacies, manufacturers and wholesalers want different things from the platform.</dd></div><div><dt>The call</dt><dd class="c">Three cards, each :00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div><div class="ob-tr"><span>WED</span><span>8:00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div><div class="ob-tr"><span>THU</span><span>8:00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div><div class="ob-tr"><span>FRI</span><span>8:00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div><div class="ob-tr"><span>SAT</span><span>8:00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div><div class="ob-tr"><span>SUN</span><span>8:00 AM - 10:00 PM</span><button type="button" tabindex="-1">Add break</button><span class="br">Break 1:00 PM - 2:00 PM</span></div></div></div></div><div class="ob-cta"><button type="button" class="ob-b" tabindex="-1">Continue</button></div></div></div><div class="ob-dw"><dl class="ob-dl"><div><dt>Why</dt><dd>Typing an address and a week of opening hours on a phone is slow.</dd></div><div><dt>The call</dt><dd class="c">“Locate me” fills the address from the device. Store timings start filled with 8:00 AM to 10:00 PM for every day, with Add break for the exceptions and a simple time picker.</dd></div><div><dt>What it gives</dt><dd>Fewer taps for the common case, room for the odd one.</dd></div></dl></div><span class="ob-hint" aria-hidden="true">Hover for the call</span></article><article class="ob-t" tabindex="0" aria-label="Screen 6: Verify documents. Hover or focus for the call I made on it."><div class="ob-th"><span class="n">6</span><span class="tt"><b>Verify documents</b><span>Step 3 of 3</span></span></div><span class="tag ob-tg">Drug licence · GST · PAN</span><div class="ob-mw" aria-hidden="true" inert><div class="ob-ph"><div class="ob-top"><button type="button" tabindex="-1" aria-hidden="true">←</button><b>SAVEO</b><span>Welcome Pharmacy</span></div><div class="ob-body"><div class="ob-st" ><div class="dn"><i>✓</i>Business details</div><div class="dn"><i>✓</i>Store address</div><div class="on"><i>3</i>Verify documents</div></div><div class="ob-sc"><h6>Verify documents</h6><p class="sub">Verify your business documents to start business with us</p><div class="ob-up"><div class="t"><span>Drug licence (Schedule H) <em>*</em></span><div class="bx ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Added</span></div></div><div class="t"><span>Drug licence (Schedule X)</span><div class="bx ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Added</span></div></div><div class="t"><span>GST <em>*</em></span><div class="bx ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Added</span></div></div><div class="t"><span>PAN <em>*</em></span><div class="bx ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Added</span></div></div></div></div></div><div class="ob-cta"><button type="button" class="ob-b" tabindex="-1">Submit for Verification</button></div></div></div><div class="ob-dw"><dl class="ob-dl"><div><dt>Why</dt><dd>A pharmacy supplier has to check licences before it sells. This step cannot be skipped, so it has to be easy.</dd></div><div><dt>The call</dt><dd class="c">Four tiles, each a camera shortcut: Drug licence (Schedule H), Drug licence (Schedule X), GST and PAN. Required ones are starred. A tile turns solid with a tick once the photo is in, and Submit for Verification stays gray until the required ones are done.</dd></div><div><dt>What it gives</dt><dd>A hard requirement feels like four quick photos.</dd></div></dl></div><span class="ob-hint" aria-hidden="true">Hover for the call</span></article><article class="ob-t" tabindex="0" aria-label="Screen 7: Under verification. Hover or focus for the call I made on it."><div class="ob-th"><span class="n">7</span><span class="tt"><b>Under verification</b><span>Never a dead end.</span></span></div><span class="tag ob-tg">Status · Store details · Contact us</span><div class="ob-mw" aria-hidden="true" inert><div class="ob-ph"><div class="ob-top"><button type="button" tabindex="-1" aria-hidden="true">←</button><b>SAVEO</b><span>Welcome Pharmacy</span></div><div class="ob-body"><div class="ob-sc ob-wait"><div class="ob-dc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg></div><h6>Hi, your profile is under verification</h6><p>Stay tuned! Our team is verifying your profile.</p><div class="ob-stk"><button type="button" class="ob-b s" tabindex="-1">Store details</button><button type="button" class="ob-b" tabindex="-1">Contact us</button></div></div></div></div></div><div class="ob-dw"><dl class="ob-dl"><div><dt>Why</dt><dd>Verification takes time. Waiting in silence feels like being ignored.</dd></div><div><dt>The call</dt><dd class="c">“Hi, your profile is under verification. Stay tuned! Our team is verifying your profile.” Store details lets the retailer review what they sent, and Contact us puts a person one tap away.</dd></div><div><dt>What it gives</dt><dd>The retailer knows where they stand, and who to ask.</dd></div></dl></div><span class="ob-hint" aria-hidden="true">Hover for the call</span></article></div>
</div></section>
<section id="calls" class="bp-sec" style="background:var(--bg2)"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><i>2</i><span class="kick">Design calls</span></div>
   <h2 class="h2 hd" style="max-width:900px">Six calls that <span class="em">keep it short.</span></h2>
   <p class="mk-sub">The same idea, again and again: ask for less, ask later, and say where the person stands.</p></div>
  <div class="bp-dec"><div class="card bp-dc"><span class="tag">Call 1</span><h5>Sign up first, onboard second</h5><dl><div><dt>Why</dt><dd>A new retailer should not meet a business form before they have even committed.</dd></div><div><dt>The call</dt><dd class="c">Sign-up asks for a phone number, an OTP and a password. Business questions come after.</dd></div><div><dt>What it gives</dt><dd>A first step that takes seconds.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 2</span><h5>Ask the business type early</h5><dl><div><dt>Why</dt><dd>Pharmacies, manufacturers and wholesalers want different things from Saveo.</dd></div><div><dt>The call</dt><dd class="c">Three type cards, each with its own benefit line. The next screen greets the choice.</dd></div><div><dt>What it gives</dt><dd>The flow feels made for them from step two.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 3</span><h5>Three steps, a visible stepper</h5><dl><div><dt>Why</dt><dd>Long forms feel endless, and people quit what feels endless.</dd></div><div><dt>The call</dt><dd class="c">Business details, store address and documents, with a stepper on top and one primary button.</dd></div><div><dt>What it gives</dt><dd>Progress is visible and each step is small.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 4</span><h5>A quiet button that wakes up</h5><dl><div><dt>Why</dt><dd>Half-filled steps lead to errors on the next screen.</dd></div><div><dt>The call</dt><dd class="c">Continue and Submit stay gray until the step is valid, then turn teal.</dd></div><div><dt>What it gives</dt><dd>Mistakes are caught on the step where they happen.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 5</span><h5>Shortcuts for slow typing</h5><dl><div><dt>Why</dt><dd>Addresses and a week of opening hours are slow to type on a phone.</dd></div><div><dt>The call</dt><dd class="c">Locate me fills the address. Timings start filled, with Add break for the exceptions.</dd></div><div><dt>What it gives</dt><dd>Fewer taps for the common case.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 6</span><h5>Never a dead end</h5><dl><div><dt>Why</dt><dd>Verification takes time, and silence feels like being ignored.</dd></div><div><dt>The call</dt><dd class="c">An under-verification screen says what is happening, with Store details and Contact us.</dd></div><div><dt>What it gives</dt><dd>The retailer knows where they stand.</dd></div></dl></div></div>
</div></section>

<section id="learn" class="bp-sec" style="background:var(--bg2)"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><i>4</i><span class="kick">Takeaways</span></div>
   <h2 class="h2 hd" style="max-width:900px">What I <span class="em">took away.</span></h2></div>
  <div class="bp-tk">
   <div class="mk-rule"><em>Learning 1</em><b>Ask for less, earlier</b><span>One phone number is an easier yes than a business form.</span></div>
   <div class="mk-rule"><em>Learning 2</em><b>Show where they are</b><span>A stepper and a quiet button turn a long form into three small ones.</span></div>
   <div class="mk-rule"><em>Learning 3</em><b>Close the loop</b><span>After submitting, tell people what is happening and who to ask.</span></div>
  </div>

<section id="proto" class="bp-sec"><div class="wrap bp-w">
   <div class="bp-ch"><div class="mk-bn"><i>★</i><span class="kick">Prototype</span></div>

      onOut: function () { self.mx = -200; self.my = -200; },
      crLab: s.curLab ? 'lab' : '',
      crHov: (s.curHov && !s.curLab) ? 'hov' : '',
      curLabel: s.curLab
    });
  }
}

</script>
