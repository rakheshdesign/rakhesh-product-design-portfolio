<section>
<h2>A wedding is India’s biggest family project.</h2>
<p>Before designing, I read the numbers. This is how Indian weddings run, where families struggle, and why a family-first product has room. Every figure has a source. Estimates are labelled.</p>
<a href="#mk-src">SOURCES AND CAVEATS</a>
<h3>About a lakh weddings a day, for six weeks.</h3>
<p>One season, one family at a time. These are trade estimates, not audited counts.</p>
<p>weddings in the 2025 season, packed into about 45 days</p>
<p>spent across that season, in rupees (₹)</p>

<h4>How much does a wedding cost? Depends who you ask.</h4>
<p>2,000+ couples marrying April 2025 to March 2026, up 8% year on year. Skews to couples who use a planning platform.</p>
<p>My read: no official national dataset exists, and three credible sources give three answers. A family has no fair yardstick to plan against.</p>
<h3>Four to nine months. Seven‑plus events. One group chat.</h3>
<p>Most couples plan for 4 to 9 months across 7 or more events. Pick a stage to see where it hurts and what I did about it.</p>
<p>found vendors through word of mouth</p>
<p>Survey samples differ in size and method. WeddingWire India and WedMeGood are wedding platforms, so their couples skew toward people who plan online.</p>
<h3>Parents are online. Mostly.</h3>
<p>The people who sign off are often in their fifties and sixties. Most of them can use a smartphone, but not all. That shapes the product.</p>
<h4>Share of people with smartphone access, by age</h4>
<p>of people aged 60+ can bank online, against 71% of 18–49s</p>
<p>UPI payments in October 2026 alone</p>
<p>internet users in 2025, over half of them rural</p>

<p>These are my inferences from the data, not research findings.</p>
<h3>Half the budget sits with vendors a family must find.</h3>
<p>Venue, catering, decor and photography add up to 45–60% of a typical budget (my sum of the ranges). Jewellery and apparel are retail, with their own channels.</p>
<p>Share of wedding budget. Industry estimate compiled by Kotak MF. These are ranges, not measured values.</p>
<h3>The card is the smallest saving. And the best door.</h3>
<p>Move the sliders. Printing is real money, but against a wedding budget it is tiny. What the card holds is worth more: the date, the city, the language and the guest list.</p>
<p>50% of cards go digital. The saving is 0.2% of an average ₹29.6 lakh budget.</p>
<p>Excludes courier, studio visits and 7–15 days of lead time. Illustration with seller-quoted prices. ShubhViva has no usage or savings data yet.</p>
<h3>One family, many vendors. One place to hold it.</h3>
<p>The invitation starts the loop. What a family shares travels to vendors as intent. What vendors return is trust.</p>
<h4>Families</h4>
<h4>ShubhViva</h4>
<h4>Vendors</h4>
<p>Three hypotheses to test. None is validated, and no revenue model is decided.</p>
<p>Each card reaches about 330 guests, so every family acts as a free channel.</p>
<p>A family with a date, city and ceremony list is a qualified buyer for the 45–60% of budget that vendors fight over.</p>
<p>Referrals lead and only 1 in 3 couples read reviews, so a family’s trusted shortlist is worth more than a ranking.</p>
<p>WedMeGood and WeddingWire India are established. WedMeGood has launched an AI chatbot, Wedika, and says 24% of its vendors use AI tools.</p>
<p>Start in the family’s language, with the invitation, then grow into planning and vendors. This is my positioning, not a market finding.</p>
<p>No official national dataset exists for wedding spend in India. These figures come from a trade body, platform surveys, news reports and vendor blogs, and they do not reconcile. Read them as ranges.</p>

#mkl0:checked~.mk-lens label[for=mkl0] .mk-fl,#mkl1:checked~.mk-lens label[for=mkl1] .mk-fl,#mkl2:checked~.mk-lens label[for=mkl2] .mk-fl{background:var(--fill)}

#mkl0:focus-visible~.mk-lens label[for=mkl0],#mkl1:focus-visible~.mk-lens label[for=mkl1],#mkl2:focus-visible~.mk-lens label[for=mkl2]{outline:2px solid var(--acc);outline-offset:2px}
.mk-take{font-size:17px;line-height:1.55;margin:0;padding:14px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);color:var(--ink2)}

#mkst0:checked~.mk-panels .mk-sp0,#mkst1:checked~.mk-panels .mk-sp1,#mkst2:checked~.mk-panels .mk-sp2,#mkst3:checked~.mk-panels .mk-sp3,#mkst4:checked~.mk-panels .mk-sp4{display:grid;animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
#mkst0:checked~.mk-tl label[for=mkst0],#mkst1:checked~.mk-tl label[for=mkst1],#mkst2:checked~.mk-tl label[for=mkst2],#mkst3:checked~.mk-tl label[for=mkst3],#mkst4:checked~.mk-tl label[for=mkst4]{border-color:var(--acc);background:var(--card2)}

#mkst0:focus-visible~.mk-tl label[for=mkst0],#mkst1:focus-visible~.mk-tl label[for=mkst1],#mkst2:focus-visible~.mk-tl label[for=mkst2],#mkst3:focus-visible~.mk-tl label[for=mkst3],#mkst4:focus-visible~.mk-tl label[for=mkst4]{outline:2px solid var(--acc);outline-offset:2px}
/* parents */
.mk-par{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.mk-box{padding:28px;display:flex;flex-direction:column;gap:20px}

#mkb0:focus-visible~.mk-ch label[for=mkb0],#mkb1:focus-visible~.mk-ch label[for=mkb1],#mkb2:focus-visible~.mk-ch label[for=mkb2]{outline:2px solid var(--acc);outline-offset:2px}

/* calc */
.mk-calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.mk-ctl{display:flex;flex-direction:column;gap:22px;padding:28px}

/* eco */
.mk-eco{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.2fr) 92px minmax(0,1fr);gap:0;align-items:stretch}

.dv-an{position:absolute;top:22px;left:24px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;background:var(--fill);color:var(--fillink);z-index:1}
.dv-ac:not(:last-child)::after{content:"";position:absolute;right:-12px;top:96px;width:10px;height:10px;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);rotate:45deg;z-index:2}
@media (max-width:1000px){.dv-arc{grid-template-columns:1fr 1fr}.dv-ac:not(:last-child)::after{display:none}}
@media (max-width:860px){.dv-hd{grid-template-columns:1fr;gap:18px}.dv-hd .dv-fgx{max-width:280px}}
@media (max-width:560px){.dv-arc{grid-template-columns:1fr}.dv-hd .dv-fgx{max-width:220px}}


/*rail*/
.dv-rail{display:grid;grid-template-columns:minmax(210px,290px) minmax(0,1fr);gap:clamp(20px,3vw,44px);padding:clamp(20px,2.4vw,32px);align-items:center;box-shadow:var(--e2)}
.dv-rs{display:flex;flex-direction:column;gap:8px;padding-right:clamp(16px,2.4vw,36px);border-right:1px dashed var(--line);min-width:0}
.dv-rs .kick{color:var(--acc)}
.dv-rs b{font:700 clamp(44px,5.2vw,72px)/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.03em;color:var(--acc)}
.dv-rs b.s{font-size:clamp(34px,3.6vw,50px);line-height:1.05}

.dv-rl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.dv-rl li{position:relative;padding:0 18px 0 0;min-width:0}
.dv-rl a{display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;border-radius:14px}
.dv-rl a:focus-visible{outline:2px solid var(--acc);outline-offset:6px}
.dv-rn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;font-style:normal;background:var(--fill);color:var(--fillink);margin-bottom:8px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.dv-rl a:hover .dv-rn{transform:scale(1.12);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 18%,transparent)}
.dv-rl .kick{color:var(--acc)}
.dv-rl b{font:600 17px/1.3 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);transition:color .25s}
.dv-rl a:hover b{color:var(--acc)}
@media (min-width:901px){
.dv-rl li+li::before{content:"";position:absolute;top:14px;left:calc(38px - 100%);width:calc(100% - 52px);height:2px;border-radius:2px;background:var(--ink2)}
.dv-rl li+li::after{content:"";position:absolute;top:8.5px;left:-14px;border:5.5px solid transparent;border-left:8px solid var(--ink2);border-right:0}
}

.dv-rail{grid-template-columns:minmax(0,1fr)}
.dv-rs{border-right:0;border-bottom:1px dashed var(--line);padding:0 0 18px}
.dv-rl{grid-template-columns:minmax(0,1fr)}
.dv-rl li{padding:0 0 22px 48px}
.dv-rl li:last-child{padding-bottom:0}
.dv-rn{position:absolute;left:0;top:0;margin:0}
.dv-rl li:not(:last-child)::before{content:"";position:absolute;left:14px;top:38px;bottom:4px;width:2px;border-radius:2px;background:var(--ink2)}
}

<div class="mk-beat" data-mk>
  <div class="mk-bh"><div class="mk-bn"><i>1</i><span class="kick">Scale</span></div>
  <h3 class="mk-h3">About a lakh weddings a day, <span class="em">for six weeks.</span></h3>
  <p class="mk-sub">One season, one family at a time. These are trade estimates, not audited counts.</p></div>
  <div class="mk-grid4">
    <div class="card mk-stat" style="--i:0"><div class="mk-big"><span class="mk-num" data-to="46">46</span><u class="w">lakh</u></div><p>weddings in the 2025 season, packed into about 45 days</p><span class="mk-src">CAIT · trade estimate</span></div>
    <div class="card mk-stat" style="--i:1"><div class="mk-big"><span class="mk-num" data-to="6.5">6.5</span><u class="w">lakh crore</u></div><p>spent across that season, in rupees (₹)</p><span class="mk-src">CAIT · trade estimate</span></div>
    <div class="card mk-stat" style="--i:2"><div class="mk-big"><span class="mk-num" data-to="87">87</span><u>%</u></div><p>of the wedding market is unorganized</p><span class="mk-src">Reported estimate · Kotak MF</span></div>
    <div class="card mk-stat" style="--i:3"><div class="mk-big"><span class="mk-num" data-to="2">2</span><u>×</u></div><p>what a family spends on one wedding versus 18 years of a child’s schooling</p><span class="mk-src">Jefferies, 2024 · via Kotak MF</span></div>
  </div>
  <input class="mk-r" type="radio" name="mkl" id="mkl0" aria-label="Trade body"><input class="mk-r" type="radio" name="mkl" id="mkl1" aria-label="Couples survey, 2024"><input class="mk-r" type="radio" name="mkl" id="mkl2" aria-label="Couples survey, 2025–26" checked>
  <div class="card mk-lens">
    <h4>How much does a wedding cost? <span class="em" style="font-size:1.1em">Depends who you ask.</span></h4>
    <div class="mk-rows"><label class="mk-row" for="mkl0"><span class="mk-rl">Trade body<small>CAIT, 2025 season</small></span><span class="mk-tr"><span class="mk-fl" style="--v:31.1"></span></span><span class="mk-val">₹14 L</span></label><label class="mk-row" for="mkl1"><span class="mk-rl">Couples survey, 2024<small>WeddingWire India</small></span><span class="mk-tr"><span class="mk-fl" style="--v:65.8"></span></span><span class="mk-val">₹29.6 L</span></label><label class="mk-row" for="mkl2"><span class="mk-rl">Couples survey, 2025–26<small>WedMeGood</small></span><span class="mk-tr"><span class="mk-fl" style="--v:87.8"></span></span><span class="mk-val">₹39.5 L</span></label></div>
    <p class="mk-ln mk-ln0">My arithmetic: ₹6.5 lakh crore ÷ 46 lakh weddings ≈ ₹14 lakh. It averages every wedding, small ones included.</p><p class="mk-ln mk-ln1">1,500+ couples who married in 2024, surveyed through its app. Up from ₹20 lakh in 2022.</p><p class="mk-ln mk-ln2">2,000+ couples marrying April 2025 to March 2026, up 8% year on year. Skews to couples who use a planning platform.</p>
    <p class="mk-take"><b>My read:</b> no official national dataset exists, and three credible sources give three answers. A family has no fair yardstick to plan against.</p>
  </div>
</div>

<div class="mk-beat" data-mk>
  <div class="mk-bh"><div class="mk-bn"><i>2</i><span class="kick">Planning</span></div>
  <h3 class="mk-h3">Four to nine months. Seven‑plus events. <span class="em">One group chat.</span></h3>

  <div class="mk-bh"><div class="mk-bn"><i>3</i><span class="kick">Parents</span></div>
  <h3 class="mk-h3">Parents are online. <span class="em">Mostly.</span></h3>
  <p class="mk-sub">The people who sign off are often in their fifties and sixties. Most of them can use a smartphone, but not all. That shapes the product.</p></div>

    <div style="display:flex;flex-direction:column;gap:6px"><span class="kick" style="color:var(--acc)">Design rules I took from this</span><p class="mk-sub" style="font-size:16px">These are my inferences from the data, not research findings.</p></div></div>
  <div class="mk-rules">
    <div class="mk-rule" style="--i:0"><em>Rule 1</em><b>Share a link, not an app</b><span>WhatsApp is the front door. A card should open in one tap.</span></div>
    <div class="mk-rule" style="--i:1"><em>Rule 2</em><b>Write in the family’s language</b><span>Six languages in the studio, with mixed wording allowed.</span></div>
    <div class="mk-rule" style="--i:2"><em>Rule 3</em><b>One action per screen</b><span>Unfinished parts say Soon. Nothing is over-promised.</span></div>
    <div class="mk-rule" style="--i:3"><em>Rule 4</em><b>Parents decide, grandparents receive</b><span>Design the logged-in tools for the fifty-somethings. Give elders a link.</span></div>
  </div>
</div>

<div class="mk-beat" data-mk>
  <div class="mk-bh"><div class="mk-bn"><i>4</i><span class="kick">Money</span></div>
  <h3 class="mk-h3">Half the budget sits with vendors <span class="em">a family must find.</span></h3>
  <p class="mk-sub">Venue, catering, decor and photography add up to 45–60% of a typical budget (my sum of the ranges). Jewellery and apparel are retail, with their own channels.</p></div>
  <input class="mk-r" type="radio" name="mkb" id="mkb0" aria-label="All" checked><input class="mk-r" type="radio" name="mkb" id="mkb1" aria-label="Vendors a family must find and book"><input class="mk-r" type="radio" name="mkb" id="mkb2" aria-label="Retail the family buys">
  <div class="mk-ch"><label for="mkb0">All</label><label for="mkb1">Vendors a family must find and book</label><label for="mkb2">Retail the family buys</label></div>
  <div class="card mk-bud">
    <div class="mk-axis"><div></div><div><span>0%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span></div><div></div></div>
    <div class="mk-br v"><span class="nm">Venue and catering</span><span class="mk-brt"><span class="mk-brf" style="--a:30;--b:35"></span></span><span class="vl">30–35%</span></div><div class="mk-br rt"><span class="nm">Jewellery</span><span class="mk-brt"><span class="mk-brf" style="--a:15;--b:25"></span></span><span class="vl">15–25%</span></div><div class="mk-br rt"><span class="nm">Apparel</span><span class="mk-brt"><span class="mk-brf" style="--a:10;--b:15"></span></span><span class="vl">10–15%</span></div><div class="mk-br v"><span class="nm">Decor and entertainment</span><span class="mk-brt"><span class="mk-brf" style="--a:10;--b:15"></span></span><span class="vl">10–15%</span></div><div class="mk-br v"><span class="nm">Photo and video</span><span class="mk-brt"><span class="mk-brf" style="--a:5;--b:10"></span></span><span class="vl">5–10%</span></div><div class="mk-br "><span class="nm">Everything else</span><span class="mk-brt"><span class="mk-brf" style="--a:9.5;--b:10.5"></span></span><span class="vl">~10%</span></div>
    <p class="mk-note">Share of wedding budget. Industry estimate compiled by Kotak MF. These are ranges, not measured values.</p>
    <p class="mk-ln mk-bn1" style="border-left:3px solid var(--fill);padding-left:14px;font-size:16px;color:var(--ink2);margin:0">Each of these is a different vendor to find, compare and book. That is where trust and availability decide the choice.</p>
    <p class="mk-ln mk-bn2" style="border-left:3px solid var(--fill);padding-left:14px;font-size:16px;color:var(--ink2);margin:0">Jewellery and apparel are shopped in person and through established retailers. Not where a family-run platform starts.</p>
  </div>
</div>

<div class="mk-beat" data-mk>
  <div class="mk-bh"><div class="mk-bn"><i>5</i><span class="kick">The invitation</span></div>
  <h3 class="mk-h3">The card is the <span class="em">smallest saving.</span> And the best door.</h3>
  <p class="mk-sub">Move the sliders. Printing is real money, but against a wedding budget it is tiny. What the card holds is worth more: the date, the city, the language and the guest list.</p></div>
  <div class="mk-calc" id="mkcalc">
    <div class="card mk-ctl">
      <div class="mk-f"><label for="mkn">Invitations (households)<output id="mkno">250</output></label><input id="mkn" type="range" min="50" max="600" step="10" value="250"><small>Average guest count is about 330 people, but one card serves a household.</small></div>
      <div class="mk-f"><label for="mkp">Printed price per card<output id="mkpo">₹40</output></label><input id="mkp" type="range" min="10" max="300" step="5" value="40"><small>Sellers quote ₹15–40 on average and up to ₹300 for premium boxes.</small></div>
      <div class="mk-f"><label for="mks">Still printed<output id="mkso">50%</output></label><input id="mks" type="range" min="0" max="100" step="5" value="50"><small>54% of couples still choose a physical card, so most families will print some.</small></div>

<div class="mk-beat" data-mk>
  <div class="mk-bh"><div class="mk-bn"><i>6</i><span class="kick">The ecosystem</span></div>
  <h3 class="mk-h3">One family, many vendors. <span class="em">One place</span> to hold it.</h3>
  <p class="mk-sub">The invitation starts the loop. What a family shares travels to vendors as intent. What vendors return is trust.</p></div>
  <div class="mk-eco">
    <div class="card mk-col3"><span class="kick">Demand</span><h4>Families</h4><div class="mk-hs"><div>Couple<small>decide and book</small></div><div>Parents<small>approve, pay, invite</small></div><div>Elders<small>receive on WhatsApp</small></div><div>Guests, about 330<small>RSVP and travel</small></div></div></div>
    <div class="mk-gut"><div><svg viewBox="0 0 64 16" aria-hidden="true"><path class="ln" d="M2 8H52"/><path class="ah" d="M50 3L62 8L50 13Z"/><circle class="dot" cx="4" cy="8" r="3"/></svg>date, city, language, guests</div><div class="rev"><svg viewBox="0 0 64 16" aria-hidden="true"><path class="ln" d="M2 8H52"/><path class="ah" d="M50 3L62 8L50 13Z"/><circle class="dot" cx="4" cy="8" r="3"/></svg>quotes, reviews, availability</div></div>
    <div class="card mk-col3 mk-hub"><span class="kick">The platform</span><h4>ShubhViva</h4>
      <div class="mk-hs"><div class="live">Invitation studio<span class="tag ok">Live</span></div><div>Celebration story<span class="tag">Building</span></div><div>Event planner<span class="tag">Building</span></div><div>Guest experience<span class="tag">Building</span></div><div>Memories<span class="tag">Building</span></div></div></div>
    <div class="mk-gut"><div><svg viewBox="0 0 64 16" aria-hidden="true"><path class="ln" d="M2 8H52"/><path class="ah" d="M50 3L62 8L50 13Z"/><circle class="dot" cx="4" cy="8" r="3"/></svg>shortlists, enquiries</div><div class="rev"><svg viewBox="0 0 64 16" aria-hidden="true"><path class="ln" d="M2 8H52"/><path class="ah" d="M50 3L62 8L50 13Z"/><circle class="dot" cx="4" cy="8" r="3"/></svg>availability, quotes</div></div>
    <div class="card mk-col3"><span class="kick">Supply</span><h4>Vendors</h4><div class="mk-hs"><div>Venue<small>dates, price</small></div><div>Caterer<small>menu, headcount</small></div><div>Decor<small>theme, budget</small></div><div>Photo and video<small>events, style</small></div><div>Priest and printer<small>dates, language</small></div></div></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px"><span class="kick" style="color:var(--acc)">Business lens</span><p class="mk-sub" style="font-size:16px">Three hypotheses to test. None is validated, and no revenue model is decided.</p></div>
  <div class="mk-hyp">
    <div class="card mk-hc mk-stat" style="--i:0"><span class="tag">Hypothesis 1</span><h5>Cards travel</h5><p>Each card reaches about 330 guests, so every family acts as a free channel.</p><div class="tst"><b>Test:</b> cards shared per event, and opens per card.</div></div>
    <div class="card mk-hc mk-stat" style="--i:1"><span class="tag">Hypothesis 2</span><h5>Intent is the asset</h5><p>A family with a date, city and ceremony list is a qualified buyer for the 45–60% of budget that vendors fight over.</p><div class="tst"><b>Test:</b> vendor enquiries per event.</div></div>
    <div class="card mk-hc mk-stat" style="--i:2"><span class="tag">Hypothesis 3</span><h5>Vendors pay for fit</h5><p>Referrals lead and only 1 in 3 couples read reviews, so a family’s trusted shortlist is worth more than a ranking.</p><div class="tst"><b>Test:</b> repeat bookings from shared shortlists.</div></div>
  </div>
  <div class="mk-cmp">
    <div class="card mk-hc"><span class="tag">Who is already here</span><h5>Wedding platforms center on couple and vendor</h5><p>WedMeGood and WeddingWire India are established. WedMeGood has launched an AI chatbot, Wedika, and says 24% of its vendors use AI tools.</p></div>
    <div class="card mk-hc"><span class="tag ok">ShubhViva’s bet</span><h5>Center on the whole family, from the card</h5><p>Start in the family’s language, with the invitation, then grow into planning and vendors. This is my positioning, not a market finding.</p></div>
  </div>
</div>

ds families are proud to send.</dd></div></dl></div><div class="card cs-dc" data-rv><span class="tag">Call 3</span><h5>Private by default</h5><dl><div><dt>Why</dt><dd>Wedding details and payments are personal.</dd></div><div><dt>The call</dt><dd class="c">Words stay in the studio. Payments and quotes stay private.</dd></div><div><dt>What it gives</dt><dd>Families stay in control.</dd></div></dl></div></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">2</span><b>The journey</b><span class="q-who">Interactive</span></div><div style="display:flex;flex-direction:column;gap:14px"><style>#svj0:checked~.cs-demo .cs-pick label[for=svj0]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#svj0:checked~.cs-demo .cs-o0{display:flex}#svj0:focus-visible~.cs-demo .cs-pick label[for=svj0]{outline:2px solid var(--acc);outline-offset:2px}#svj1:checked~.cs-demo .cs-pick label[for=svj1]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#svj1:checked~.cs-demo .cs-o1{display:flex}#svj1:focus-visible~.cs-demo .cs-pick label[for=svj1]{outline:2px solid var(--acc);outline-offset:2px}#svj2:checked~.cs-demo .cs-pick label[for=svj2]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#svj2:checked~.cs-demo .cs-o2{display:flex}#svj2:focus-visible~.cs-demo .cs-pick label[for=svj2]{outline:2px solid var(--acc);outline-offset:2px}#svj3:checked~.cs-demo .cs-pick label[for=svj3]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#svj3:checked~.cs-demo .cs-o3{display:flex}#svj3:focus-visible~.cs-demo .cs-pick label[for=svj3]{outline:2px solid var(--acc);outline-offset:2px}#svj4:checked~.cs-demo .cs-pick label[for=svj4]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#svj4:checked~.cs-demo .cs-o4{display:flex}#svj4:focus-visible~.cs-demo .cs-pick label[for=svj4]{outline:2px solid var(--acc);outline-offset:2px}</style><input class="cs-r" type="radio" name="svj" id="svj0" aria-label="Invitation studio" checked><input class="cs-r" type="radio" name="svj" id="svj1" aria-label="Celebration story"><input class="cs-r" type="radio" name="svj" id="svj2" aria-label="Event planner"><input class="cs-r" type="radio" name="svj" id="svj3" aria-label="Guest experience"><input class="cs-r" type="radio" name="svj" id="svj4" aria-label="Memories"><div class="cs-demo"><div class="cs-pick"><label for="svj0"><b>Invitation studio</b><span>Live</span></label><label for="svj1"><b>Celebration story</b><span>Building</span></label><label for="svj2"><b>Event planner</b><span>Building</span></label><label for="svj3"><b>Guest experience</b><span>Building</span></label><label for="svj4"><b>Memories</b><span>Building</span></label></div><div class="card cs-out"><div class="cs-o0"><div class="cs-res">Names, date, venue, design and heading language, with the card redrawing as you type. Live now.</div></div><div class="cs-o1"><div class="cs-res">One identity for the event: colors, type, motifs and languages. In development.</div></div><div class="cs-o2"><div class="cs-res">Ceremonies across days and venues, tasks for family members, shortlisted vendors. In development.</div></div><div class="cs-o3"><div class="cs-res">An RSVP link, directions and a simple day-of view on phones. In development.</div></div><div class="cs-o4"><div class="cs-res">A private place for guest photos and wishes. In development.</div></div></div></div><p class="q-note">Try it: pick a stage. Studio is live. The rest of the journey is in development.</p></div></div></div></section><section id="product"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">02 · The product</span><h2 class="h2 hd" style="max-width: 900px">The product, <span class="em">in the browser.</           <h3 class="disp" style="margin: 0; font-size: clamp(20px, calc(20px + (100vw - 390px) * 0.00741), 26px); line-height: 1.15">Type your names, watch the card</h3>
