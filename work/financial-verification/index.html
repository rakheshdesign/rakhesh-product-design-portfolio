.fr-fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.fr-lps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fr-lpw{display:flex;flex-direction:column;gap:10px;min-width:0}

.fr-gc{padding:28px;display:flex;flex-direction:column;gap:16px}

.fr-lad>div{display:flex;flex-direction:column;margin-top:8px}

.fr-q{margin:0;position:relative;background:var(--card);border:1.5px solid var(--acc);border-radius:32px;padding:clamp(28px,4vw,56px);box-shadow:0 0 0 1px var(--acc),0 30px 80px -34px var(--glow);display:flex;flex-direction:column;gap:28px}

raphrased</span></div><div class="ud-bs"><span class="ub " style="--k:0">Manual upload is slow and error-prone.</span><span class="ub " style="--k:1">Underwriting needs stronger evidence, <em>faster</em>.</span><span class="ub " style="--k:2">And it has to work for the US and international markets.</span></div></div></div><div class="cs-sp" style="grid-template-columns:1fr"><div data-rv><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.500"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg></i><b>Customers</b><p>Friction and mistakes while uploading documents.</p></div><div data-rv><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.5 3 8 7.5 9.5 4.5-1.500 7.500-5 7.500-9.500V6z"/><path d="m9 12 2.200 2.200L15 10.500"/></svg></i><b>The business</b><p>Manual verification of every upload.</p></div><div data-rv><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i><b>Approvals</b><p>Slower decisions on a higher limit.</p></div></div></div></div><p class="q-xyz reveal" data-rv=""><b>Scoped</b> the evidence step of a credit-limit request, <b>as measured by</b> three costs named by the business (customer friction, manual verification, slower approvals), <b>by</b> mapping the journey end to end</p></div></section><section id="crit" style="background: var(--bg2); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2)"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">02 · Design’s push-back</span><h2 class="h2 hd" style="max-width: 900px">Don’t remove it. <span class="em">Lead with better.</span></h2><span class="q-dec"><b>Deci
