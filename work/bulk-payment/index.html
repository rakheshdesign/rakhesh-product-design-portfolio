<h1>Four ways money arrives. One place to settle it.</h1>
<p>Cut collection-team effort by 5× (reported), as measured by daily work efficiency, by replacing Excel tallying with one Bulk Settlement dashboard that maps every payment to its invoices.</p>
<p>daily work efficiency for the collection team</p>
<p>payment sources settled in one dashboard</p>
<p>shared flow: search, select, map, review</p>
<p>Try it. Change a tab, edit an amount, untick an invoice, then press Map. Sample data only.</p>
<h4>← Bulk settlement</h4>
</section>
<section>
<h2>Four sources, one settlement flow.</h2>
<p>1 THE PROBLEM Excel tallying. Slow, error-prone, full of conflicts.</p>
<p>2 FOUR SOURCES Bank, credit note, salary, manual. One place.</p>
<p>3 ONE FLOW Search, select, map, review, repeat.</p>
<p>4 RESULT Fewer errors. Work five times lighter, as reported.</p>
</section>
<section>
<h2>Money came in. Matching it was manual.</h2>
<p>The collection and finance team tallied several payment methods against order invoices by typing into Excel. It was slow, easy to get wrong, and a steady source of conflicts.</p>
</section>
<section>
<h2>Four sources, one destination.</h2>
<p>Money reaches Saveo in four ways. Each one has to end up against the right invoices. Pick a source to see what it does.</p>
<h4>Bank statement</h4>
<p>Fetch the company’s bank statements and match a UTR (the bank’s transaction reference) to the order invoices it pays.</p>
</section>
<section>
<h2>Same seven steps. Only the start changes.</h2>
<p>Every lane finds a payment, finds invoices, maps one to the other, reviews, and loops back. Pick a lane.</p>
</section>
<section>
<h2>Five calls that cut the errors.</h2>
<p>Each call comes from how the flow works in the dashboard.</p>

.pxf .pxi{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.pxf .pxif{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.pxf .pxlt{position:absolute;opacity:0;pointer-events:none}
.pxf .pxlt:checked~.pxif{display:block}
.pxf .pxlt:checked~.pxi{visibility:hidden}
.pxsw{position:absolute;right:14px;bottom:14px;z-index:2;cursor:pointer;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);transition:transform .2s}
.pxsw:hover{transform:translateY(-2px)}
.pxsw .pxoff{display:none}
.pxlt:checked~.pxsw .pxon{display:none}.pxlt:checked~.pxsw .pxoff{display:inline}
.pxlt:focus-visible~.pxsw{outline:2px solid var(--acc);outline-offset:2px}
.pxc{display:flex;flex-direction:column;gap:14px}
.pxc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pxc li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:var(--ink2)}
.pxc li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:8px}
.px>input:focus-visible~.pxtabs label{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:1000px){.pxp{grid-template-columns:1fr}}
#pxa0:checked~.pxp0{display:grid}#pxa0:checked~.pxtabs label[for=pxa0]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa1:checked~.pxp1{display:grid}#pxa1:checked~.pxtabs label[for=pxa1]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa2:checked~.pxp2{display:grid}#pxa2:checked~.pxtabs label[for=pxa2]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa3:checked~.pxp3{display:grid}#pxa3:checked~.pxtabs label[for=pxa3]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa4:checked~.pxp4{display:grid}#pxa4:checked~.pxtabs label[for=pxa4]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa5:checked~.pxp5{display:grid}#pxa5:checked~.pxtabs label[for=pxa5]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}

.pxf.hc{padding-top:38px;box-sizing:border-box}
.pxbar{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:3}
.pxbar i{display:block;width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.pxbar span{flex:1;min-width:0;margin-left:8px;padding:5px 14px;border-radius:999px;background:var(--card2);color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pxf.hc .pxi{height:100%}
.pxf.hc .pxif{top:38px;height:calc(100% - 38px)}
.rlw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:center}
.rlw .rlt{display:flex;flex-direction:column;gap:18px;max-width:560px}
.rl{position:relative;width:min(340px,100%);aspect-ratio:9/16;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--e3);background:#05070c;margin:0 auto}
.rl .rlk{position:absolute;opacity:0;pointer-events:none}
.rl .rlp{display:block;width:100%;height:100%;object-fit:cover}
.rl .rli{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.rl .rlk:checked~.rli{display:block}
.rl .rlk:checked~.rlp,.rl .rlk:checked~.rlplay{display:none}
.rlplay{position:absolute;left:50%;top:76%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 36px -10px rgba(0,0,0,.6);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.rlplay:hover{transform:scale(1.08)}
.rlplay:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:rlr 2.2s ease-out infinite}
@keyframes rlr{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.rlbk{position:absolute;left:12px;top:12px;z-index:3;display:none;min-height:36px;align-items:center;padding:0 14px;border-radius:999px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:13px;cursor:pointer}
.rl .rlk:checked~.rlbk{display:inline-flex}
.rlk:focus-visible~.rlplay{outline:2px solid var(--acc);outline-offset:4px}
@media (max-width:900px){.rlw{grid-template-columns:1fr}}
#pxa6:checked~.pxp6{display:grid}#pxa6:checked~.pxtabs label[for=pxa6]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa7:checked~.pxp7{display:grid}#pxa7:checked~.pxtabs label[for=pxa7]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}
#pxa8:checked~.pxp8{display:grid}#pxa8:checked~.pxtabs label[for=pxa8]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}

/*tip*/.tipw{position:relative;display:inline-flex}
.tipc{position:absolute;top:calc(100% + 12px);right:0;z-index:60;width:max-content;max-width:min(250px,calc(100vw - 32px));padding:12px 14px;border-radius:14px;background:var(--btn);color:var(--btnink);font-size:13px;line-height:1.45;font-weight:400;text-align:left;box-shadow:var(--e3);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
.tipc::before{content:"";position:absolute;top:-5px;right:17px;width:10px;height:10px;background:inherit;transform:rotate(45deg);border-radius:2px}
.tipc b{display:block;font-weight:600;margin-bottom:2px}
.tipw:hover .tipc,.tipw:focus-within .tipc{opacity:1;visibility:visible;transform:none}
/*mk-start*/
#market{background:var(--bg);border-top:1px solid var(--line2);position:relative}
.mk-fgx{--u-p:var(--fill);--u-d1:#46526F;--u-d2:#2B2F3B;--u-d3:#1B1E2B;--u-g1:#E4E9F0;--u-g2:#EEF2F7;--u-g3:#D2DAE4;--u-w:#fff;margin:0;display:block}
.th[data-theme="dark"] .mk-fgx{--u-p:var(--acc);--u-d1:#8A97B0;--u-d2:#AEB8CB;--u-d3:#DDE3EE;--u-g1:#1A212C;--u-g2:#151A22;--u-g3:#2A3342;--u-w:#0F131B}
.mk-fgx .udsc{width:100%;height:100%;display:block;max-height:300px;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.mk-fgx:hover .udsc{transform:translateY(-5px)}
.mk-wrap{padding-top:96px;padding-bottom:96px;display:flex;flex-direction:column;gap:88px}
.mk-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:center}
.mk-head .mk-fgx{max-width:360px;justify-self:center}
.mk-beat{display:flex;flex-direction:column;gap:28px}
.mk-bh{display:flex;flex-direction:column;gap:12px}
.mk-bn{display:flex;align-items:center;gap:12px}
.mk-bn i{font-style:normal;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:13px;width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--fillink);display:inline-flex;align-items:center;justify-content:center}
.mk-h3{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:clamp(28px,3.4vw,46px);line-height:1.1;letter-spacing:-0.025em;text-wrap:balance;max-width:900px}
.mk-sub{margin:0;max-width:760px;font-size:18px;line-height:1.6;color:var(--ink2)}
.mk-note{font-size:14px;line-height:1.5;color:var(--ink3);margin:0}
.mk-src{display:inline-flex;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.mk-grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px}
.mk-stat{padding:24px;display:flex;flex-direction:column;gap:8px;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease,border-color .3s ease}
.mk-stat:hover{transform:translateY(-4px);box-shadow:var(--e3);border-color:var(--acc)}
.mk-big{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;letter-spacing:-0.03em;font-size:clamp(34px,3.6vw,52px);line-height:1.05;display:flex;align-items:baseline;gap:0;flex-wrap:wrap}
.mk-big u.w{margin-left:8px}
.mk-big u{margin-left:3px}
.mk-big u{text-decoration:none;font-size:.46em;color:var(--acc);font-weight:600;letter-spacing:0}
.mk-stat p{margin:0;font-size:16px;line-height:1.45;color:var(--ink2)}
.mk-r{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
/* lens */
.mk-lens{padding:28px;display:flex;flex-direction:column;gap:20px;position:relative}
.mk-lens h4,.mk-box h4{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:clamp(20px,2vw,24px);line-height:1.2}
.mk-rows{display:flex;flex-direction:column;gap:12px}
.mk-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:14px;align-items:center;cursor:pointer;padding:6px 8px;margin:-6px -8px;border-radius:14px;transition:background .25s ease}
.mk-row:hover{background:var(--card2)}
.mk-rl{font-size:15px;font-weight:600;line-height:1.3}
.mk-rl small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.mk-tr{height:30px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);overflow:hidden;position:relative}
.mk-fl{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ink3);width:calc(var(--v) * 1%);transform-origin:left;transition:background .3s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.mk-js .mk-beat:not(.in) .mk-fl{transform:scaleX(0)}
.mk-val{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:20px;text-align:right}
#mkl0:checked~.mk-lens label[for=mkl0] .mk-fl,#mkl1:checked~.mk-lens label[for=mkl1] .mk-fl,#mkl2:checked~.mk-lens label[for=mkl2] .mk-fl{background:var(--fill)}
#mkl0:checked~.mk-lens label[for=mkl0],#mkl1:checked~.mk-lens label[for=mkl1],#mkl2:checked~.mk-lens label[for=mkl2]{background:var(--card2)}
.mk-ln{display:none;font-size:16px;line-height:1.55;color:var(--ink2);border-left:3px solid var(--fill);padding:2px 0 2px 14px}
#mkl0:checked~.mk-lens .mk-ln0,#mkl1:checked~.mk-lens .mk-ln1,#mkl2:checked~.mk-lens .mk-ln2{display:block}
:is(#mkl0,#mkl1,#mkl2):focus-visible~.mk-lens label[for]{outline:0}
#mkl0:focus-visible~.mk-lens label[for=mkl0],#mkl1:focus-visible~.mk-lens label[for=mkl1],#mkl2:focus-visible~.mk-lens label[for=mkl2]{outline:2px solid var(--acc);outline-offset:2px}
.mk-take{font-size:17px;line-height:1.55;margin:0;padding:14px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);color:var(--ink2)}
.mk-take b{color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600}
/* stages */
.mk-tabs{position:relative;display:flex;flex-direction:column;gap:18px}
.mk-tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}
.mk-tl label{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:17px;transition:transform .3s ease,border-color .3s ease,background .3s ease;position:relative}
.mk-tl label small{font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:13px;color:var(--ink3)}
.mk-tl label:hover{transform:translateY(-2px);border-color:var(--acc)}
.mk-tl label::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:3px;background:var(--fill);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.mk-panels{position:relative}
.mk-sp{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--e2)}
.mk-sp .mk-fgx{max-width:300px;justify-self:center;width:100%}
.mk-spc{display:flex;flex-direction:column;gap:16px}
.mk-spc .mk-big{font-size:clamp(44px,5vw,72px)}
.mk-spc .mk-bl{font-size:18px;color:var(--ink2);margin:-6px 0 0;line-height:1.4}
.mk-mini{display:flex;flex-wrap:wrap;gap:8px}
.mk-mini span{font-size:14px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 14px;color:var(--ink2)}
.mk-mini span b{color:var(--ink);font-weight:700}
.mk-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mk-two>div{border-radius:14px;padding:14px 16px;background:var(--card2);border:1px solid var(--line2);font-size:15px;line-height:1.5;color:var(--ink2)}
.mk-two b{display:block;font-family:'Space Grotesk',system-ui,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:600}
.mk-two .pr b{color:var(--acc)}
.mk-tg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-left:6px;color:var(--ink2);background:var(--card);vertical-align:2px}
.mk-tg.ok{color:var(--acc);border-color:var(--acc)}
#mkst0:checked~.mk-panels .mk-sp0,#mkst1:checked~.mk-panels .mk-sp1,#mkst2:checked~.mk-panels .mk-sp2,#mkst3:checked~.mk-panels .mk-sp3,#mkst4:checked~.mk-panels .mk-sp4{display:grid;animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
#mkst0:checked~.mk-tl label[for=mkst0],#mkst1:checked~.mk-tl label[for=mkst1],#mkst2:checked~.mk-tl label[for=mkst2],#mkst3:checked~.mk-tl label[for=mkst3],#mkst4:checked~.mk-tl label[for=mkst4]{border-color:var(--acc);background:var(--card2)}
#mkst0:checked~.mk-tl label[for=mkst0]::after,#mkst1:checked~.mk-tl label[for=mkst1]::after,#mkst2:checked~.mk-tl label[for=mkst2]::after,#mkst3:checked~.mk-tl label[for=mkst3]::after,#mkst4:checked~.mk-tl label[for=mkst4]::after{transform:none}
#mkst0:focus-visible~.mk-tl label[for=mkst0],#mkst1:focus-visible~.mk-tl label[for=mkst1],#mkst2:focus-visible~.mk-tl label[for=mkst2],#mkst3:focus-visible~.mk-tl label[for=mkst3],#mkst4:focus-visible~.mk-tl label[for=mkst4]{outline:2px solid var(--acc);outline-offset:2px}
/* parents */
.mk-par{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.mk-box{padding:28px;display:flex;flex-direction:column;gap:20px}
.mk-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;height:260px;border-bottom:1px solid var(--line);padding:0 4px}
.mk-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;cursor:default;outline:none}
.mk-cv{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:22px}
.mk-cb{width:100%;max-width:92px;border-radius:12px 12px 0 0;background:var(--ink3);height:calc(var(--v) * 2.1px);transform-origin:bottom;transition:background .3s ease,transform .9s cubic-bezier(.2,.7,.2,1) calc(var(--i) * 120ms),opacity .3s ease}
.mk-js .mk-beat:not(.in) .mk-cb{transform:scaleY(0)}
.mk-col.hl .mk-cb{background:var(--fill)}
.mk-cols:hover .mk-col:not(:hover) .mk-cb,.mk-cols:focus-within .mk-col:not(:focus) .mk-cb{opacity:.45}
.mk-col:hover .mk-cb,.mk-col:focus .mk-cb{background:var(--fill)}
.mk-cl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:0 4px;font-size:15px;font-weight:600;text-align:center;margin-top:-8px}
.mk-cl small{display:block;font-weight:400;color:var(--ink3);font-size:13px}
.mk-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.mk-side .mk-stat{padding:18px;gap:6px}
.mk-side .mk-big{font-size:clamp(28px,2.6vw,38px)}
.mk-side .mk-stat p{font-size:14px}
.mk-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px}
.mk-rule{padding:20px;display:flex;flex-direction:column;gap:6px;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:transform .35s ease,border-color .3s ease}
.mk-rule:hover{transform:translateY(-3px);border-color:var(--acc)}
.mk-rule b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;font-weight:600;line-height:1.25}
.mk-rule span{font-size:15px;color:var(--ink2);line-height:1.5}
.mk-rule em{font-style:normal;font-family:'Space Grotesk',system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.mk-pfam{display:flex;gap:28px;align-items:center}
.mk-pfam .mk-fgx{max-width:120px;flex:none}
/* budget */
.mk-ch{display:flex;flex-wrap:wrap;gap:8px}
.mk-ch label{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:border-color .25s ease,background .25s ease}
.mk-ch label:hover{border-color:var(--acc)}
#mkb0:checked~.mk-ch label[for=mkb0],#mkb1:checked~.mk-ch label[for=mkb1],#mkb2:checked~.mk-ch label[for=mkb2]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
:is(#mkb0,#mkb1,#mkb2):focus-visible~.mk-ch label{outline:0}
#mkb0:focus-visible~.mk-ch label[for=mkb0],#mkb1:focus-visible~.mk-ch label[for=mkb1],#mkb2:focus-visible~.mk-ch label[for=mkb2]{outline:2px solid var(--acc);outline-offset:2px}
.mk-bud{display:flex;flex-direction:column;gap:14px;padding:28px}
.mk-axis{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 84px;gap:14px;font-size:12px;color:var(--ink3)}
.mk-axis div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:4px}
.mk-br{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 84px;gap:14px;align-items:center;transition:opacity .35s ease}
.mk-br .nm{font-size:15px;font-weight:600;line-height:1.3}
.mk-br .nm small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.mk-brt{height:26px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);position:relative}
.mk-brf{position:absolute;top:3px;bottom:3px;left:calc(var(--a) * 2.5%);width:calc((var(--b) - var(--a)) * 2.5%);min-width:10px;border-radius:999px;background:var(--ink3);transform-origin:left;transition:background .3s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.mk-js .mk-beat:not(.in) .mk-brf{transform:scaleX(0)}
.mk-br .vl{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:16px;text-align:right}
#mkb1:checked~.mk-bud .mk-br.v .mk-brf,#mkb2:checked~.mk-bud .mk-br.rt .mk-brf{background:var(--fill)}
#mkb1:checked~.mk-bud .mk-br:not(.v),#mkb2:checked~.mk-bud .mk-br:not(.rt){opacity:.35}
.mk-bn2{display:none}
#mkb1:checked~.mk-bud .mk-bn1,#mkb2:checked~.mk-bud .mk-bn2{display:block}
/* calc */
.mk-calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.mk-ctl{display:flex;flex-direction:column;gap:22px;padding:28px}
.mk-f{display:flex;flex-direction:column;gap:8px}
.mk-f label{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:600}
.mk-f label output{font-family:'Space Grotesk',system-ui,sans-serif;font-size:22px;font-weight:600}
.mk-f small{font-size:13px;color:var(--ink3);line-height:1.45}
.mk-f input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:0}

  <div class="bp-dets"><div class="card bp-det bp-d0"><span class="kick" style="color:var(--acc)">Source 1 of 4</span><h4>Bank statement</h4><p>Fetch the company’s bank statements and match a UTR (the bank’s transaction reference) to the order invoices it pays.</p><div class="mk-mini"><span>UTR no. · Date · Mode of payment · Bank · Amount</span></div></div><div class="card bp-det bp-d1"><span class="kick" style="color:var(--acc)">Source 2 of 4</span><h4>Credit note</h4><p>Fetch a credit note, which is a revision receipt, and tally it against the order invoices it settles. Easy to identify, easy to match.</p><div class="mk-mini"><span>CN number · Type · Credit amount · Linked invoice</span></div></div><div class="card bp-det bp-d2"><span class="kick" style="color:var(--acc)">Source 3 of 4</span><h4>Salary adjustment</h4><p>For cases where an employee collected payments from customers but never submitted them to the company. The adjustment is deducted from salary and settled against the invoices. More transparency, and a guard against fraud.</p><div class="mk-mini"><span>Employee code · Month · Amount</span></div></div><div class="card bp-det bp-d3"><span class="kick" style="color:var(--acc)">Source 4 of 4</span><h4>Manual payment</h4><p>For the unique cases: enter details such as a cheque or payment receipt, attach proof, and match them to the respective order invoices.</p><div class="mk-mini"><span>Reference no. · Mode · Amount · Proof upload</span></div></div></div>
</div></section>
<section id="flow" class="bp-sec"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><i>3</i><span class="kick">The flow</span></div>
   <h2 class="h2 hd" style="max-width:900px">Same seven steps. <span class="em">Only the start changes.</span></h2>
   <p class="mk-sub">Every lane finds a payment, finds invoices, maps one to the other, reviews, and loops back. Pick a lane.</p></div>
  <input class="mk-r" type="radio" name="bpl" id="bpl0" aria-label="Bank statement" checked><input class="mk-r" type="radio" name="bpl" id="bpl1" aria-label="Credit note"><input class="mk-r" type="radio" name="bpl" id="bpl2" aria-label="Salary adjustment"><input class="mk-r" type="radio" name="bpl" id="bpl3" aria-label="Add manually"><div class="bp-tabs3"><label for="bpl0">Bank statement</label><label for="bpl1">Credit note</label><label for="bpl2">Salary adjustment</label><label for="bpl3">Add manually</label></div><div class="bp-lanes"><div class="bp-ln bp-l0"><div class="bp-fl"><div class="bp-fs v" style="--i:0"><i>1</i><b>Search UTR</b></div><div class="bp-fs v" style="--i:1"><i>2</i><b>Select UTR</b></div><div class="bp-fs " style="--i:2"><i>3</i><b>Search invoice</b></div><div class="bp-fs " style="--i:3"><i>4</i><b>Select and modify adj. amt</b></div><div class="bp-fs " style="--i:4"><i>5</i><b>Map to the selected UTR</b></div><div class="bp-fs k" style="--i:5"><i>6</i><b>Review and confirm</b></div><div class="bp-fs z" style="--i:6"><i>7</i><b>New payment</b></div></div><div class="bp-loop"><svg viewBox="0 0 34 22" fill="none" stroke="var(--ink2)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M30 4H12Q6 4 6 10V12Q6 18 12 18H27"/><path d="M24 14l4 4-4 4" fill="none"/></svg>After step 7, the user goes straight back to step 1 to settle the next payment.</div></div><div class="bp-ln bp-l1"><div class="bp-fl"><div class="bp-fs v" style="--i:0"><i>1</i><b>Search CN</b></div><div class="bp-fs v" style="--i:1"><i>2</i><b>Select CN</b></div><div class="bp-fs " style="--i:2"><i>3</i><b>Search invoice</b></div><div class="bp-fs " style="--i:3"><i>4</i><b>Select and modify adj. amt</b></div><div class="bp-fs " style="--i:4"><i>5</i><b>Map to the selected CN</b></div><div class="bp-fs k" style="--i:5"><i>6</i><b>Review and confirm</b></div><div class="bp-fs z" style="--i:6"><i>7</i><b>New payment</b></div></div><div class="bp-loop"><svg viewBox="0 0 34 22" fill="none" stroke="var(--ink2)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M30 4H12Q6 4 6 10V12Q6 18 12 18H27"/><path d="M24 14l4 4-4 4" fill="none"/></svg>After step 7, the user goes straight back to step 1 to settle the next payment.</div></div><div class="bp-ln bp-l2"><div class="bp-fl"><div class="bp-fs v" style="--i:0"><i>1</i><b>Search employee</b></div><div class="bp-fs v" style="--i:1"><i>2</i><b>Select employee ID</b></div><div class="bp-fs " style="--i:2"><i>3</i><b>Search invoice</b></div><div class="bp-fs " style="--i:3"><i>4</i><b>Select and modify adj. amt</b></div><div class="bp-fs " style="--i:4"><i>5</i><b>Map to the selected employee ID</b></div><div class="bp-fs k" style="--i:5"><i>6</i><b>Review and confirm</b></div><div class="bp-fs z" style="--i:6"><i>7</i><b>New payment</b></div></div><div class="bp-loop"><svg viewBox="0 0 34 22" fill="none" stroke="var(--ink2)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M30 4H12Q6 4 6 10V12Q6 18 12 18H27"/><path d="M24 14l4 4-4 4" fill="none"/></svg>After step 7, the user goes straight back to step 1 to settle the next payment.</div></div><div class="bp-ln bp-l3"><div class="bp-fl"><div class="bp-fs v" style="--i:0"><i>1</i><b>Enter details and upload image</b></div><div class="bp-fs v" style="--i:1"><i>2</i><b>Add entry and confirm</b></div><div class="bp-fs " style="--i:2"><i>3</i><b>Search invoice</b></div><div class="bp-fs " style="--i:3"><i>4</i><b>Select and modify adj. amt</b></div><div class="bp-fs " style="--i:4"><i>5</i><b>Map to the added entry</b></div><div class="bp-fs k" style="--i:5"><i>6</i><b>Review and confirm</b></div><div class="bp-fs z" style="--i:6"><i>7</i><b>New payment</b></div></div><div class="bp-loop"><svg viewBox="0 0 34 22" fill="none" stroke="var(--ink2)" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M30 4H12Q6 4 6 10V12Q6 18 12 18H27"/><path d="M24 14l4 4-4 4" fill="none"/></svg>After step 7, the user goes straight back to step 1 to settle the next payment.</div></div></div>
  <div class="bp-lg"><span>Different per source</span><span class="b">Shared steps</span><span class="k">Review</span><span class="z">Loop back</span></div>
</div></section>
<section id="calls" class="bp-sec" style="background:var(--bg2)"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><i>4</i><span class="kick">Design calls</span></div>
   <h2 class="h2 hd" style="max-width:900px">Five calls that <span class="em">cut the errors.</span></h2>
   <p class="mk-sub">Each call comes from how the flow works in the dashboard.</p></div>
  <div class="bp-dec"><div class="card bp-dc"><span class="tag">Call 1</span><h5>Categories live in top tabs</h5><dl><div><dt>Why</dt><dd>Four payment sources behave alike, so a user should not learn four tools.</dd></div><div><dt>The call</dt><dd class="c">One screen. Bank statement, credit note, salary adjustment and add manually sit in a tab bar.</dd></div><div><dt>What it gives</dt><dd>One pattern to learn, and one place to go.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 2</span><h5>Find the payment, then the invoices</h5><dl><div><dt>Why</dt><dd>A payment is one lump. The invoices it pays are many.</dd></div><div><dt>The call</dt><dd class="c">Two searches on one page. Filters and a search bar for the payment first, then for invoices by number or retailer.</dd></div><div><dt>What it gives</dt><dd>The user always knows which side they are on.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 3</span><h5>Adjust per invoice</h5><dl><div><dt>Why</dt><dd>A payment rarely equals the invoices exactly.</dd></div><div><dt>The call</dt><dd class="c">Each invoice has its own editable adjusted amount, with a running total against the amount left.</dd></div><div><dt>What it gives</dt><dd>Partial settlement stays possible, and the math is visible.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 4</span><h5>Review before it commits</h5><dl><div><dt>Why</dt><dd>A wrong mapping creates the conflicts the team wanted to remove.</dd></div><div><dt>The call</dt><dd class="c">A review pop-up shows the mapping, lets the user edit it, then asks them to confirm with care.</dd></div><div><dt>What it gives</dt><dd>Mistakes get caught before they are saved.</dd></div></dl></div><div class="card bp-dc"><span class="tag">Call 5</span><h5>Two exits, built for repeat work</h5><dl><div><dt>Why</dt><dd>Collection teams settle payment after payment.</dd></div><div><dt>The call</dt><dd class="c">The pop-up offers Confirm and add another payment, or Confirm and go to invoices.</dd></div><div><dt>What it gives</dt><dd>The next payment is one click away.</dd></div></dl></div></div>
</div></section>

  componentWillUnmount() { clearInterval(this.t1); cancelAnimationFrame(this.raf); }

      if (w.el && w.el.getBoundingClientRect) { var r = w.el.getBoundingClientRect(); v = r.bottom > vh * 0.12 && r.top < vh * 0.88; }

  checkCounts() {
