g-top:14px"><span class="disp" style="font-size:clamp(32px,3.6vw,46px);line-height:1.05;color:var(--acc)">3</span><span style="font-size:14px;color:var(--ink3)">breakpoints, one size each per text style</span></div><span style="font:600 14px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)">Read more →</span></a><a href="/work/design-system-usage#platform" class="card lift" data-cur="Open" style="display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:22px;text-decoration:none;color:var(--ink);position:relative"><span class="kick" style="color:var(--acc)">Platform mode</span><span class="tag" style="align-self:flex-start">Pitched to Design and Research</span><h3 class="disp" style="margin:0;font-size:clamp(24px,2.2vw,30px);line-height:1.12">Build iOS. Switch to Android.</h3><p style="margin:0;font-size:16px;line-height:1.55;color:var(--ink2)">Platform names match in the primitive variables, so an iOS screen flips to Android with one mode switch.</p><div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:14px"><span class="disp" style="font-size:clamp(32px,3.6vw,46px);line-height:1.05;color:var(--acc)">~80%</span><span style="font-size:14px;color:var(--ink3)">of an Android screen from the iOS design, by my estimate</span></div><span style="font:600 14px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)">Read more →</span></a></div>
