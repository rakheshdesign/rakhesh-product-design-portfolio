<p>Helped launch credit-limit management in six markets, contributing to +44% completion on mobile, by designing one foundation where only wording and verification depth flex.</p>

<section>
<h2>Five screens. Every market starts here.</h2>
<h4>Account</h4>
<p>A row in the account list, where people already look for “features”.</p>
<h4>Manage Your Credit Limit</h4>
<p>A landing page that teaches how it works, then launches the task.</p>
<h4>Enter Desired Credit Limit</h4>
<p>One focused step. The system expects the new total, not the top-up.</p>
<h4>Confirm or Update Income Information</h4>
<p>By providing your income, you certify that the information provided is accurate and complete to the best of your knowledge. The income information provided is subject to verification. Failure to provide accurate information may lead to reassessment of your overall relationship with American Express.</p>
<p>A guided step to confirm the income the request is reviewed on.</p>
<h4>Credit Limit Increase Approved</h4>
<p>We’ve approved your request to increase your Credit Limit from $8,000 to $10,000.</p>
<p>Clear decision states and a next step, so nobody is left guessing.</p>
<p>Illustrative recreations of the shipped screens. Real data is confidential.</p>
</section>
<section>
<h2>One shell. One swappable middle.</h2>
<p>Three screens never change. Only the middle swaps by market.</p>
</section>
<section>
<h2>Remove the landing page? Reality said no.</h2>
<a href="#us-fn">Check the data funnel</a>
<p>Bar height is the share of everyone who entered. The label is conversion from the step before.</p>
<h4>Request Credit Limit Increase</h4>
<h4>Enter Desired Credit Limit</h4>
<p>Kept the landing page, as measured by a 35-day, 50 / 50 test in which removing it cost about 6% of completion and added about 5% to call-support volume, by framing both hypotheses and the test with Product</p>
</section>
<section>
<h2>A bigger ask. Kept light.</h2>
<p>A fuller financial profile and a slower verification system.</p>
<p>Three structures, critiqued and research-checked.</p>
<p>One ask per screen, live progress and a visible wait.</p>
<h3>Three ways to ask a lot. One that keeps it light.</h3>
<h4>Group fields together</h4>
<p>Fewer screens</p>
<p>A lot to answer at once</p>
<p>Heavy for a long profile</p>
<h4>Sections by cohort</h4>
<p>Questions better organized</p>
<p>The whole mountain shows up front</p>
<h4>One ask per screen</h4>
<p>One clear question at a time</p>
<p>Live progress shows where you are</p>
<p>Backed by critiques and research</p>
<p>More screens, so progress and status must be clear</p>
</section>
<section>
<h2>A top-up that read as a decrease.</h2>
<p>Top-ups read as decreases. It touched 0.2% of customers.</p>
<p>A clearer title helped, not enough. People skim and guess.</p>
<p>Say what the entry will do, in numbers, as they type.</p>
<p>In UAT, people reported no mental math and no confusion. The full story has the calls, the survey comments and every screen.</p>
<a href="/work/canada-experience-gap">Read the Canada story</a>
</section>

<h2>Six markets. One system.</h2>
<p>Launched credit-limit management in six markets, as measured by +44% completion on mobile, by fixing the journey and flexing only wording and verification depth.</p>
<p>What flexed in each market. I don’t rank them: Australia collects a much fuller profile and Canada’s rollout covers four paths, so completion is not like-for-like.</p>
</section>
