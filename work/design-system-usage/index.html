<section>
<h1>Three proposals to make design scale.</h1>
<p>Three separate proposals, each pitched on its own. All three use the same lever: Figma Variables with more than one mode, so one design can serve every market, screen size and platform.</p>
<a href="#localization">PROPOSAL 1 · MARKET MODE ~ 80 % less copy-and-paste, by my estimate</a>
<p>less copy-and-paste, by my estimate</p>
<a href="#type">PROPOSAL 2 · BREAKPOINT MODE 3 breakpoints, one size each per text style</a>
<p>breakpoints, one size each per text style</p>
<a href="#platform">PROPOSAL 3 · PLATFORM MODE ~ 80 % of an Android screen from the iOS design, by my estimate</a>
<p>of an Android screen from the iOS design, by my estimate</p>
</section>
<section>
<h2>Three asks, one shared lever.</h2>
<p>1 MARKET MODE Words switch by market.</p>
<p>2 BREAKPOINT MODE Size follows the screen.</p>
<p>3 PLATFORM MODE iOS flips to Android.</p>
</section>
<section>
<h2>Words that switch by market.</h2>
<p>Market wording switches two ways: Figma Variables modes, or the Applanga Global Strings plugin. Approved wording reaches the design either way.</p>
<a href="/work/localization-automation">Read the full proposal</a>
</section>
<section>
<h2>Type that fits the screen.</h2>
<p>Today a 32px Title is 32px on display, tablet and mobile. The proposal: every text style carries a size for each breakpoint, so the type adapts on its own.</p>
<p>Request an increase</p>
<p>How it works</p>
<p>Tell us the limit you want. We review it and show the decision on this screen.</p>
<p>Takes about a minute.</p>
<p>Proposed · Mobile · Title 32px</p>
<p>Mobile stays as it is. Larger screens get larger type, in steps, from the same style name.</p>
<p>Sizes shown are example values for the idea.</p>
</section>
<section>
<h2>Build iOS. Switch to Android.</h2>
<p>We usually design iOS first, then rebuild each screen for Android from scratch. About 80% of that UI can come straight from the iOS screen with one mode switch, like Light and Dark. The system already has a Platform mode. The improvement is using it.</p>
<h3>Request an increase</h3>
<p>Layers following the platform: 5 of 5</p>
<p>Platform names match in the primitive variables, so every component, and every atom inside it, knows how to switch. Values shown are examples.</p>
</section>
<section>
<h2>Three proposals. Three different wins.</h2>
</section>
<section>
<h2>What I took away.</h2>
<p>Market mode, Breakpoint mode and Platform mode, each to the team that would own it.</p>
<p>All three are proposals. Market mode is already applied in Plan It promo pricing.</p>
</section>

  <div class="bp-ch"><div class="mk-bn"><i>2</i><span class="kick">Proposal 2 · Breakpoint mode</span></div>
   <h2 class="h2 hd" style="max-width:900px">Type that <span class="em">fits the screen.</span></h2>
   <p class="mk-sub">Today a 32px Title is 32px on display, tablet and mobile. The proposal: every text style carries a size for each breakpoint, so the type adapts on its own.</p><dl class="pp-meta"><div><dt>Pitched to</dt><dd>Design and Research</dd></div><div><dt>Status</dt><dd>Proposal. Sizes shown are example values for the idea.</dd></div><div><dt>Evidence</dt><dd>No measurement yet. This is a concept, shown with example values.</dd></div></dl></div>

  <div class="ds-seg" role="group" aria-label="Breakpoint"><button type="button" data-bp="display" aria-pressed="false">Display</button><button type="button" data-bp="tablet" aria-pressed="false">Tablet</button><button type="button" data-bp="mobile" aria-pressed="true">Mobile</button></div>

   <div class="ds-fr"><div class="ds-dev"><div class="ds-ty" id="dsty" data-bp="mobile"><span class="k">Credit limit</span><p class="t">Request an increase</p><p class="h">How it works</p><p class="b">Tell us the limit you want. We review it and show the decision on this screen.</p><p class="c">Takes about a minute.</p></div></div>
    <p class="ds-read" id="dsread" aria-live="polite"></p></div>
   <div class="ds-side"><div class="ds-tw"><table class="ds-tb" id="dstb"><thead><tr><th>Style</th><th>Today</th><th>Display</th><th>Tablet</th><th>Mobile</th></tr></thead><tbody><tr data-s="t"><td class="n">Title</td><td data-col="before">32px</td><td data-col="display">40px</td><td data-col="tablet">36px</td><td data-col="mobile">32px</td></tr><tr data-s="h"><td class="n">Heading</td><td data-col="before">22px</td><td data-col="display">28px</td><td data-col="tablet">24px</td><td data-col="mobile">22px</td></tr><tr data-s="b"><td class="n">Body</td><td data-col="before">16px</td><td data-col="display">18px</td><td data-col="tablet">16px</td><td data-col="mobile">16px</td></tr><tr data-s="c"><td class="n">Caption</td><td data-col="before">12px</td><td data-col="display">14px</td><td data-col="tablet">13px</td><td data-col="mobile">12px</td></tr></tbody></table></div>

</div></section>
<section id="platform" class="bp-sec" style="background:var(--bg2)"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><i>3</i><span class="kick">Proposal 3 · Platform mode</span></div>
   <h2 class="h2 hd" style="max-width:900px">Build iOS. <span class="em">Switch to Android.</span></h2>
   <p class="mk-sub">We usually design iOS first, then rebuild each screen for Android from scratch. About 80% of that UI can come straight from the iOS screen with one mode switch, like Light and Dark. The system already has a Platform mode. The improvement is using it.</p><dl class="pp-meta"><div><dt>Pitched to</dt><dd>Design and Research</dd></div><div><dt>Status</dt><dd>Proposal. The system already has a Platform mode. The ask is to use it fully.</dd></div><div><dt>Evidence</dt><dd>~80% of an Android screen is my estimate, not a measured result.</dd></div></dl></div>

<section id="result" class="bp-sec"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><span class="kick">What each one changes</span></div>
   <h2 class="h2 hd" style="max-width:900px">Three proposals. <span class="em">Three different wins.</span></h2></div>
  <div class="bp-tk">
   <div class="mk-rule"><em>Market mode</em><b>Fewer copy-and-paste rounds</b><span>Market wording switches by variable mode or by the Applanga plugin, so designers stop retyping market copy.</span></div>
   <div class="mk-rule"><em>Breakpoint mode</em><b>One text style, three sizes</b><span>Type follows the screen, which removes a sizing decision from every layout.</span></div>
   <div class="mk-rule"><em>Platform mode</em><b>Android from the iOS design</b><span>Most of an Android screen switches from the iOS one, so designers rebuild less.</span></div>
  </div>
</div></section>
<section class="bp-sec" style="background:var(--bg2)"><div class="wrap bp-w">
  <div class="bp-ch"><div class="mk-bn"><span class="kick">Takeaways</span></div>
   <h2 class="h2 hd" style="max-width:900px">What I <span class="em">took away.</span></h2></div>
  <div class="bp-tk">
   <div class="mk-rule"><em>Learning 1</em><b>Name things the same</b><span>Matching names across modes is what lets a whole screen switch.</span></div>
   <div class="mk-rule"><em>Learning 2</em><b>Let size follow the screen</b><span>Type that adapts removes a decision from every layout.</span></div>
   <div class="mk-rule"><em>Learning 3</em><b>Use what the system already has</b><span>The system already has a Platform mode. The proposal is to use it fully.</span></div>
  </div>
  <div class="card" style="padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px">
   <div style="display:flex;flex-direction:column;gap:12px"><span class="kick" style="color:var(--acc)">I proposed</span><p style="margin:0">Market mode, Breakpoint mode and Platform mode, each to the team that would own it.</p></div>
   <div style="display:flex;flex-direction:column;gap:12px"><span class="kick" style="color:var(--acc)">Where they stand</span><p style="margin:0">All three are proposals. Market mode is already applied in Plan It promo pricing.</p></div>
  </div>
</div></section>

        return { i: j, n: 'AI 0' + (j + 1), kind: p.kind || '', title: p.title, meta: p.meta, href: p.file, ask: p.ask, real: p.real, metric: p.metric, metricLabel: p.metricLabel, blurb: p.blurb, icp: ic[p.icon], tags: p.tags.map(function (t) { return { t: t }; }), cur: 'Open', live: p.url || '', thumb: p.thumb || '', liveShow: p.url ? 'inline-flex' : 'none' };
      });
    }
    if (SPEC.beyond) {
      vals.beyond = SPEC.beyond.map(function (b, j) { return { i: j, t: b.t, role: b.role, yrs: b.yrs, ind: b.ind, aud: b.aud, d: b.d, icp: ic[b.ic], pts: b.pts.map(function (q) { return { t: q }; }), dPts: b.pts.length ? 'flex' : 'none' }; });
    }
    return Object.assign(vals, {
      theme: s.theme,
      themeIcon: dark ? ic.sun : ic.moon,
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () {
        var next = s.theme === 'dark' ? 'light' : 'dark';
        self.setState({ theme: next });
        try { localStorage.setItem('rk-theme', next); } catch (e) {}
      },
      gpCls: s.paused ? 'gp' : '',
      motionIcon: s.paused ? ic.play : ic.pause,
      motionPressed: s.paused,
      motionTipT: s.paused ? 'Resume motion' : 'Pause motion',
      motionTipD: s.paused ? 'Carousels, counters and demos are frozen. Press to play them again.' : 'Stops auto-playing carousels, counters and animated demos. Press again to resume.',
      toggleMotion: function () { self.setState({ paused: !self.state.paused }); },
      closeMenu: function () { try { var d = document.querySelector('details.mnav'); if (d) d.removeAttribute('open'); } catch (x) {} },
      ic: ic, vw: vw,
      setDot: function (el) { self.dotEl = el; },
      setRing: function (el) { self.ringEl = el; },
      setBubble: function (el) { self.bubbleEl = el; },
      onMove: function (e) {
        self.mx = e.clientX; self.my = e.clientY;
        var t = e.target, lab = '', hov = false;
        if (t && t.closest) {
          var d = t.closest('[data-cur]');
          if (d) lab = d.getAttribute('data-cur') || '';
          hov = !!t.closest('a,button,input,label');
        }
        if (lab !== self.state.curLab || hov !== self.state.curHov) self.setState({ curLab: lab, curHov: hov });
      },
      onOut: function () { self.mx = -200; self.my = -200; },
      crLab: s.curLab ? 'lab' : '',
      crHov: (s.curHov && !s.curLab) ? 'hov' : '',
      curLabel: s.curLab
    });
  }
}

</script>
