<main><section>Fraud · Mobile Lead Designer · American Express Fintech · B2C Mobile <h1>Calm, in the middle of a fraud scare.</h1>
<p>An unfamiliar charge creates worry at once. A Card Member has moments to answer: was this me? I designed the journey that turns complex detection logic into one calm, guided decision.</p>
Scope 4 alert entry points: push, home banner, SMS and email alert entry points: push, home banner, SMS and email Scope 3 outcomes: all safe, more verification, or replace the card outcomes: all safe, more verification, or replace the card Scope 7 insight buckets from synthesis with Product, Business and Risk insight buckets from synthesis with Product, Business and Risk Process 2–3 directions taken to user validation, from many explorations directions taken to user validation, from many explorations <p>Projected goal: protect Card Members with clarity, speed and confidence. Post-launch results are not claimed here.</p>
</section>
<section>The short version <h2>Design for panic, not for a normal task.</h2>
What was at stake <h3>Scared people scan, not read</h3>
<p>Users assume the worst, skim for “it’s me” or “it’s fraud”, and abandon or mis-confirm in a complex flow.</p>
My calls <h3>Soft tone. Guided choices. Words first.</h3>
<p>Reassure without alarm, narrow the decisions, let the system lead, and treat content as part of the interface.</p>
Where it is heading <h3>Verify, secure or replace with confidence</h3>
<p>A clear, informed path that supports business and risk goals while protecting the Card Member.</p>
</section>
<section>The journey <h2>From a backend signal to one clear answer.</h2>
<p>I mapped every touchpoint and decision against the detection logic. The nodes light up in turn. Tap one to hold it.</p>
<b></b>

Detect <p>A fraud engine reads card-usage patterns and risk signals in the background and decides when to alert.</p>
</section>
<section>The experience <h2>Reassure first. Then ask one thing.</h2>
<p>Illustrative recreations of the three moments that matter most.</p>
9:41 Back <h4>Let’s check your card together</h4>
A quick look at your recent transactions will help keep your account safe. We noticed some unusual activity Review activity Back <h4>Which of these were you?</h4>
Tap an answer for each charge. Coffee shop · $4.50 Me Online store · $129.00 Not me Transfer · $60.00 Me Continue Back <h4>Thanks for checking</h4>
We’ll secure your account and send a replacement card. We’re taking care of it Account secured Done New card On its way Done <p><strong>Illustrative designs.</strong>
Real American Express screens are confidential, so these recreate the flow and decisions without revealing them.</p>
</section>
<section>Emotion mapping <h2>Mapping anxiety at every stage.</h2>
<p>I mapped thoughts, emotions and pain points per stage, then turned them into opportunities across IA, interaction and content.</p>
Emotion map · illustrative How anxious the Card Member may feel, by stage. A design hypothesis, not measured data. Alert arrives Assumes the worst Opens the app Wants speed and clarity Reviews charges Scans, looks for “me or fraud” Marks each one Wants guidance, not blame Gets the outcome Reassured, knows what is next</section>
<section>What users do in a crisis <h2>Five truths that shaped every screen.</h2>
<h3>Assume the worst</h3>
<p>A suspicious alert can amplify panic when clarity is missing.</p>
<h3>Scan, don’t read</h3>
<p>Complex flows risk abandonment or the wrong confirmation.</p>
<h3>Control, not full responsibility</h3>
<p>People want to act, and expect the system to guide them.</p>
<h3>Speed is trust</h3>
<p>Every extra step can feel like extra exposure to risk.</p>
<h3>Think in binaries</h3>
<p>“It’s me” or “It’s fraud”, while the backend logic is far more nuanced.</p>
</section>
<section>How we got to a direction <h2>From many ideas to two or three.</h2>
<p>Exploration, critique and research, in sequence.</p>
</section>
<section>Synthesis buckets <h2>Seven lenses on one experience.</h2>
Content Experience IA / UI Interaction Decisioning Trust Transparency</section>
<section>Decisions <h2>Three calls that shaped the outcome.</h2>
01 <h3>Soft tone over alarm</h3>
Validated with users Tension Alerts can trigger panic. <b></b>
Options Urgent warning, or calm reassurance. <b></b>
The call Reassure with a softer, clearer tone. <b></b>
Result A direction users picked in validation. 02 <h3>Guide, don’t offload</h3>
Shaped the flow Tension Users want control, not full responsibility. <b></b>
Options Ask them to decide alone, or guide them. <b></b>
The call The system leads. People confirm. <b></b>
Result Fewer risk-heavy, unguided choices. 03 <h3>Treat the words as the product</h3>
Reworked after testing Tension Testing surfaced unexpected feedback on content. <b></b>
Options Ship as designed, or revise the language. <b></b>
The call Revise with Compliance and Content Design. <b></b>
Result Language that builds trust and lowers anxiety.</section>
<section>Contribution <h2>Where my work ends and the team’s begins.</h2>
I owned <p>Mapped touchpoints and backend logic into one user flow</p>
<p>Hypotheses and opportunity framing for tone, interaction and content</p>
<p>Emotion mapping across the journey</p>
<p>IA and interaction explorations, including AI-assisted MVPs</p>
<p>Validation objectives and focus areas, with research</p>
We did together <p>Synthesis workshops with design forums, Product, Business and Risk</p>
<p>Critiques that narrowed many directions to two or three</p>
<p>User validation with the research team</p>
<p>Language changes with Compliance and Content Design</p>
<p>Feasibility checks with Engineering</p>
</section>
<section><p>Designing for panic is different. The job is not only to delight. It is to protect, reassure and guide.</p>
</section>

<p>In a fraud scare, the words are how trust gets built. People should always know what is happening and what they can do next.</p>

.pxf .pxif{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.pxf .pxlt{position:absolute;opacity:0;pointer-events:none}
.pxf .pxlt:checked~.pxif{display:block}
.pxf .pxlt:checked~.pxi{visibility:hidden}
.pxsw{position:absolute;right:14px;bottom:14px;z-index:2;cursor:pointer;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);transition:transform .2s}
.pxsw:hover{transform:translateY(-2px)}
.pxsw .pxoff{display:none}
.pxlt:checked~.pxsw .pxon{display:none}.pxlt:checked~.pxsw .pxoff{display:inline}
.pxlt:focus-visible~.pxsw{outline:2px solid var(--acc);outline-offset:2px}
.pxc{display:flex;flex-direction:column;gap:14px}
.pxc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pxc li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:var(--ink2)}
.pxc li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:8px}
.px>input:focus-visible~.pxtabs label{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:1000px){.pxp{grid-template-columns:1fr}}
#pxa0:checked~.pxp0{display:grid}#pxa0:checked~.pxtabs label[for=pxa0]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}

.pxf.hc .pxif{top:38px;height:calc(100% - 38px)}

.rlw .rlt{display:flex;flex-direction:column;gap:18px;max-width:560px}
.rl{position:relative;width:min(340px,100%);aspect-ratio:9/16;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--e3);background:#05070c;margin:0 auto}
.rl .rlk{position:absolute;opacity:0;pointer-events:none}
.rl .rlp{display:block;width:100%;height:100%;object-fit:cover}
.rl .rli{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.rl .rlk:checked~.rli{display:block}
.rl .rlk:checked~.rlp,.rl .rlk:checked~.rlplay{display:none}
.rlplay{position:absolute;left:50%;top:76%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 36px -10px rgba(0,0,0,.6);transition:transform .3s cubic-bezier(.2,.7,.2,1)}

.rlbk{position:absolute;left:12px;top:12px;z-index:3;display:none;min-height:36px;align-items:center;padding:0 14px;border-radius:999px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:13px;cursor:pointer}

.rlk:focus-visible~.rlplay{outline:2px solid var(--acc);outline-offset:4px}

#pxa6:checked~.pxp6{display:grid}#pxa6:checked~.pxtabs label[for=pxa6]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}

#pxa8:checked~.pxp8{display:grid}#pxa8:checked~.pxtabs label[for=pxa8]{background:var(--fill);color:var(--fillink);border-color:var(--fill)}

.tipw:hover .tipc,.tipw:focus-within .tipc{opacity:1;visibility:visible;transform:none}

rives", "d": "Assumes the worst"}, {"t": "Opens the app", "d": "Wants speed and clarity"}, {"t": "Reviews charges", "d": "Scans, looks for “me or fraud”"}, {"t": "Marks each one", "d": "Wants guidance, not blame"}, {"t": "Gets the outcome", "d": "Reassured, knows what is next"}]}, {"type": "cards", "kick": "What users do in a crisis", "h": "Five truths that shaped *every screen.*", "cols": 250, "items": [{"t": "Assume the worst", "p": "A suspicious alert can amplify panic when clarity is missing.", "ic": "warnc"}, {"t": "Scan, don’t read", "p": "Complex flows risk abandonment or the wrong confirmation.", "ic": "eye"}, {"t": "Control, not full responsibility", "p": "People want to act, and expect the system to guide them.", "ic": "hand"}, {"t": "Speed is trust", "p": "Every extra step can feel like extra exposure to risk.", "ic": "timer"}, {"t": "Think in binaries", "p": "“It’s me” or “It’s fraud”, while the backend logic is far more nuanced.", "ic": "swap"}]}, {"type": "arc", "id": "process", "band": true, "kick": "How we got to a direction", "h": "From many ideas to *two or three.*", "lead": "Exploration, critique and research, in sequence.", "nodes": [{"t": "Map the flow", "d": "All touchpoints, decisions and backend logic in one user flow.", "ic": "flow"}, {"t": "Frame hypotheses", "d": "How design, interaction and content can lower anxiety.", "ic": "idea"}, {"t": "Synthesize", "d": "Affinity maps with design forums, Product, Business and Risk.", "ic": "users"}, {"t": "Explore", "d": "IA and interaction directions, with MVPs in Figma Make and Replit.", "ic": "sparkle"}, {"t": "Critique", "d": "Many explorations narrowed to two or three viable directions.", "ic": "crit"}, {"t": "Validate", "d": "Objectives and focus areas defined with research, then tested with users.", "ic": "target"}, {"t": "Refine the words", "d": "Unexpected content feedback, resolved with Compliance and Content Design.", "ic": "pen"}]}, {"type": "chips", "kick": "Synthesis buckets", "h": "Sev     Object.keys(this.ap).forEach(function (k) { vw[k] = s.vis[k] ? '' : 'noview'; });
    var pickFn = function (k, i) { return function () { self.ap[k].e = 0; var u = {}; u[k] = i; self.setState(u); }; };
    var segOf = function (k, i) { return i === s[k] ? 'on' : (i < s[k] ? 'done' : ''); };
    var tone = function (t) { return t === 'ok' ? 'var(--ok, var(--acc))' : t === 'bad' ? 'var(--bad)' : t === 'warn' ? 'var(--warn)' : t === 'mute' ? 'var(--ink3)' : 'var(--ink)'; };
    var disp = function (b) { return b ? 'flex' : 'none'; };

    // hero metrics
    var M = SPEC.metrics;
    this.cto = M.map(function (m) { return m.txt ? null : m.to; });
    this.cdp = M.map(function (m) { return m.dp || 0; });
    vals.heroMetrics = M.map(function (m, i) {
      return {
        pre: m.pre || '', suf: m.suf || '', label: m.label, tag: m.tag, okc: m.ok ? 'ok' : '',
        initial: m.txt ? m.txt : '0',
        full: (m.pre || '') + (m.txt || m.to) + (m.suf || '') + ' ' + m.label,
        setRef: function (el) { if (el) { self.cel[i] = el; el.textContent = m.txt ? m.txt : self.fmt(self.cdone[i] ? (self.cval[i] != null ? self.cval[i] : m.to) : 0, m.dp || 0); } }
      };
    });

    SPEC.sections.forEach(function (sec, i) {
      var k = 'w' + i, p = 's' + i;
      if (sec.type === 'cards') {
        vals[p + 'items'] = sec.items.map(function (c, j) { return { i: j, t: c.t, p: c.p, k: c.k || '', dK: c.k ? 'inline' : 'none', dIc: c.ic ? 'flex' : 'none', icp: c.ic ? ic[c.ic] : '' }; });
      } else if (sec.type === 'flow') {
        vals[p + 'nodes'] = sec.nodes.map(function (n, j) {
          var on = j === s[k];
          return { n: '0' + (j + 1), t: n.t, tag: n.tag || '', icp: ic[n.ic], on: on, segCls: on ? 'on' : (j < s[k] ? 'done' : ''), hi: on ? 'hi' : '', cnStyle: j === sec.nodes.length - 1 ? 'display: none' : '', pick: pickFn(k, j) };
        });
        var cn = sec.nodes[s[k]];
        vals[p + 'curT'] = cn.t; vals[p + 'curD'] = cn.d; vals[p + 'curIc'] = ic[cn.ic];
      } else if (sec.type === 'stage') {
        vals[p + 'tabs'] = sec.items.map(function (it, j) {
          var on = j === s[k];
          return { n: '0' + (j + 1), label: it.label, body: it.body || '', dBody: on && it.body ? 'block' : 'none', cls: on ? 'on' : '', sel: on, segCls: segOf(k, j), bd: on ? 'var(--acc)' : 'var(--line)', bgc: on ? 'var(--elev)' : 'var(--card)', pick: pickFn(k, j) };
        });
        vals[p + 'scr'] = sec.items.map(function (it, j) {
          var x = it.screen, on = j === s[k];
          var prog = [];
          if (x.prog) for (var q = 0; q < x.prog[1]; q++) prog.push({ bg: q < x.prog[0] ? 'var(--fill)' : 'var(--line)' });
          return {
            cls: on ? 'on' : '', h: x.h, sub: x.sub || '', dSub: x.sub ? 'block' : 'none', big: x.big || '', dBig: x.big ? 'block' : 'none', bigc: tone(x.bigTone),
            banner: x.banner || '', dBanner: x.banner ? 'block' : 'none', banc: x.bannerTone ? tone(x.bannerTone) : 'var(--acc)',
            prog: prog, dProg: x.prog ? 'flex' : 'none',
            rows: (x.rows || []).map(function (r, q) { return { a: r.a, b: r.b || '', c: tone(r.tone), c2: r.tone ? tone(r.tone) : 'var(--ink3)', fw: r.tone ? 600 : 400, bg: r.hl ? 'var(--hl, transparent)' : 'transparent', bd: r.hl ? 'var(--acc)' : 'var(--line2)', cls: 'in' + Math.min(3, q + 1) }; }), dRows: (x.rows && x.rows.length) ? 'flex' : 'none',
            cols: (x.cols || []).map(function (c) { return { h: c.h, big: c.big || '', bw: c.hl ? '2px' : '0px', bd: c.hl ? 'var(--acc)' : 'var(--line)', rows: c.rows.map(function (r) { return { a: r.a, b: r.b }; }) }; }),
            dCols: x.cols ? 'grid' : 'none',
            chip: x.chip || '', dChip: x.chip ? 'block' : 'none', cta: x.cta || '', dCta: x.cta ? 'flex' : 'none'
          };
        });
      } else if (sec.type === 'sync') {
        vals[p + 'tabs'] = sec.steps.map(function (it, j) {
          var on = j === s[k];
          return { n: '0' + (j + 1), label: it.label, body: it.body || '', dBody: on && it.body ? 'block' : 'none', cls: on ? 'on' : '', sel: on, segCls: segOf(k, j), bd: on ? 'var(--acc)' : 'var(--line)', bgc: on ? 'var(--elev)' : 'var(--card)', pick: pickFn(k, j) };
        });
        var st = s[k], act = [[0], [1, 2], [3]];
        vals[p + 'fl'] = sec.nodes.map(function (n, j) {
          var on = act[st].indexOf(j) >= 0, done = false;
          for (var q = 0; q < st; q++) if (act[q].indexOf(j) >= 0) done = true;
          return { t: n.t, icp: ic[n.ic], cls: on ? 'on' : (done ? 'done' : ''), aStyle: j === sec.nodes.length - 1 ? 'display: none' : '' };
        });
        vals[p + 'mk'] = sec.markets.map(function (m) { return { t: m.t }; });
        vals[p + 'mrows'] = sec.rows.map(function (r) { return { k: r.k, cells: r.cells.map(function (c, q) { return { t: c, lang: sec.markets[q].lang }; }) }; });
        vals[p + 'stepCls'] = 's' + st;
        vals[p + 'note'] = sec.notes[st];
      } else if (sec.type === 'funnel') {
        var mx = Math.max.apply(null, sec.cols.map(function (c) { return c.v; }));
        vals[p + 'cols'] = sec.cols.map(function (c, j) {
          var hi = !!c.hi;
          return { v: c.v, h: Math.max(2, c.v / mx * 78), s: String(j + 1), name: c.name, bg: hi ? 'var(--warn)' : 'var(--fill)', tc: hi ? 'var(--warn)' : 'var(--ink2)' };
        });
        vals[p + 'calls'] = sec.calls.map(function (c, j) { return { i: j, big: c.big, k: c.k, p: c.p, c: tone(c.tone || 'warn') }; });
      } else if (sec.type === 'versus') {
        vals[p + 'rows'] = sec.rows.map(function (r, j) { return { i: j, k: r.k, a: r.a, b: r.b }; });
      } else if (sec.type === 'decisions') {
        vals[p + 'rows'] = sec.items.map(function (d, j) {
          var on = j === s[k];
          return { n: '0' + (j + 1), t: d.t, status: d.status || '', okc: d.ok ? 'ok' : '', tension: d.tension, options: d.options, call: d.call, result: d.result, cls: on ? 'on' : '', hi: on ? 'hi' : '', segCls: on ? 'on' : '', pick: pickFn(k, j) };
        });
      } else if (sec.type === 'arc') {
        vals[p + 'nodes'] = sec.nodes.map(function (n, j) {
          var on = j === s[k];
          return { t: n.t, d: n.d, icp: ic[n.ic], on: on, segCls: on ? 'on' : (j < s[k] ? 'done' : ''), hi: on ? 'hi' : '', pick: pickFn(k, j) };
        });
      } else if (sec.type === 'curve') {
        var n = sec.points.length;
        vals[p + 'pts'] = sec.points.map(function (q, j) {
          var f = j / (n - 1);
          return { t: q.t, d: q.d, c: f < 0.34 ? 'var(--bad)' : f < 0.7 ? 'var(--warn)' : 'var(--acc)' };
        });
      } else if (sec.type === 'matrix') {
        vals[p + 'cols'] = sec.cols.map(function (c, j) { return { t: c.t, c: c.hi ? 'var(--acc)' : 'var(--ink3)' }; });
        vals[p + 'rows'] = sec.rows.map(function (r, j) {
          return { i: j, k: r.k, cells: r.cells.map(function (c, q) {
            var yes = c === 'y', no = c === 'n';
            var txt = typeof c === 'object' ? c.t : (yes || no ? '' : c);
            var kind = typeof c === 'object' ? c.k : (yes ? 'y' : no ? 'n' : '');
            return { t: txt, dIc: kind ? 'inline-flex' : 'none', icp: kind === 'y' ? ic.check : kind === 'n' ? ic.xc : '', ic: kind === 'y' ? 'var(--acc)' : 'var(--bad)', bg: (sec.cols[q] && sec.cols[q].hi) ? 'var(--elev)' : 'transparent' };
          }) };
        });
      } else if (sec.type === 'own') {
        vals[p + 'owned'] = sec.owned.map(function (t) { return { t: t }; });
        vals[p + 'together'] = sec.together.map(function (t) { return { t: t }; });
      } else if (sec.type === 'facts') {
        vals[p + 'rows'] = sec.rows.map(function (r) { return { k: r.k, v: r.v }; });
      } else if (sec.type === 'chips') {
        vals[p + 'items'] = sec.items.map(function (c, j) { return { i: j, t: c.t, icp: ic[c.ic] }; });
      }
    });

    if (SPEC.projects) {
      vals.projects = SPEC.projects.map(function (p, j) {
        var x = p.scr;
        return { n: '0' + (j + 1), title: p.title, meta: p.meta, href: p.file, ask: p.ask, real: p.real, metric: p.metric, metricLabel: p.metricLabel, blurb: p.blurb, icp: ic[p.icon],
          tags: p.tags.map(function (t) { return { t: t }; }), sh: x.head, sbig: x.big, chip: x.chip || '', hasChip: !!x.chip, dChip: x.chip ? 'block' : 'none', cta: x.cta, isIos: p.dev === 'ios', isWeb: p.dev === 'web', isFlow: p.dev === 'flow', cover: p.cover, coverAlt: p.coverAlt, cw: p.cw, ch: p.ch,
          rows: x.rows.map(function (r) { return { a: r[0], b: r[1] }; }), cur: 'Open', big: j === 0 ? 'big' : '' };
      });
    }
    if (SPEC.aiBuilds) {
      vals.aiBuilds = SPEC.aiBuilds.map(function (p, j) {
        return { i: j, n: 'AI 0' + (j + 1), kind: p.kind || '', title: p.title, meta: p.meta, href: p.file, ask: p.ask, real: p.real, metric: p.metric, metricLabel: p.metricLabel, blurb: p.blurb, icp: ic[p.icon], tags: p.tags.map(function (t) { return { t: t }; }), cur: 'Open', live: p.url || '', thumb: p.thumb || '', liveShow: p.url ? 'inline-flex' : 'none' };
      });
    }
    if (SPEC.beyond) {
      vals.beyond = SPEC.beyond.map(function (b, j) { return { i: j, t: b.t, role: b.role, yrs: b.yrs, ind: b.ind, aud: b.aud, d: b.d, icp: ic[b.ic], pts: b.pts.map(function (q) { return { t: q }; }), dPts: b.pts.length ? 'flex' : 'none' }; });
    }
    return Object.assign(vals, {
      theme: s.theme,
      themeIcon: dark ? ic.sun : ic.moon,
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () {
        var next = s.theme === 'dark' ? 'light' : 'dark';
        self.setState({ theme: next });
        try { localStorage.setItem('rk-theme', next); } catch (e) {}
      },
      gpCls: s.paused ? 'gp' : '',
      motionIcon: s.paused ? ic.play : ic.pause,
      motionPressed: s.paused,
      motionTipT: s.paused ? 'Resume motion' : 'Pause motion',
      motionTipD: s.paused ? 'Carousels, counters and demos are frozen. Press to play them again.' : 'Stops auto-playing carousels, counters and animated demos. Press again to resume.',
      toggleMotion: function () { self.setState({ paused: !self.state.paused }); },
      closeMenu: function () { try { var d = document.querySelector('details.mnav'); if (d) d.removeAttribute('open'); } catch (x) {} },
      ic: ic, vw: vw,
      setDot: function (el) { self.dotEl = el; },
      setRing: function (el) { self.ringEl = el; },
      setBubble: function (el) { self.bubbleEl = el; },
      onMove: function (e) {
        self.mx = e.clientX; self.my = e.clientY;
        var t = e.target, lab = '', hov = false;
        if (t && t.closest) {
          var d = t.closest('[data-cur]');
          if (d) lab = d.getAttribute('data-cur') || '';
          hov = !!t.closest('a,button,input,label');
        }
        if (lab !== self.state.curLab || hov !== self.state.curHov) self.setState({ curLab: lab, curHov: hov });
      },
      onOut: function () { self.mx = -200; self.my = -200; },
      crLab: s.curLab ? 'lab' : '',
      crHov: (s.curHov && !s.curLab) ? 'hov' : '',
      curLabel: s.curLab
    });
  }
}

</script>
