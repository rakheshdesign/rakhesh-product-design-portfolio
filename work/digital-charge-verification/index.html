<section>
<h1>Calm in the middle of a fraud scare.</h1>
<p>Keep Card Members calm and in control when a charge looks like fraud, as measured by a UAT (user acceptance testing) read across three finalist versions, by turning a scary yes-or-no alert into one clear, guided review. A net-new feature.</p>
<p>United Kingdom</p>
<p>Japan</p>
<p>Australia</p>
<p>New Zealand</p>
<p>México</p>
<p>Verify, replace, confirm. The calm path through a scare</p>
</section>
<section>
<h2>Step in earlier, inside the app.</h2>
</section>
<section>
<h2>Complex behind the scenes. Clear for the customer.</h2>
<p>1 Detect Spot a risky charge</p>
<p>2 Verify Review each charge Recognize · Don’t recognize</p>
<p>3 Guide Explain and reassure</p>
<p>4 Resolve One clear next step</p>
<p>Someone else used the card. The Card Member did not take part.</p>
<p>The Card Member was tricked into paying, by a false story.</p>
<p>A caller or message steered the choice, step by step.</p>
<p>So version one makes the “no” path calm and quick. It also lays the ground to spot risk behind a “yes” later.</p>
</section>
<section>
<h2>Reassure first. Ask one thing.</h2>
<p>Charges listed</p>
<p>Nothing selected</p>
<p>Continue is dim</p>
<p>Choice per charge</p>
<p>Continue turns active</p>
<p>You own what you marked</p>
<p>Confirm or close</p>
<p>One calm status line</p>
<p>No further action</p>
<p>Done</p>
<p>Nudge to finish</p>
<p>Exit</p>
<p>Charges listed</p>
<p>Nothing selected</p>
<p>Continue is dim</p>
<p>Strong, not red-heavy</p>
<p>Continue</p>
<p>Confirm sheet</p>
<p>Confirm or close</p>
<p>One calm status line</p>
<p>Action needed</p>
<p>Two plain steps</p>
<p>Begin replacement</p>
<p>Address and method</p>
<p>Submit order</p>
<p>Optional detour</p>
<p>Order summary</p>
<p>Continue</p>
<p>Scam-safety tips</p>
<p>Done</p>
<p>Apps · Subscriptions · Wallets</p>
<p>Steps per merchant</p>
<p>One pill per charge Replaces radio buttons. A clear answer for each charge, in one tap, editable any time.</p>
<p>Recognition cues Merchant, time, amount and status sit together. People recognize, they don’t recall.</p>
<p>Calm until chosen Nothing is selected by default. Color appears after a tap, so nothing reads as a verdict.</p>
<p>A footer that responds Continue stays dim until every charge has an answer. It prevents accidental taps.</p>
<h4>Verify recent purchases</h4>
<p>Mark each purchase you recognize.</p>
<h4>Verify recent purchases</h4>
<p>By selecting “Confirm”, you acknowledge that you made, and are responsible for, the purchases marked “I recognize this”.</p>
<h4>You’ve verified your purchases</h4>
<p>No further action is needed. You can keep using your card as you normally would.</p>
<p>NEW A pill per charge, with recognition cues</p>
<p>NEW An acknowledgement before anything is final</p>
<p>Closure: “No further action is needed”</p>
<h4>Verify recent purchases</h4>
<p>Mark each purchase you recognize.</p>
<h4>Replace your card</h4>
<p>Your review shows your card may be compromised. We recommend replacing it to secure your account.</p>
<p>You won’t need to update your card in your digital wallets or with merchants that bill it automatically.</p>
<h4>Replacement ordered</h4>
<p>Your new card is on the way.</p>
<h4>Account secured</h4>
<p>Stay protected from scams.</p>
<p>NEW Not-mine state: strong, but not red-heavy</p>
<p>NEW Plain steps and a delivery timeline</p>
<p>NEW Scam-safety tips, in three bullets</p>
<p>Illustrative recreations. Real screens are confidential. Merchants and amounts are placeholders.</p>
</section>
<section>
<h2>Top three, tested. One pill per charge won.</h2>
<p>Please verify these purchase attempts to ensure your account security.</p>
<p>Illustrative recreations. Placeholder merchants and amounts. Qualitative results.</p>
<p>Go with Version B, the pill per charge.IN THE DESIGN</p>
<p>Improve the “because of your previous response” framing.</p>
<p>Replace “may be canceled” with definitive language.</p>
<p>Expand the card-replaced screen to answer Card Members’ open questions.</p>
<p>Show which authorized user attempted each charge.</p>
<p>Make the expandable per-charge view easier to find.</p>
<p>Make the card-on-file link explicit in the linked-account callout, and advise a password update.</p>
<p>Secured Card Members at the moment of a scam scare, as measured by a UAT read where the pill-per-charge version was recommended over two alternatives, by replacing a yes-or-no alert with a calm, guided review, then a clear next step</p>
</section>
<section>
<h2>How I got there.</h2>
<p>The research, journey map and five explored concepts behind the design above.</p>
</section>
<section>
<h2>In their shoes, at every step.</h2>
<p>H1 People in a scare can’t process complex information. They lean on clear guidance.</p>
<p>H2 A yes-or-no fraud choice without context breeds hesitation and wrong actions.</p>
<p>H3 Recognition cues, visual and contextual, raise confidence and accuracy.</p>
<p>H4 Reassurance at every stage lowers perceived risk and builds trust.</p>
<p>H5 Feeling protected, not only asked, lifts satisfaction and perceived safety.</p>
<h4>Entry point</h4>
<p>Panic</p>
<p>Surprise</p>
<p>Confusion</p>
<p>The alert lacks context: amount, merchant, place</p>
<p>The tone is alarming, with no guidance</p>
<p>No sense of how serious it is</p>
<p>“Did someone just steal my money?”</p>
<p>“Is my card already compromised?”</p>
<p>Shift from alert to guided reassurance: “We detected something unusual. You’re protected. Let’s check it.”</p>
<h4>Recognize</h4>
<p>Suspicious</p>
<p>Trying to recall</p>
<p>Overloaded</p>
<p>Merchant names are hard to recognize</p>
<p>Time, place and category are missing</p>
<p>Too much or too little information</p>
<p>“Did I do this? Maybe? Not sure…”</p>
<p>“Why does this name look unfamiliar?”</p>
<p>Help recognition, not recall. Show time, merchant logo, city, category and similar past charges.</p>
<h4>Decide</h4>
<p>Anxiety</p>
<p>Fear of a wrong call</p>
<p>A yes-or-no feels risky</p>
<p>No safety net: “What if I’m wrong?”</p>
<p>Little guidance at the moment of choice</p>
<p>“If I say yes, will I lose money?”</p>
<p>“If I say no, will my card be blocked for nothing?”</p>
<p>Reduce decision anxiety. Add “You can change this later”, a “Not sure?” option and smart suggestions.</p>
<h4>All mine</h4>
<p>Relief</p>
<p>A little doubt</p>
<p>No closure: “Is everything okay now?”</p>
<p>No reason given for the flag</p>
<p>“Why did this even happen?”</p>
<p>“Will this keep happening?”</p>
<p>Build trust with transparency: “We flagged this because it was unusual for your pattern.” Then: “No action needed. Your card is active.”</p>
<h4>Not mine</h4>
<p>High panic</p>
<p>Frustration</p>
<p>Urgency</p>
<p>Fear of financial loss</p>
<p>Unclear what happens next</p>
<p>Too many steps in a critical moment</p>
<p>“Has my money already gone?”</p>
<p>“Is my card still usable?”</p>
<p>“What do I do now?”</p>
<p>Switch to crisis-mode UX. Clear status: “Your card is now blocked.” “Your money is safe, under review.” Next steps, up front.</p>
<h4>Replace</h4>
<p>Annoyance</p>
<p>Inconvenience</p>
<p>Dependency worry</p>
<p>Daily life is disrupted: subscriptions, payments</p>
<p>Replacement feels like a burden</p>
<p>No timeline</p>
<p>“How will I pay for things now?”</p>
<p>“How long will this take?”</p>
<p>Reduce life disruption: “Your digital card is ready.” “Expected delivery: X days.” “Update subscriptions easily.”</p>
<h4>Closure</h4>
<p>Relief</p>
<p>Trust, if handled well</p>
<p>Neutral, if mediocre</p>
<p>No emotional closure</p>
<p>No learning, no feedback loop</p>
<p>“Is everything resolved?”</p>
<p>“Am I safe now?”</p>
<p>Make resolution a trust moment. Summarize: “We protected your account. Here’s what we did.” Add gentle education.</p>
<p>Avoid financial jargon</p>
<p>Say it plainly: you are protected and we will handle this quickly</p>
<p>Disclosures get skipped. Scan first, tap for detail</p>
<p>Show the resolution in real time</p>
<p>We have your back: you do not pay for what you did not do</p>
<p>Explain the back-end simply</p>
<p>Plain, reassuring copy at every stage</p>
<p>Progressive disclosure for the long parts</p>
<p>The journey has to feel intuitive and human</p>
<p>Say what the next step is</p>
<p>A step bar only if there are more than two steps</p>
<p>Crisis-mode UX is worth exploring</p>
<p>Scam tips as short bullets, not paragraphs</p>
<p>Keep the call number visible on every page</p>
<p>One clear primary action per screen</p>
<p>Crisis-mode treatment when the answer is “not mine”</p>
<p>Illustrations could help. Or be too much?</p>
<p>Mobile first, with scalable patterns</p>
<p>Adapt the UI to the state of the fraud</p>
<p>Keep a clear hierarchy. Focus the primary action</p>
<p>Make actions like “Call for help” visible</p>
<p>Risk-based UI states: strong for high risk, calm green for safe</p>
<p>Transaction cards instead of dense rows</p>
<p>Recognition cues such as merchant logos</p>
<p>Is this alert really from Amex?</p>
<p>Show how Amex stands with customers in fraud cases</p>
<p>Clear outcome for each action</p>
<p>Say they will not be charged for fraud</p>
<p>If “not mine”, say what we do next: block, replace</p>
<p>Show what we did in the background</p>
<p>Show a timeline for what happens next</p>
<p>Explain system actions: “We blocked your card to prevent misuse”</p>
<p>Show real-time status: under review, resolved</p>
<p>End with a protection summary</p>
<p>Subtle scam-awareness messages on the relief screen</p>
<p>Binary actions per charge. Better than radio buttons or checkboxes</p>
<p>Instant feedback on every action</p>
<p>Button state change and confirmation</p>
<p>Let people edit their selection</p>
<p>A scared person scans. Names alone don’t ring a bell.</p>
<p>Reassurance, recognition and a clear next step matter most.</p>
<p>Reassure first. Show cues. Ask one thing per charge.</p>
</section>
<section>
<h2>Explore every version. Crit. Refine. Repeat.</h2>
<p>Simple and straightforward. Fits the brand guidelines.</p>
<p>Looks good overall.</p>
<p>Red and green give a clear signal of risk and of what is safe.</p>
<p>Too many colors for the brand’s language and patterns.</p>
<p>Could it take V4’s icons, with V3’s solid buttons?</p>
<p>Match the visual style of the existing purchase verification.</p>
<p>Feels gamified. May not suit this journey.</p>
<p>Fine for one charge. With five, it is long and you cannot see them all.</p>
<p>Does not match the design system. Buttons are too big.</p>
<p>Explore</p>
<p>Team crit</p>
<p>Refine</p>
<p>Crit again</p>
<p>Converge</p>
<p>Aligned rows, spacing and tap targets</p>
<p>Matched the existing purchase-verification style</p>
<p>Cut colors back to the brand language</p>
<p>Made the two choices visually distinct</p>
<p>Kept every charge in view, no long journey</p>
<p>Moved to one clear pill per charge</p>
</section>

.fr-fb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--e1);transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-fb:hover{transform:translateY(-4px)}
.fr-fb .n{position:absolute;top:16px;right:18px;font:700 12px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-fb b{font:600 18px 'Space Grotesk',system-ui,sans-serif}
.fr-fb div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.fr-fb s{color:var(--ink3)}
.fr-fb i{font-style:normal;color:var(--ink3)}
.fr-fb div span{font-weight:600;color:var(--acc)}
/* outcome */
.fr-wcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fr-wc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--e1);transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-wc:hover{transform:translateY(-5px);box-shadow:var(--e2)}
.fr-wc i{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--acc) 11%,var(--card));color:var(--acc);display:grid;place-items:center;margin-bottom:8px}
.fr-wc b{font:600 clamp(18px,1.6vw,21px)/1.2 'Space Grotesk',system-ui,sans-serif}
.fr-wc p{margin:0;font-size:15px;color:var(--ink2)}
.fr-lps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fr-lpw{display:flex;flex-direction:column;gap:10px;min-width:0}
.fr-lp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--e2);font-size:10.5px}
.fr-hero{background:#0B6FD6;color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.fr-hero b{font:600 15px/1.2 'Space Grotesk',system-ui,sans-serif;max-width:60%}
.fr-hero span{align-self:flex-start;background:#fff;color:#0B6FD6;border-radius:4px;padding:3px 10px;font-weight:700;font-size:10px}
.fr-mid{padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.fr-mid b{font:600 12px 'Space Grotesk',system-ui,sans-serif}
.fr-tl{display:grid;gap:8px;width:100%}
.fr-tl.n2{grid-template-columns:repeat(2,1fr)}
.fr-tl.n4{grid-template-columns:repeat(2,1fr)}
.fr-tl span{border-top:2px solid var(--line);padding:8px 6px;font-size:10px;color:var(--ink2);background:var(--card2);border-radius:0 0 8px 8px}
.fr-ex{padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fr-ex>b{font:600 12px 'Space Grotesk',system-ui,sans-serif;text-align:center;padding-bottom:4px}
.fr-ex div{display:flex;align-items:center;gap:10px}
.fr-ex i{flex:none;width:18px;height:18px;border-radius:50%;background:#0B6FD6}
.fr-ex div b{font-size:10.5px;font-weight:600}
.fr-lp.poa em{position:absolute;right:8px;font-style:normal;font:700 10px 'Space Grotesk',system-ui,sans-serif;background:#0B6FD6;color:#fff;border-radius:999px;padding:3px 10px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.fr-lp.poa em.a1{top:10px}
.fr-lp.poa em.a2{top:112px}
.fr-lp.poa em.a3{bottom:90px}
.fr-lp.poa{outline:2px dashed #0B6FD6;outline-offset:-2px}
/* grouped chart */
.fr-gc{padding:28px;display:flex;flex-direction:column;gap:16px}
.fr-lg{display:flex;gap:18px;font:600 13px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2)}
.fr-lg span{display:inline-flex;align-items:center;gap:8px}
.fr-lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.fr-lg i.pod,.fr-gb.pod i{background:var(--ink3)}
.fr-lg i.poa,.fr-gb.poa i{background:var(--fill)}
.fr-gg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:300px;align-items:end;overflow-x:auto}
.fr-g{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:10px;min-width:64px}
.fr-g em{font-style:normal;font-size:12.5px;color:var(--ink2);text-align:center;line-height:1.2;min-height:30px}
.fr-gp{display:flex;align-items:flex-end;gap:5px;flex:1;width:100%;justify-content:center}
.fr-gb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;width:42%;max-width:44px}
.fr-gb span{font:600 11.5px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2)}
.fr-gb.poa span{color:var(--acc)}
.fr-gb i{display:block;width:100%;border-radius:6px 6px 0 0;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,.8,.2,1) calc(var(--d,0s) + var(--i) * .08s + .2s)}
.rv-on .fr-gc:not([data-in]) .fr-bar{transform:scaleY(0)}
.fr-dcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fr-dc{padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.fr-dn{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.fr-dn span{font:600 clamp(22px,2.2vw,30px) 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-dn i{font-style:normal;color:var(--ink3);font-size:22px}
.fr-dn b{font-size:clamp(34px,3.6vw,52px);line-height:1;color:var(--acc)}
.fr-dl{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);padding-top:10px;font-size:15.5px;color:var(--ink2)}
.fr-dl b{font:700 17px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-dl.g b{color:var(--acc)}
.fr-lad{padding:26px 28px;display:flex;flex-direction:column;gap:6px}
.fr-lad>div{display:flex;flex-direction:column;margin-top:8px}
.fr-ld{display:grid;grid-template-columns:minmax(150px,1.1fr) 70px 24px 70px minmax(0,1.6fr);align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line2)}
.fr-ld b{font:600 17px 'Space Grotesk',system-ui,sans-serif;display:block}
.fr-ld small{font-size:13px;color:var(--ink3)}
.fr-ld .a{font:600 18px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3);text-align:right;text-decoration:line-through}
.fr-ld i{font-style:normal;color:var(--ink3);text-align:center}
.fr-ld .b{font:700 20px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)}
.fr-ld.w .b{color:var(--ink2)}
.fr-ld em{font-style:normal;font-size:14.5px;color:var(--ink2)}
/* kind words */
.fr-q{margin:0;position:relative;background:var(--card);border:1.5px solid var(--acc);border-radius:32px;padding:clamp(28px,4vw,56px);box-shadow:0 0 0 1px var(--acc),0 30px 80px -34px var(--glow);display:flex;flex-direction:column;gap:28px}
.fr-qm{color:var(--acc);opacity:.9}
.fr-q blockquote{margin:0;font:500 clamp(20px,2.3vw,30px)/1.45 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);max-width:1040px}
.fr-q mark{color:inherit;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--acc) 34%,transparent) 58%);padding:0 2px;border-radius:3px;background-size:0% 100%;background-repeat:no-repeat;transition:background-size .9s cubic-bezier(.2,.8,.2,1) .5s}
.fr-q mark:nth-of-type(2){transition-delay:.9s}.fr-q mark:nth-of-type(3){transition-delay:1.3s}.fr-q mark:nth-of-type(4){transition-delay:1.7s}
.fr-q[data-in] mark,html:not(.rv-on) .fr-q mark{background-size:100% 100%}
.fr-q figcaption{display:flex;align-items:center;gap:14px}
.fr-av{width:48px;height:48px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 14px 'Space Grotesk',system-ui,sans-serif}
.fr-q figcaption b{display:block;font:600 17px 'Space Grotesk',system-ui,sans-serif}
.fr-q figcaption small{font-size:14px;color:var(--ink3)}
.fr-nx{display:flex;flex-direction:column;gap:14px}
.fr-ng2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fr-ng2>div{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 22px;transition:opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-ng2 i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;font-style:normal}
.fr-ng2 p{margin:0;font-size:16.5px;color:var(--ink2)}
.fr-oi{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc);font-style:normal}
.fr-dg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.fr-dg .q-conv,.fr-dg .q-conv.rt{max-width:none;margin:0;width:100%}
.fr-dg .fr-ng{grid-template-columns:1fr}
.fr-dg .fr-fbg{grid-template-columns:repeat(2,minmax(0,1fr))}
.fr-dg1 .fr-sg{grid-template-columns:1fr}
.fr-dg1 .fr-sc{flex-direction:row;align-items:center;gap:14px;padding:14px 20px}
.fr-dg1 .fr-sc i{margin:0}
.fr-dg1 .fr-sc span{margin-left:auto;text-align:right}
@media (max-width:980px){.fr-dg{grid-template-columns:1fr}}
.fr-mm{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:14px;align-items:stretch}
.fr-mi{align-self:center;justify-self:center;font-style:normal;font-size:26px;color:var(--ink3)}
.fr-mc{border-radius:24px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--e1)}
.fr-mc.bad{background:color-mix(in srgb,var(--bad) 6%,var(--card));border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.fr-mc.ok{background:color-mix(in srgb,var(--acc) 8%,var(--card));border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 24px 50px -30px var(--glow)}
.fr-mc ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s;font-size:17px;color:var(--ink)}
.fr-mc li{display:flex;gap:12px;align-items:center;counter-increment:s}
.fr-mc li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px 'Space Grotesk',system-ui,sans-serif;background:var(--card2);box-shadow:0 0 0 1px var(--line);color:var(--ink2)}
.fr-mc.ok li::before{background:var(--fill);color:var(--fillink);box-shadow:none}
.fr-mc em{font-style:normal;font:600 16px 'Space Grotesk',system-ui,sans-serif;color:var(--bad)}
.fr-mc.ok em{color:var(--acc)}
.fr-vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr-vs span{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.fr-vs small{font:600 11px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fr-vs b{font:700 18px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)}
@media (max-width:860px){.fr-mm{grid-template-columns:1fr}.fr-mi{transform:rotate(90deg)}}
@media (max-width:1100px){.fr-wcs{grid-template-columns:repeat(2,minmax(0,1fr))}.fr-fbg{grid-template-columns:repeat(2,minmax(0,1fr))}.fr-al{grid-template-columns:1fr}.fr-am{border-radius:28px;min-height:0}}
@media (max-width:760px){.fr-sg,.fr-fg,.fr-lps,.fr-dcs,.fr-ng2,.fr-nt,.fr-fbg,.fr-wcs{grid-template-columns:1fr}.fr-ld{grid-template-columns:1fr 54px 18px 54px}.fr-ld em{grid-column:1/-1}.fr-two{grid-template-columns:1fr}.fr-vr{grid-template-columns:70px 1fr 28px}.fr-wi{flex-basis:100%}.fr-lp.poa em.a2{top:140px}}
@media (max-width:700px){.fr-wf .q-cx{width:auto}}
@media (max-width:760px){.fr-dg .fr-fbg{grid-template-columns:1fr}}

.ca-gc.bad b{color:var(--bad)}

.ca-lg{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--ink2)}

.ca-hy{grid-template-columns:1fr 1fr}

.ca-lane{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ca-lt{font:700 13px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:7px 16px;color:#fff}

.ca-lt.dn{background:var(--fill);color:var(--fillink)}
.ca-ls{font-size:15.5px;color:var(--ink2)}
.ca-fl5{justify-content:flex-start}

.ca-nt{padding:26px 28px;display:flex;flex-direction:column;gap:14px}

@media (max-width:1180px){.ca-ln{grid-template-columns:1fr}}
.ca-gl{padding:26px 28px;display:flex;flex-direction:column;gap:18px}

.dv-wf{flex:none;width:176px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--e1);display:flex;flex-direction:column;gap:5px}
.dv-wf small{font:600 10.5px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dv-wf b{font:700 15px/1.25 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.dv-wf ul{margin:2px 0 0;padding-left:15px;font-size:12.5px;line-height:1.4;color:var(--ink2)}
.dv-wf.cau{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.dv-wf.ghost{border-style:dashed;box-shadow:none;background:transparent}
.dv-wst{display:flex;flex-direction:column;align-items:center;gap:0}
.dv-wv{width:2px;height:22px;background:var(--ink3);position:relative}
.dv-wv::before,.dv-wv::after{content:"";position:absolute;left:-3px;width:8px;height:8px;border-color:var(--ink3);border-style:solid;border-width:0}
.dv-wv::before{top:-1px;border-top-width:2px;border-left-width:2px;rotate:45deg}
.dv-wv::after{bottom:-1px;border-bottom-width:2px;border-right-width:2px;rotate:45deg}
.dv-key .kd{border-radius:5px;border-style:dashed;border-color:var(--ink3);background:transparent}
.dv-key .k2{border-radius:5px;background:color-mix(in srgb,var(--acc) 18%,var(--card));border-color:var(--acc)}


/*mx*/
.dv-mx{display:flex;align-items:center;justify-content:center;gap:0;padding:6px 0 4px;flex-wrap:nowrap}
.dv-mxs{display:grid;grid-template-columns:repeat(2,auto);gap:10px;flex:none}
.dv-mxs span{height:42px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:var(--card);font:600 15px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2);box-shadow:var(--e1);white-space:nowrap}
.dv-mxc{position:relative;flex:none;width:64px;height:146px}
.dv-mxc i{position:absolute;display:block;--c:var(--ink2)}
.dv-mxc .t{left:0;top:21px;width:32px;height:52px;border-top:2px solid var(--c);border-right:2px solid var(--c);border-top-right-radius:26px}
.dv-mxc .b{left:0;top:73px;width:32px;height:52px;border-bottom:2px solid var(--c);border-right:2px solid var(--c);border-bottom-right-radius:26px}
.dv-mxc .m{left:0;top:72px;width:100%;height:2px;background:var(--c);border-radius:2px}
.dv-mxc .t::before,.dv-mxc .b::before{content:"";position:absolute;left:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.dv-mxc .t::before{top:-4.5px}
.dv-mxc .b::before{bottom:-4.5px}
.dv-mxc .m::before{content:"";position:absolute;left:-3.5px;top:-2.5px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.dv-mxc .m::after{content:"";position:absolute;right:-2px;top:-4.5px;border:5.5px solid transparent;border-left:8px solid var(--c);border-right:0}
.dv-mxh{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:18px 22px;border:1.5px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:20px;background:var(--card);box-shadow:var(--e2);color:var(--ink);min-width:190px}
.dv-mxh svg{color:var(--ink2)}
.dv-mxh b{font:700 17px 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;margin-top:4px}
.dv-mxh span{font-size:14px;color:var(--ink3)}
.dv-mxa{position:relative;flex:none;width:56px;height:2px;background:var(--ink2);border-radius:2px;margin-right:2px}
.dv-mxa::before{content:"";position:absolute;left:-3.5px;top:-2.5px;width:7px;height:7px;border-radius:50%;background:var(--ink2)}
.dv-mxa::after{content:"";position:absolute;right:-2px;top:-4.5px;border:5.5px solid transparent;border-left:8px solid var(--ink2);border-right:0}
.dv-mxv{display:none}
@media (max-width:980px){
.dv-mx{flex-direction:column;gap:0}
.dv-mxc{display:none}
.dv-mxs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.dv-mxs span{height:auto;min-height:42px;padding:8px 10px;font-size:13.5px;white-space:normal;text-align:center;line-height:1.2}
.dv-mxv,.dv-mxa{display:block;position:relative;width:2px;height:30px;background:var(--ink2);border-radius:2px;margin:6px 0}
.dv-mxa{margin-right:0}
.dv-mxv::before,.dv-mxa::before{content:"";position:absolute;left:-2.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--ink2)}
.dv-mxv::after,.dv-mxa::after{content:"";position:absolute;right:auto;left:-4.5px;top:auto;bottom:-6px;border:5.5px solid transparent;border-top:8px solid var(--ink2);border-bottom:0;border-left:5.5px solid transparent}
.dv-mxh{min-width:min(100%,240px)}
}
/*end-mx*/
/*dv-gm*/
.dvf{display:inline-block;flex:none;width:20px;height:20px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 1px var(--line)}
.dv-gm{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);max-width:620px}
.dv-gm .t{font:600 15px 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.dv-gm .tag{font:700 11px/1 Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:6px 10px}
.dv-gm ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.dv-gm li{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font:600 14px Inter,system-ui,sans-serif;color:var(--ink)}

<section id="build"><div class="wrap" style="padding-top: 80px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 40px"><div class="q-ch"><span class="kick q-kf">03 · The design</span><h2 class="h2 hd" style="max-width: 900px">Reassure first. <span class="em">Ask one thing.</span></h2></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>The flow</b><span class="q-who">Design</span></div><div class="card dv-wbd reveal" data-rv=""><div class="fr-rh"><span class="kick" style="color: var(--acc)">Flow · information architecture</span><span class="q-fs">Every screen, in order. Fraud path tinted.</span></div><div class="dv-wsc" tabindex="0" aria-label="Flow whiteboard, scrolls horizontally"><div class="dv-w2"><div class="dv-wl"><span class="dv-wlh ok">All mine · happy path</span><div class="dv-wr"><div class="dv-wf " data-rv=""><small>Default entry</small><b>Review screen</b><ul><li>Charges listed</li><li>Nothing selected</li><li>Continue is dim</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf " data-rv=""><small>Selected review</small><b>Every charge marked</b><ul><li>Choice per charge</li><li>Continue turns active</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf " data-rv=""><small>Acknowledge</small><b>Confirm sheet</b><ul><li>You own what you marked</li><li>Confirm or close</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf " data-rv=""><small>Loading</small><b>Submitting…</b><ul><li>One calm status line</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf " data-rv=""><small>Confirmation</small><b>Purchases verified</b><ul><li>No further action</li><li>Done</li></ul></div><span class="dv-wa dsh" aria-hidden="true"></span><div class="dv-wf ghost" data-rv=""><small>Exit purchase</small><b>Leave early</b><ul><li>Nudge to finish</li><li>Exit</li></ul></div></div></div><div class="dv-wl cau"><span class="dv-wlh rk">Not mine · high-risk path</span><div class="dv-wr"><div class="dv-wf " data-rv=""><small>Default entry</small><b>Review screen</b><ul><li>Charges listed</li><li>Nothing selected</li><li>Continue is dim</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>High-risk review</small><b>A charge marked not mine</b><ul><li>Strong, not red-heavy</li><li>Continue</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>Acknowledge</small><b>Review your choices</b><ul><li>Confirm sheet</li><li>Confirm or close</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>Loading</small><b>Submitting…</b><ul><li>One calm status line</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>Fraud analysis</small><b>Replace your card</b><ul><li>Action needed</li><li>Two plain steps</li><li>Begin replacement</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wst"><div class="dv-wf cau" data-rv=""><small>Order review</small><b>Confirm order details</b><ul><li>Address and method</li><li>Submit order</li></ul></div><span class="dv-wv" aria-hidden="true"></span><div class="dv-wf cau ghost" data-rv=""><small>Change shipping</small><b>Select shipping method</b><ul><li>Optional detour</li></ul></div></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>Replacement ordered</small><b>Card is on the way</b><ul><li>Order summary</li><li>Continue</li></ul></div><span class="dv-wa" aria-hidden="true"></span><div class="dv-wf cau" data-rv=""><small>Account secured</small><b>Stay protected</b><ul><li>Scam-safety tips</li><li>Done</li></ul></div><span class="dv-wa dsh" aria-hidden="true"></span><div class="dv-wf cau ghost" data-rv=""><small>Merchant compromised</small><b>Merchant reset guidance</b><ul><li>Apps · Subscriptions · Wallets</li><li>Steps per merchan late(308.899 -33.824)" fill="var(--u-w)"/><path d="M3.21,0H171.5a3.21,3.21,0,1,1,0,6.419H3.21A3.21,3.21,0,0,1,3.21,0Z" transform="translate(820.596 578.117)" fill="var(--u-p)"/><path d="M3.21,0H171.5a3.21,3.21,0,1,1,0,6.419H3.21A3.21,3.21,0,0,1,3.21,0Z" transform="translate(820.596 594.151)" fill="var(--u-p)"/><path d="M3.21,0H171.5a3.21,3.21,0,1,1,0,6.419H3.21A3.21,3.21,0,0,1,3.21,0Z" transform="translate(820.596 610.186)" fill="var(--u-p)"/></g></svg></figure><div class="fr-ng2 dv-rec"><div data-rv="" class="dn"><i>1</i><p>Go with Version B, the pill per charge.<em class="dv-dn2">In the design</em></p></div><div data-rv="" class=""><i>2</i><p>Improve the “because of your previous response” framing.</p></div><div data-rv="" class=""><i>3</i><p>Replace “may be canceled” with definitive language.</p></div><div data-rv="" class=""><i>4</i><p>Expand the card-replaced screen to answer Card Members’ open questions.</p></div><div data-rv="" class=""><i>5</i><p>Show which authorized user attempted each charge.</p></div><div data-rv="" class=""><i>6</i><p>Make the expandable per-charge view easier to find.</p></div><div data-rv="" class=""><i>7</i><p>Make the card-on-file link explicit in the linked-account callout, and advise a password update.</p></div></div></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">3</span><b>What comes next</b><span class="q-who">Product · Design</span></div><div class="card fr-rp reveal" data-rv=""><div class="fr-rh"><span class="kick">What we will watch after launch</span><span class="q-fs">Targets, not results.</span></div><div class="fr-ng"><span class="fr-nd" data-rv=""><i>1</i>Fewer fraud and scam losses</span><span class="fr-nd" data-rv=""><i>2</i>More cases resolved in the app</span><span class="fr-nd" data-rv=""><i>3</i>A proven pattern, ready to scale</span></div></div><div class="card dv-rm reveal" data-rv=""><div class="fr-rh"><span class="kick" style="color: var(--acc)">Where this goes</span><span class="q-fs">Learn first. Add safeguards as risk rises.</span></div><div class="dv-rml"><div class="dv-rmc now" data-rv=""><small>2026</small><b>Prove</b><span>Inform and resolve in the app</span></div><div class="dv-rmc" data-rv=""><small>2027</small><b>Evolve</b><span>Pause and confirm intent when risk is high</span></div><div class="dv-rmc" data-rv=""><small>2028</small><b>Scale</b><span>Cooling-off pauses and extra verification</span></div></div></div><p class="q-xyz reveal" data-rv=""><b>Secured</b> Card Members at the moment of a scam scare, <b>as measured by</b> a UAT read where the pill-per-charge version was recommended over two alternatives, <b>by</b> replacing a yes-or-no alert with a calm, guided review, then a clear next step</p></div></div></section>
<section id="evidence"><div class="wrap" style="padding-top: 72px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 16px"><div class="q-ch"><span class="kick q-kf">The evidence</span><h2 class="h2 hd" style="max-width: 900px">How I got <span class="em">there.</span></h2></div><p class="lead" style="margin: 0; max-width: 720px">The research, journey map and five explored concepts behind the design above.</p></div></section>
<section id="research" style="background: var(--bg2); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2)"><div class="wrap" style="padding-top: 80px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 40px"><div class="q-ch"><span class="kick q-kf">05 · Research</span><h2 class="h2 hd" style="max-width: 900px">In their shoes, <span class="em">at every step.</span></h2></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>Getting into their shoes</b><span class="q-who">Design</span></div><div class="fr-dg"><div class="ud-stack"><div class="ud-row rt" data-rv style="--hy:.19"><div class="ud-fg"><div class="ud-gr"><svg class="ud ud-r" viewBox="105 95 180 210" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><use href="#udb-pd"/></svg></div><span class="ud-cap">Design</span><span class="ud-pp">Paraphrased</span></div><div class="ud-bs"><span class="ub me" style="--k:0">In a scare, people don’t read. They <em>scan</em>.</span><span class="ub me" style="--k:1">So: hypotheses, flow, journey, insights.</span></div></div></div><div class="card fr-rp reveal ca-cm" data-rv=""><div class="fr-rh"><span class="kick" style="color: var(--acc)">Research, step by step</span><span class="q-fs">Four moves, in order</span></div><div class="dv-ex"><span class="dv-exr" data-rv=""><i>1</i><b>Hypotheses</b><small>What we believe, before we design</small></span><span class="dv-exr" data-rv=""><i>2</i><b>User flow</b><small>Every way in, every path out</small></span><span class="dv-exr" data-rv=""><i>3</i><b>Journey map</b><small>Feelings, thoughts and pain at each step</small></span><span class="dv-exr" data-rv=""><i>4</i><b>Synthesis</b><small>Insights sorted into five buckets</small></span></div></div></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">2</span><b>What we believed</b><span class="q-who">Design-level assumptions, not measured</span></div><div class="dv-hg"><p class="dv-hs" data-rv="" style="--r:-1.6deg"><b>H1</b>People in a scare can’t process complex information. They lean on clear guidance.</p><p class="dv-hs" data-rv="" style="--r:1.2deg"><b>H2</b>A yes-or-no fraud choice without context breeds hesitation and wrong actions.</p><p class="dv-hs" data-rv="" style="--r:-0.8deg"><b>H3</b>Recognition cues, visual and contextual, raise confidence and accuracy.</p><p class="dv-hs" data-rv="" style="--r:1.8deg"><b>H4</b>Reassurance at every stage lowers perceived risk and builds trust.</p><p class="dv-hs" data-rv="" style="--r:-1.2deg"><b>H5</b>Feeling protected, not only asked, lifts satisfaction and perceived safety.</p></div><div class="dv-ivw"><figure class="dv-fgx  " data-rv=""><svg class="udsc" viewBox="0 0 800 520.537" role="img" aria-label="A researcher mapping what people think and feel" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-560 -259)"><g transform="translate(1061.493 559.17)"><path d="M15.771,60.505C6.023,47.539.389,33.039.2,16.508a3.567,3.567,0,0,1,2.17-4.547L35.6.2a3.567,3.567,0,0,1,4.547,2.17l15.567,44a3.567,3.567,0,0,1-2.17,4.547L20.319,62.676A3.567,3.567,0,0,1,15.771,60.505Z" transform="translate(0 10.67) rotate(-11)" fill="var(--u-d3)"/><path d="M10.907,45.811C4.637,39.472,1.953,28.165.2,15.563a3.572,3.572,0,0,1,2.174-4.554L32.915.2A3.572,3.572,0,0,1,37.47,2.378L52.284,44.246A3.572,3.572,0,0,1,50.11,48.8L31.192,55.493A15.912,15.912,0,0,1,10.907,45.811Z" transform="translate(2.303 11.903) rotate(-11)" fill="var(--u-g2)"/><path d="M25.813,2.943,2.025,11.434A1.515,1.515,0,0,1,1.006,8.58L24.794.089a1.515,1.515,0,1,1,1.019,2.855Z" transform="translate(18.342 31.186) rotate(-11)" fill="var(--u-p)"/><path d="M7.259,2.943,2.025,4.811A1.515,1.515,0,0,1,1.006,1.957L6.24.089A1.515,1.515,0,1,1,7.259,2.943Z" transform="translate(15.37 30.537) rotate(-11)" fill="var(--u-p)"/><path d="M25.813,2.943,2.025,11.434A1.515,1.515,0,0,1,1.006,8.58L24.794.089a1.515,1.515,0,0,1,1.019,2.855Z" transform="translate(25.134 4 High</span><span class="dv-jy lo">Calm</span><svg viewBox="0 0 700 100" preserveAspectRatio="none"><path class="dv-jarea" d="M50.0 10.0 C66.7 13.7 116.7 30.0 150.0 32.0 C183.3 34.0 216.7 15.7 250.0 22.0 C283.3 28.3 316.7 73.0 350.0 70.0 C383.3 67.0 416.7 8.7 450.0 4.0 C483.3 -0.7 516.7 30.0 550.0 42.0 C583.3 54.0 633.3 70.3 650.0 76.0 L650.0 100 L50.0 100 Z"></path><path class="dv-jline" d="M50.0 10.0 C66.7 13.7 116.7 30.0 150.0 32.0 C183.3 34.0 216.7 15.7 250.0 22.0 C283.3 28.3 316.7 73.0 350.0 70.0 C383.3 67.0 416.7 8.7 450.0 4.0 C483.3 -0.7 516.7 30.0 550.0 42.0 C583.3 54.0 633.3 70.3 650.0 76.0"></path></svg><span class="dv-jd2" style="left:7.14%;top:10px"></span><span class="dv-jd2" style="left:21.43%;top:32px"></span><span class="dv-jd2" style="left:35.71%;top:22px"></span><span class="dv-jd2" style="left:50.00%;top:70px"></span><span class="dv-jd2" style="left:64.29%;top:4px"></span><span class="dv-jd2" style="left:78.57%;top:42px"></span><span class="dv-jd2" style="left:92.86%;top:76px"></span></div><div class="dv-jcs"><div class="dv-jc2" data-rv=""><h4>Entry point</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Panic</li><li>Surprise</li><li>Confusion</li></ul><b>Pain points</b><ul><li>The alert lacks context: amount, merchant, place</li><li>The tone is alarming, with no guidance</li><li>No sense of how serious it is</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“Did someone just steal my money?”</li><li>“Is my card already compromised?”</li></ul><b>Opportunities</b><p>Shift from alert to guided reassurance: “We detected something unusual. You’re protected. Let’s check it.”</p></div><div class="dv-nw"><span class="dv-nc">Push notification</span><span class="dv-lk"><em>Taps the alert</em></span></div></div><div class="dv-jc2" data-rv=""><h4>Recognize</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Suspicious</li><li>Trying to recall</li><li>Overloaded</li></ul><b>Pain points</b><ul><li>Merchant names are hard to recognize</li><li>Time, place and category are missing</li><li>Too much or too little information</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“Did I do this? Maybe? Not sure…”</li><li>“Why does this name look unfamiliar?”</li></ul><b>Opportunities</b><p>Help recognition, not recall. Show time, merchant logo, city, category and similar past charges.</p></div><div class="dv-nw"><span class="dv-nc">Review screen</span><span class="dv-lk"><em>Sees five charges</em></span></div></div><div class="dv-jc2" data-rv=""><h4>Decide</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Anxiety</li><li>Fear of a wrong call</li></ul><b>Pain points</b><ul><li>A yes-or-no feels risky</li><li>No safety net: “What if I’m wrong?”</li><li>Little guidance at the moment of choice</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“If I say yes, will I lose money?”</li><li>“If I say no, will my card be blocked for nothing?”</li></ul><b>Opportunities</b><p>Reduce decision anxiety. Add “You can change this later”, a “Not sure?” option and smart suggestions.</p></div><div class="dv-nw"><span class="dv-nc">Answer each charge</span><span class="dv-lk"><em>Marks each one</em></span></div></div><div class="dv-jc2" data-rv=""><h4>All mine</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Relief</li><li>A little doubt</li></ul><b>Pain points</b><ul><li>No closure: “Is everything okay now?”</li><li>No reason given for the flag</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“Why did this even happen?”</li><li>“Will this keep happening?”</li></ul><b>Opportunities</b><p>Build trust with transparency: “We flagged this because it was unusual for your pattern.” Then: “No action needed. Your card is active.”</p></div><div class="dv-nw"><span class="dv-nc">Acknowledgement</span><span class="dv-lk alt"><em>Or, if one is not theirs</em></span></div></div><div class="dv-jc2" data-rv=""><h4>Not mine</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>High panic</li><li>Frustration</li><li>Urgency</li></ul><b>Pain points</b><ul><li>Fear of financial loss</li><li>Unclear what happens next</li><li>Too many steps in a critical moment</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“Has my money already gone?”</li><li>“Is my card still usable?”</li><li>“What do I do now?”</li></ul><b>Opportunities</b><p>Switch to crisis-mode UX. Clear status: “Your card is now blocked.” “Your money is safe, under review.” Next steps, up front.</p></div><div class="dv-nw"><span class="dv-nc">Crisis moment</span><span class="dv-lk"><em>Needs a new card</em></span></div></div><div class="dv-jc2" data-rv=""><h4>Replace</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Annoyance</li><li>Inconvenience</li><li>Dependency worry</li></ul><b>Pain points</b><ul><li>Daily life is disrupted: subscriptions, payments</li><li>Replacement feels like a burden</li><li>No timeline</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“How will I pay for things now?”</li><li>“How long will this take?”</li></ul><b>Opportunities</b><p>Reduce life disruption: “Your digital card is ready.” “Expected delivery: X days.” “Update subscriptions easily.”</p></div><div class="dv-nw"><span class="dv-nc">Card replacement</span><span class="dv-lk"><em>Gets a new card</em></span></div></div><div class="dv-jc2" data-rv=""><h4>Closure</h4><div class="dv-sk pk"><b>User emotions</b><ul><li>Relief</li><li>Trust, if handled well</li><li>Neutral, if mediocre</li></ul><b>Pain points</b><ul><li>No emotional closure</li><li>No learning, no feedback loop</li></ul></div><div class="dv-sk yl"><b>User thoughts</b><ul><li>“Is everything resolved?”</li><li>“Am I safe now?”</li></ul><b>Opportunities</b><p>Make resolution a trust moment. Summarize: “We protected your account. Here’s what we did.” Add gentle education.</p></div><div class="dv-nw"><span class="dv-nc">Resolution</span></div></div></div></div></div></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">5</span><b>Making sense of it</b><span class="q-who">Synthesis</span></div><div class="card dv-sy reveal" data-rv=""><div class="fr-rh"><span class="kick" style="color: var(--acc)">Synthesized insights · affinity mapping</span><span class="q-fs">Five buckets, each ending in design actions.</span></div><div class="dv-sbd" tabindex="0" aria-label="Synthesis buckets, scrolls horizontally"><div class="dv-sbi"><div class="dv-bk" data-rv=""><span class="dv-bt2">Content<small>What we say</small></span><div class="dv-ns"><p class="dv-note" style="--r:-1.6deg">Avoid financial jargon</p><p class="dv-note" style="--r:1.2deg">Say it plainly: you are protected and we will handle this quickly</p><p class="dv-note" style="--r:-0.8deg">Disclosures get skipped. Scan first, tap for detail</p><p class="dv-note" style="--r:1.8deg">Show the resolution in real time</p><p class="dv-note" style="--r:-1.2deg">We have your back: you do not pay for what you did not do</p><p class="dv-note" style="--r:-1.6deg">Explain the back-end simply</p></div><div class="dv-da"><span class="kick" style="color: var(--acc)">Design actions</span><ul><li>Plain, reassuring copy at every stage</li><li>Progressive disclosure for the long parts</li></ul></div></div><div class="dv-bk" data-rv=""><span class="dv-bt2">UX<small>Flow and structure</small></span><div class="dv-ns"><p class="dv-note" style="--r:1.2deg">The journey has to feel intuitive and human</p><p class="dv-note" style="--r:-0.8deg">Say what the next step is</p><p class="dv-note" style="--r:1.8deg">A step bar only if there are more than two steps</p><p class="dv-note" style="--r:-1.2deg">Crisis-mode UX is worth exploring</p><p class="dv-note" style="--r:-1.6deg">Scam tips as short bullets, not paragraphs</p><p class="dv-note" style="--r:1.2deg">Keep the call number visible on every page</p></div><div class="dv-da"><span class="kick" style="color: var(--acc)">Design actions</span><ul><li>One clear primary action per screen</li><li>Crisis-mode treatment when the answer is “not mine”</li></ul></div></div><div class="dv-bk" data-rv=""><span class="dv-bt2">UI<small>Visual layer</small></span><div class="dv-ns"><p class="dv-note" style="--r:-0.8deg">Illustrations could help. Or be too much?</p><p class="dv-note" style="--r:1.8deg">Mobile first, with scalable patterns</p><p class="dv-note" style="--r:-1.2deg">Adapt the UI to the state of the fraud</p><p class="dv-note" style="--r:-1.6deg">Keep a clear hierarchy. Focus the primary action</p><p class="dv-note" style="--r:1.2deg">Make actions like “Call for help” visible</p></div><div class="dv-da"><span class="kick" style="color: var(--acc)">Design actions</span><ul><li>Risk-based UI states: strong for high risk, calm green for safe</li><li>Transaction cards instead of dense rows</li><li>Recognition cues such as merchant logos</li></ul></div></div><div class="dv-bk" data-rv=""><span class="dv-bt2">Trust<small>Transparency</small></span><div class="dv-ns"><p class="dv-note" style="--r:1.8deg">Is this alert really from Amex?</p><p class="dv-note" style="--r:-1.2deg">Show how Amex stands with customers in fraud cases</p><p class="dv-note" style="--r:-1.6deg">Clear outcome for each action</p><p class="dv-note" style="--r:1.2deg">Say they will not be charged for fraud</p><p class="dv-note" style="--r:-0.8deg">If “not mine”, say what we do next: block, replace</p><p class="dv-note" style="--r:1.8deg">Show what we did in the background</p><p class="dv-note" style="--r:-1.2deg">Show a timeline for what happens next</p></div><div class="dv-da"><span class="kick" style="color: var(--acc)">Design actions</span><ul><li>Explain system actions: “We blocked your card to prevent misuse”</li><li>Show real-time status: under review, resolved</li><li>End with a protection summary</li></ul></div></div><div class="dv-bk" data-rv=""><span class="dv-bt2">Interaction<small>Behavior</small></span><div class="dv-ns"><p class="dv-note" style="--r:-1.2deg">Subtle scam-awareness messages on the relief screen</p><p class="dv-note" style="--r:-1.6deg">Binary actions per charge. Better than radio buttons or checkboxes</p></div><div class="dv-da"><span class="kick" style="color: var(--acc)">Design actions</span><ul><li>Instant feedback on every action</li><li>Button state change and confirmation</li><li>Let people edit their selection</li></ul></div></div></div></div></div><div class="dv-ivw rev"><div class="q-orm reveal"><div class="q-oc" data-rv=""><span class="kick">Observe</span><p>A scared person scans. Names alone don’t ring a bell.</p></div><div class="q-oc" data-rv=""><span class="kick">Learn</span><p>Reassurance, recognition and a clear next step matter most.</p></div><div class="q-oc me" data-rv=""><span class="kick">Make</span><p>Reassure first. Show cues. Ask one thing per charge.</p></div></div><figure class="dv-fgx  " data-rv=""><svg class="udsc" viewBox="0 0 800.385 475.927" role="img" aria-label="A designer sorting sticky notes on a board" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-675.225 -304.907)"><g transform="translate(1393.713 682.811)"><path d="M474.415,539.509v1.424a8.91,8.91,0,0,0,8.9,8.9H547.41a8.9,8.9,0,0,0,8.9-8.9v-1.424a8.838,8.838,0,0,0-2.065-5.7,9.158,9.158,0,0,0-1.5-1.424s-35.237-.8-35.237-1.78h-34.19a8.914,8.914,0,0,0-8.9,8.9Z" transform="translate(-474.415 -530.607)" fill="var(--u-g3)"/><rect width="9.258" height="59.82" transform="translate(36.835 18.874)" fill="var(--u-g3)"/><path d="M550.807,637.043c0,1-14.029.387-31.334.387s-31.334.613-31.334-.387,14.029-8.933,31.334-8.933S550.807,636.043,550.807,637.043Z" transform="translate(-478.366 -558.674)" fill="var(--u-g3)"/></g><rect width="620.283" height="344.882" rx="6" transform="translate(675.225 304.907)" fill="var(--u-g1)"/><rect width="599.438" height="321.511" rx="4" transform="translate(685.962 316.909)" fill="var(--u-w)"/><g transform="translate(749.133 398.194)"><path d="M715.868,359.024A3.522,3.522,0,0,1,715.21,356a83.447,83.447,0,0,0,0-38. <section id="explore"><div class="wrap" style="padding-top: 80px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 40px"><div class="q-ch"><span class="kick q-kf">06 · Exploration</span><h2 class="h2 hd" style="max-width: 900px">Explore every version. <span class="em">Crit. Refine. Repeat.</span></h2></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>Exploring</b><span class="q-who">Design</span></div><div class="fr-dg"><div class="ud-stack"><div class="ud-row rt" data-rv style="--hy:.19"><div class="ud-fg"><div class="ud-gr"><svg class="ud ud-r" viewBox="105 95 180 210" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><use href="#udb-pd"/></svg></div><span class="ud-cap">Design</span><span class="ud-pp">Paraphrased</span></div><div class="ud-bs"><span class="ub me" style="--k:0">Five concepts, same five charges.</span><span class="ub me" style="--k:1">Then design crits. Fix, crit again.</span></div></div></div></div><div class="card dv-cb reveal" data-rv=""><div class="fr-rh"><span class="kick" style="color: var(--acc)">Five concepts, many crits</span><span class="q-fs">Same five charges, five ways to answer. Notes are paraphrased from design crits.</span></div><div class="dv-cbs"><div class="dv-cbi"><div class="dv-cvc g" data-rv="" tabindex="0"><div class="dv-cvh"><b>V1</b><span>Radio per row</span></div><div class="dv-mu"><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-rd"><u class="on"></u>recognize</span><span class="dv-rd"><u></u>don’t</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-rd"><u></u>recognize</span><span class="dv-rd"><u class="on"></u>don’t</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-rd"><u class="on"></u>recognize</span><span class="dv-rd"><u></u>don’t</span></div></div><span class="dv-vd g">Simple, on-brand</span><div class="dv-cn"><p class="g">Simple and straightforward. Fits the brand guidelines.</p></div></div><div class="dv-cvc g" data-rv="" tabindex="0"><div class="dv-cvh"><b>V2</b><span>Segmented chips</span></div><div class="dv-mu"><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-cp">recognize</span><span class="dv-cp no">don’t</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-cp on">✓ recognize</span><span class="dv-cp no">don’t</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-cp">recognize</span><span class="dv-cp no on">✓ don’t</span></div></div><span class="dv-vd g">Clean, on-brand</span><div class="dv-cn"><p class="g">Looks good overall.</p></div></div><div class="dv-cvc y" data-rv="" tabindex="0"><div class="dv-cvh"><b>V3</b><span>Solid buttons</span></div><div class="dv-mu"><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-bt">Yes, mine</span><span class="dv-bt no">Not mine</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-bt">Yes, mine</span><span class="dv-bt no on">✓ Not mine</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-bt on">✓ Yes, mine</span><span class="dv-bt no">Not mine</span></div></div><span class="dv-vd y">Clear signal, loud color</span><div class="dv-cn"><p class="g">Red and green give a clear signal of risk and of what is safe.</p><p class="y">Too many colors for the brand’s language and patterns.</p><p class="y">Could it take V4’s icons, with V3’s solid buttons?</p></div></div><div class="dv-cvc y" data-rv="" tabindex="0"><div class="dv-cvh"><b>V4</b><span>Icons plus chips</span></div><div class="dv-mu"><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-ic"><i>✓</i>recognize</span><span class="dv-ic no"><i>✕</i>not mine</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-ic on"><i>✓</i>recognize</span><span class="dv-ic no"><i>✕</i>not mine</span></div><div class="dv-mr"><span><b>Online payment</b><small>$150.00 · Declined</small></span><span class="dv-ic"><i>✓</i>recognize</span><span class="dv-ic no on"><i>✕</i>not mine</span></div></div><span class="dv-vd y">Hybrid candidate</span><div class="dv-cn"><p class="y">Match the visual style of the existing purchase verification.</p></div></div><div class="dv-cvc r" data-rv="" tabindex="0"><div class="dv-cvh"><b>V5</b><span>One at a time</span></div><div class="dv-mu one"><small>Transaction 1 of 5</small><b>$150.00</b><span>Online payment · Declined</span><div class="dv-sw"><i class="no">✕</i><i class="ok">✓</i></div></div><span class="dv-vd r">Too slow, off-system</span><div class="dv-cn"><p class="r">Feels gamified. May not suit this journey.</p><p class="r">Fine for one charge. With five, it is long and you cannot see them all.</p><p class="r">Does not match the design system. Buttons are too big.</p></div></div></div></div><div class="dv-jb"><span class="kick">Journey behaviors I also explored</span><span class="dv-jbi"><b>V1.1</b>Choice appears only after tapping an “unfamiliar” button</span><span class="dv-jbi"><b>V1.2</b>Choice on the first step</span></div></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">2</span><b>Crit, refine, repeat</b><span class="q-who">Design · Crits</span></div><div class="card dv-lp reveal" data-rv=""><div class="dv-lpf"><figure class="dv-fgx  " data-rv=""><svg class="udsc" viewBox="0 0 787.82738 453.11195" role="img" aria-label="Designers critiquing screens together" xmlns="http://www.w3.org/2000/svg"><circle cx="406.69135" cy="6.46689" r="6.46689" fill="var(--u-g2)"/><circle cx="406.69135" cy="32.24019" r="6.
