<main><section>Web · Enrollment Lead Designer · American Express Fintech · B2C Web <h1>Spend where the funnel bleeds.</h1>
<p>A nine-step enrollment lost most customers before the end, and the budget could not cover a full redesign. I used funnel data and research to pick the highest-friction moments, and removed more than I added.</p>
Result +13% conversion across the core enrollment steps after launch conversion across the core enrollment steps after launch Result +14.9% higher conversion than the previous experience higher conversion than the previous experience Scope ~40% of Terms &amp; Conditions content improved with Risk and Compliance of Terms &amp; Conditions content improved with Risk and Compliance Scope 1 screen removed: Review Your Account screen removed: Review Your Account</section>
<section>The short version <h2>A smaller budget, a sharper brief.</h2>
What was at stake <h3>Most customers left before confirming</h3>
<p>Only 6% reached confirmation, and the later steps lost the most people.</p>
My calls <h3>Fix the worst moments. Remove what is not needed.</h3>
<p>Targeted optimization instead of a rebuild: remove a screen, clarify the landing page, compare plans side by side, simplify Terms.</p>
What changed <h3>+13% conversion, with proof</h3>
<p>Post-launch analysis showed a 13% lift across core steps. The new design converted 14.9% better than the old one.</p>
</section>
<section>The funnel <h2>Where customers left.</h2>
<p>The pre-launch enrollment funnel from the existing experience.</p>
100 % 1 76 % 2 47 % 3 30 % 4 27 % 5 21 % 6 13 % 7 7 % 8 6 % 9 <b>1</b>
· Landing page <b>2</b>
· Login <b>3</b>
· Review Your Account <b>4</b>
· How it works <b>5</b>
· FRP survey <b>6</b>
· Plan selection <b>7</b>
· Payment information <b>8</b>
· Terms &amp; Conditions <b>9</b>
· Confirmation ~38% Plan selection → Payment <p>A major drop at the decision moment. This is where plan comparison needed to work harder.</p>
~42% Payment → Terms <p>Another steep drop, with limited design flexibility because of compliance.</p>
Removed Review Your Account <p>No longer earned its step, so we aligned with Product and Business to remove it.</p>
</section>
<section>The reframe <h2>From redesign it all to remove the friction.</h2>
Before After The question How might we redesign the FRP journey? How might we remove the most meaningful friction with the investment we have? Scope Every screen The highest-friction moments Review Your Account Redesign the screen Remove the screen Evidence Opinions on what feels slow Funnel data plus UAT and Rapid Lab insights</section>
<section>The interventions <h2>See both plans. Decide.</h2>
<p>Customers used to see one plan at a time and remember the rest. Now the choice is visible at once.</p>
Secure · illustrative <b>Card account</b>
Summary Activity Pay Plans Support <h4>Relief that fits your situation</h4>
See how the program works before you start. Lower payments Benefit Clear program details Benefit Simple enrollment Benefit Get started <h4>Choose your plan</h4>
Compare and decide. Short-term $320/mo Duration <b>12 mo</b>
APR <b>0%</b>
Long-term $180/mo Duration <b>24 mo</b>
APR <b>9.9%</b>
Select a plan <h4>Review and agree</h4>
Key points, in plain language What you’re agreeing to Clear What it costs Clear Important information Clear Agree and enroll <p><strong>Illustrative designs.</strong>
Real American Express screens are confidential, so these recreate the flow and decisions without revealing them.</p>
</section>
<section>Plan comparison <h2>From remembering to seeing.</h2>
One plan at a time Side by side Effort Toggle between views and remember the numbers Both plans visible together Thinking Mental math to compare Differences scannable at a glance Information Missing balance, interest and APR context APR visible, monthly payment most prominent Action Easy to lose the path to enroll Comparison supports a clear action</section>
<section>Decisions <h2>Four calls, made with data.</h2>
01 <h3>Remove “Review Your Account”</h3>
Largest drop-off reduction Tension An extra step with little value. <b></b>
Options Redesign it, or remove it. <b></b>
The call Remove it, aligned with Product and Business. <b></b>
Result Biggest reduction in drop-off, per Business and Data. 02 <h3>Compare plans side by side</h3>
Shipped · measured Tension Customers compared from memory. <b></b>
Options A better toggle, a table, or both plans at once. <b></b>
The call Both plans at once, with a clear action. <b></b>
Result 14.9% higher conversion than the old experience. 03 <h3>Show APR, drop cumulative total</h3>
Shaped with Business Tension Too much financial information at the decision point. <b></b>
Options Show everything, or prioritize. <b></b>
The call Include APR. Make monthly payment prominent. Remove cumulative total. <b></b>
Result A scannable, transparent decision. 04 <h3>Improve Terms within limits</h3>
Shipped · ~40% improved Tension A major drop-off, but little room to change. <b></b>
Options Leave it, or improve what compliance allows. <b></b>
The call Improve about 40% of the content with Risk and Compliance. <b></b>
Result An easier end of the journey.</section>
<section>The story arc <h2>Data, research, constraints, then proof.</h2>
</section>
<section>Contribution <h2>Where my work ends and the team’s begins.</h2>
I owned <p>The reframe from full redesign to targeted optimization</p>
<p>Reading funnel and UAT / Rapid Lab evidence into priorities</p>
<p>Plans page explorations and the side-by-side direction</p>
<p>Landing page headline, benefits and structure</p>
<p>Using critiques to strengthen hierarchy and responsive behavior</p>
We did together <p>Removing Review Your Account, with Product and Business</p>
<p>APR and Total Monthly Payment decisions, with Business</p>
<p>Terms &amp; Conditions simplification, with Business, Risk and Compliance</p>
<p>Critiques that shaped the final direction</p>
<p>Post-launch analysis, with Business and Data</p>
</section>
<section>After launch <h2>The proof, and what’s next.</h2>
Conversion 13% increase across the core enrollment steps. New vs old The new experience converted 14.9% higher than the previous one. What worked Business and Data attributed the largest reduction in drop-off to removing the redundant screen, with more from plan comparison and simpler Terms. What’s next A planned brainstorm for the next phase across web and mobile, and exploring whether underused technology funding could support broader enhancements. Still to add The Loan Products variant of this work is a separate case that will be added.</section>
<section><p>The best optimization is not always a better screen. Sometimes it is removing the screen.</p>
</section>

</main>
<footer><h2>Sometimes the best screen is no screen.</h2>
<p>Data told us where. Research told us why. Constraints told us what to leave out.</p>

.pxf .pxi{display:block;width:100%;height:100%;object-fit:cover;object-position:top}

.pxf .pxlt{position:absolute;opacity:0;pointer-events:none}

.pxf .pxlt:checked~.pxi{visibility:hidden}
.pxsw{position:absolute;right:14px;bottom:14px;z-index:2;cursor:pointer;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--btn);color:var(--btnink);font-weight:600;font-size:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);transition:transform .2s}

.pxlt:checked~.pxsw .pxon{display:none}.pxlt:checked~.pxsw .pxoff{display:inline}

    var self = this, ch = {}, any = false;

    Object.keys(this.ap).forEach(function (k) {
      var w = self.ap[k], v = false;
      if (w.el && w.el.getBoundingClientRect) { var r = w.el.getBoundingClientRect(); v = r.bottom > vh * 0.12 && r.top < vh * 0.88; }

  checkCounts() {

  fmt(v, dp) { return dp ? v.toFixed(dp) : String(Math.round(v)); }

    var t0 = performance.now(), dur = 1500;

  }
  renderVals() {
    var s = this.state, self = this;
    var dark = s.theme === 'dark';
    var ic = SPEC.icons;
    var vals = {};
    Object.keys(this.ap).forEach(function (k) {

      } else if (sec.type === 'stage') {
        vals[p + 'tabs'] = sec.items.map(function (it, j) {

          return { n: '0' + (j + 1), label: it.label, body: it.body || '', dBody: on && it.body ? 'block' : 'none', cls: on ? 'on' : '', sel: on, segCls: segOf(k, j), bd: on ? 'var(--acc)' : 'var(--line)', bgc: on ? 'var(--elev)' : 'var(--card)', pick: pickFn(k, j) };
        });

          var x = it.screen, on = j === s[k];
          var prog = [];

            cls: on ? 'on' : '', h: x.h, sub: x.sub || '', dSub: x.sub ? 'block' : 'none', big: x.big || '', dBig: x.big ? 'block' : 'none', bigc: tone(x.bigTone),
            banner: x.banner || '', dBanner: x.banner ? 'block' : 'none', banc: x.bannerTone ? tone(x.bannerTone) : 'var(--acc)',

            rows: (x.rows || []).map(function (r, q) { return { a: r.a, b: r.b || '', c: tone(r.tone), c2: r.tone ? tone(r.tone) : 'var(--ink3)', fw: r.tone ? 600 : 400, bg: r.hl ? 'var(--hl, transparent)' : 'transparent', bd: r.hl ? 'var(--acc)' : 'var(--line2)', cls: 'in' + Math.min(3, q + 1) }; }), dRows: (x.rows && x.rows.length) ? 'flex' : 'none',
            cols: (x.cols || []).map(function (c) { return { h: c.h, big: c.big || '', bw: c.hl ? '2px' : '0px', bd: c.hl ? 'var(--acc)' : 'var(--line)', rows: c.rows.map(function (r) { return { a: r.a, b: r.b }; }) }; }),
            dCols: x.cols ? 'grid' : 'none',
            chip: x.chip || '', dChip: x.chip ? 'block' : 'none', cta: x.cta || '', dCta: x.cta ? 'flex' : 'none'
          };
        });
      } else if (sec.type === 'sync') {
        vals[p + 'tabs'] = sec.steps.map(function (it, j) {
          var on = j === s[k];
          return { n: '0' + (j + 1), label: it.label, body: it.body || '', dBody: on && it.body ? 'block' : 'none', cls: on ? 'on' : '', sel: on, segCls: segOf(k, j), bd: on ? 'var(--acc)' : 'var(--line)', bgc: on ? 'var(--elev)' : 'var(--card)', pick: pickFn(k, j) };
        });

        vals[p + 'fl'] = sec.nodes.map(function (n, j) {
          var on = act[st].indexOf(j) >= 0, done = false;

          return { t: n.t, icp: ic[n.ic], cls: on ? 'on' : (done ? 'done' : ''), aStyle: j === sec.nodes.length - 1 ? 'display: none' : '' };
        });
        vals[p + 'mk'] = sec.markets.map(function (m) { return { t: m.t }; });
        vals[p + 'mrows'] = sec.rows.map(function (r) { return { k: r.k, cells: r.cells.map(function (c, q) { return { t: c, lang: sec.markets[q].lang }; }) }; });
        vals[p + 'stepCls'] = 's' + st;
        vals[p + 'note'] = sec.notes[st];
      } else if (sec.type === 'funnel') {
        var mx = Math.max.apply(null, sec.cols.map(function (c) { return c.v; }));

        vals[p + 'rows'] = sec.rows.map(function (r, j) {

        vals[p + 'items'] = sec.items.map(function (c, j) { return { i: j, t: c.t, icp: ic[c.ic] }; });

    if (SPEC.projects) {

        var x = p.scr;
        return { n: '0' + (j + 1), title: p.title, meta: p.meta, href: p.file, ask: p.ask, real: p.real, metric: p.metric, metricLabel: p.metricLabel, blurb: p.blurb, icp: ic[p.icon],
          tags: p.tags.map(function (t) { return { t: t }; }), sh: x.head, sbig: x.big, chip: x.chip || '', hasChip: !!x.chip, dChip: x.chip ? 'block' : 'none', cta: x.cta, isIos: p.dev === 'ios', isWeb: p.dev === 'web', isFlow: p.dev === 'flow', cover: p.cover, coverAlt: p.coverAlt, cw: p.cw, ch: p.ch,
          rows: x.rows.map(function (r) { return { a: r[0], b: r[1] }; }), cur: 'Open', big: j === 0 ? 'big' : '' };

    if (SPEC.aiBuilds) {
      vals.aiBuilds = SPEC.aiBuilds.map(function (p, j) {
        return { i: j, n: 'AI 0' + (j + 1), kind: p.kind || '', title: p.title, meta: p.meta, href: p.file, ask: p.ask, real: p.real, metric: p.metric, metricLabel: p.metricLabel, blurb: p.blurb, icp: ic[p.icon], tags: p.tags.map(function (t) { return { t: t }; }), cur: 'Open', live: p.url || '', thumb: p.thumb || '', liveShow: p.url ? 'inline-flex' : 'none' };

      },
      onOut: function () { self.mx = -200; self.my = -200; },
      crLab: s.curLab ? 'lab' : '',
