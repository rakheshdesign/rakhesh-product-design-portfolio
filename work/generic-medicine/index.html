.mc-wc p{margin:0;font-size:15.5px;color:var(--ink2)}
.mc-wc .mk{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
/* compare */
.mc-cmp{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:44px;align-items:start}
@media (max-width:980px){.mc-cmp{grid-template-columns:1fr}}
.mc-pn{padding:28px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--e3)}
.mc-ph2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:14px}
.mc-ph2 h3{margin:0;font:600 clamp(24px,2.6vw,34px)/1.12 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;max-width:460px}
.mc-cnt{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mc-cnt .dots{display:flex;gap:6px}
.mc-cnt .dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.mc-cnt .dots i.on{background:var(--fill)}
.mc-cnt b{font:600 15px 'Space Grotesk',system-ui,sans-serif}
.mc-dh,.mc-dr{display:grid;grid-template-columns:108px minmax(0,1fr) minmax(0,1.25fr);gap:16px}
.mc-dh{padding:6px 0 8px}
.mc-dr{padding:14px 0;border-top:1px solid var(--line2);align-items:start}
.mc-dr .k{font:600 15px 'Space Grotesk',system-ui,sans-serif}
.mc-dr .b{font-size:14.5px;color:var(--ink3);line-height:1.45}
.mc-dr .n{font-size:15.5px;line-height:1.45;color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mc-dr.chg .n{color:var(--ink);background:color-mix(in srgb,var(--acc) 8%,transparent);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 12px 12px 0}
.mc-tg{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--ink3);background:var(--card2)}
.mc-dr.chg .mc-tg{border-color:var(--acc);color:var(--acc);background:transparent}
@media (max-width:700px){.mc-dh{display:none}.mc-dr{grid-template-columns:1fr;gap:6px}.mc-dr .b::before{content:"Baseline: ";font-weight:700}}
/* local launches */
.mc-lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}
.mc-lcc{padding:28px;display:flex;flex-direction:column;gap:18px;height:100%;box-sizing:border-box}
.mc-lch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mc-dg{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mc-hub{align-self:center;padding:10px 16px;border-radius:12px;background:var(--fill);color:var(--fillink);font:600 14px 'Space Grotesk',system-ui,sans-serif;text-align:center}
.mc-br{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative;padding-top:18px}
.mc-br::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:18px;border:1.5px solid var(--acc);border-bottom:0;border-radius:10px 10px 0 0}
.mc-br span{font:600 12px/1.25 'Space Grotesk',system-ui,sans-serif;text-align:center;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.mc-lst2{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mc-lst2 div{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:0 14px;font-size:14px;border-top:1px solid var(--line2);color:var(--ink2)}
.mc-lst2 div:first-child{border-top:0;font:700 11px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:var(--card2)}
.mc-lst2 div.hl{background:color-mix(in srgb,var(--acc) 9%,transparent);box-shadow:inset 3px 0 0 var(--acc);color:var(--ink);font-weight:600}
.mc-lst2 div.hl em{font:700 10px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-style:normal;border:1px solid var(--acc);border-radius:999px;padding:2px 8px;white-space:nowrap}
.mc-yo{display:flex;flex-direction:column;gap:12px}
.mc-yo .kick{font-size:11px}
.mc-yo p{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink2)}
/* trip strip */
.mc-trip{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1.15fr);align-items:stretch}
.mc-trip .mc-ta{display:grid;place-items:center;color:var(--ink3)}
.mc-tc{padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.mc-tc.me{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 22px 50px -28px var(--glow)}
.mc-tc p{margin:0;font-size:16px;line-height:1.45;color:var(--ink)}
.mc-tc .kick{font-size:11px}
.mc-tc.me .kick{color:var(--acc)}
@media (max-width:860px){.mc-trip{grid-template-columns:1fr}.mc-trip .mc-ta{transform:rotate(90deg);height:30px}}
.mc-tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.mc-tl::before{content:"";position:absolute;left:12%;right:12%;top:13px;height:2px;background:var(--line)}
.mc-tn{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:0 10px}
.mc-tn i{width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font:700 12px 'Space Grotesk',system-ui,sans-serif;font-style:normal;color:var(--ink2);position:relative;z-index:1}
.mc-tn.on i{background:var(--fill);border-color:var(--fill);color:var(--fillink)}
.mc-tn b{font:600 16px/1.2 'Space Grotesk',system-ui,sans-serif}
.mc-tn span{font-size:14px;color:var(--ink2);line-height:1.4}
@media (max-width:760px){.mc-tl{grid-template-columns:1fr;gap:18px}.mc-tl::before{display:none}.mc-tn{flex-direction:row;text-align:left;align-items:flex-start;gap:14px}}
.mc-dots{display:flex;flex-wrap:wrap;gap:10px}
.mc-dots i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card2);display:block}
.mc-dots i.up{background:var(--acc2);border-color:var(--acc2)}
.mc-dots i.no{background:var(--ink3);border-color:var(--ink3)}
.mc-dots i.no2{border-style:dashed;border-color:var(--ink3);background:transparent}
.mc-lg{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--ink2)}
.mc-lg span{display:inline-flex;align-items:center;gap:8px}
.mc-lg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.mc-rsx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.mc-cap{font-size:14px;color:var(--ink3);text-align:center;margin:10px 0 0}
/*end-mc*/
/*fj*/
.fj-head{display:flex;flex-direction:column;gap:16px}
.fj-leg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13.5px;color:var(--ink2)}
.fj-leg span{display:inline-flex;align-items:center;gap:8px}
.fj-leg i{width:22px;height:14px;border-radius:5px;display:inline-block;border:2px solid var(--ink3);background:var(--card)}
.fj-leg i.sw{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.fj-leg i.vb{border-style:dashed}
.fj-lanes{display:flex;flex-wrap:wrap;gap:8px}
.fj-scroll{overflow-x:auto;padding:6px 2px 14px;margin:0 -2px}

.fj svg.fj-cx{position:absolute;inset:0;width:1120px;height:590px;overflow:visible;pointer-events:none}
.fj-p{fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s}
.fj-p.a{stroke:var(--acc)}
.fj-p.dash{stroke-dasharray:6 6}
.fj-n{position:absolute;box-sizing:border-box;background:var(--card);border:2px solid var(--ink3);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--e2);transition:opacity .35s,transform .25s,box-shadow .25s}
.fj-n:hover{transform:translateY(-3px);box-shadow:var(--e3)}
.fj-n.sw{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.fj-n.vb{border-style:dashed}
.fj-nt{display:flex;align-items:center;gap:8px;font:600 13px/1.15 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.fj-nt b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 11px 'Space Grotesk',system-ui,sans-serif}
.fj-tg{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fj-n.sw .fj-tg{color:var(--acc)}
.fj-dm{position:absolute;width:64px;height:64px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 11px 'Space Grotesk',system-ui,sans-serif;text-align:center;line-height:1.1}
.fj-pill{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--ink3);color:var(--ink);border-radius:999px;padding:3px 10px;font:600 11.5px 'Space Grotesk',system-ui,sans-serif;white-space:nowrap;transition:opacity .35s}
.fj-pill.a{border-color:var(--acc);color:var(--acc)}
.fj-st{position:absolute;box-sizing:border-box;padding:12px 14px;font:500 13px/1.3 'Space Grotesk',system-ui,sans-serif;color:#1b1b1b;background:#FFE58A;box-shadow:0 10px 22px -12px rgba(0,0,0,.45);transform:rotate(2deg);border-radius:4px}
.fj-st.b{background:#BDE7C9;transform:rotate(-2deg)}
.fj-st b{display:block;font:700 26px/1 'Space Grotesk',system-ui,sans-serif;margin-bottom:4px}
.fj.l1 .ln2,.fj.l1 .ln3,.fj.l2 .ln1,.fj.l2 .ln3,.fj.l3 .ln1,.fj.l3 .ln2{opacity:.2}
.fj-w{display:flex;flex-direction:column;gap:5px;height:76px;justify-content:flex-start}
.wf-l{height:6px;border-radius:3px;background:var(--line)}
.wf-l.s{width:60%}.wf-l.m{width:80%}
.wf-b{height:16px;border-radius:8px;background:var(--btn);margin-top:auto}
.wf-t{height:22px;border-radius:6px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 7px;font:600 11px 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.wf-card{height:22px;border-radius:5px;background:#0B3B8C;width:34px}
.wf-seg{display:grid;grid-template-columns:repeat(11,1fr);gap:2px}
.wf-seg i{height:4px;border-radius:2px;background:var(--line)}
.wf-seg i.on{background:var(--acc)}
.wf-r{display:flex;align-items:center;gap:6px}
.wf-r u{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--ink3);flex:none}
.wf-r u.on{border-color:var(--acc);background:var(--acc)}
.wf-r .wf-l{flex:1}
.wf-ok{width:24px;height:24px;border-radius:50%;background:var(--hl);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.fj-stack{position:relative}
.fj-stack::before,.fj-stack::after{content:"";position:absolute;inset:0;border-radius:16px;border:2px solid var(--acc);background:var(--card);z-index:-1}
.fj-stack::before{transform:translate(6px,6px);opacity:.6}
.fj-stack::after{transform:translate(12px,12px);opacity:.3}
.fj-cap{margin:0;font-size:16px;line-height:1.45;color:var(--ink);padding:14px 18px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 14px 14px 0;max-width:820px}
.fj-m{display:none;flex-direction:column;gap:14px}
@media (max-width:820px){.fj-scroll{display:none}.fj-m{display:flex}}
.fj-ml{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fj-ml .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fj-ml .nd2{padding:7px 12px;border-radius:12px;border:1.5px solid var(--ink3);background:var(--card);font:600 13px 'Space Grotesk',system-ui,sans-serif}
.fj-ml .nd2.sw{border-color:var(--acc);color:var(--acc)}
.fj-ml .ar{color:var(--ink3);display:inline-flex}
/* mini connector in rows */
.mc-cx{flex:none;align-self:flex-start;margin-top:150px;width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3)}
.mc-cx em{font:600 11px 'Space Grotesk',system-ui,sans-serif;font-style:normal;border:1.5px solid var(--ink3);border-radius:999px;padding:2px 8px;background:var(--card);color:var(--ink);white-space:nowrap}
.mc-cx svg{width:64px;height:12px;overflow:visible}
.mc-cx path{fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round}
.mc-cx circle{fill:var(--ink3)}
/* copy lens */
.fj-lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.fj-lc{display:flex;flex-direction:column;gap:12px;height:100%}
.fj-lc .kick{font-size:11px}
.fj-cmp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);flex:1}
.fj-cmp .tt{font:600 18px/1.2 'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
.fj-cmp .hp{font-size:13px;line-height:1.4;color:var(--ink3)}
.fj-cmp .fld{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.fj-cmp .fld b{color:var(--ink)}
.fj-cmp .ok{font:700 11px 'Space Grotesk',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.fj-vb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-self:flex-start;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--card)}
/* middle compare */
.fj-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center}
@media (max-width:980px){.fj-mid{grid-template-columns:1fr}}
.fj-one{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--e2)}
.fj-one h4{margin:0;font:600 22px/1.15 'Space Grotesk',system-ui,sans-serif}
.fj-fl{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card2)}
.fj-fl small{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.fj-fl b{font:600 22px 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em}
.fj-fl .ph{font-size:12px;color:var(--ink3)}
.fj-au{display:flex;flex-direction:column;align-items:center;gap:14px}
.fj-segs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;width:100%}
.fj-segs button{height:10px;border:0;padding:0;border-radius:5px;background:var(--line);cursor:pointer;transition:background .3s}
.fj-segs i{height:4px;border-radius:2px;background:var(--line);display:block}.fj-segs i.on{background:var(--acc)}

.fj-ctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.fj-ctl button{min-height:44px;min-width:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px 'Space Grotesk',system-ui,sans-serif;cursor:pointer}
.fj-ctl .ct{font:600 14px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2);min-width:110px;text-align:center}
.fj-sl{display:none}
.fj-sl.on{display:flex;flex-direction:column;gap:8px;height:100%}
.fj-sk{height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.fj-sk.t{height:22px;width:70%}
.fj-rad{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;font-size:13px;border-top:.5px solid var(--line)}
.fj-rad:first-child{border-top:0}
.fj-rad u{width:16px;height:16px;border-radius:50%;border:1.6px solid #B8BCC2;flex:none;box-sizing:border-box}
.fj-rad u.on{border:5px solid var(--acc)}
.fj-ill{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--ink3);border-radius:999px;padding:2px 8px}

.fj-st3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}

.fj-dg .lk{align-self:center;color:var(--ink3);flex:none;display:flex}
.fj-sc h4{margin:0;font:600 19px/1.15 'Space Grotesk',system-ui,sans-serif}
.fj-sc .tg{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink3);color:var(--ink3);border-radius:999px;padding:2px 9px;align-self:flex-start}

.fj-wt{display:flex;flex-wrap:wrap;align-items:center;gap:0}

.fr-sx{overflow-x:auto;margin:0 -4px;padding:0 4px}
.fr-si{min-width:820px}
.fr-j9 .q-fnl{height:230px}
.fr-dr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));height:34px;margin-top:6px}
.fr-dr span{display:flex;align-items:center;justify-content:flex-start}
.fr-dp{transform:translateX(-50%);font:600 11.5px 'Space Grotesk',system-ui,sans-serif;color:var(--bad);border:1.5px dashed var(--bad);border-radius:8px;padding:2px 8px;background:var(--card)}
.fr-dp.mu{color:var(--ink3);border-color:var(--ink3)}
.fr-lb span{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:12.5px}
.fr-lb em{font:700 11px 'Space Grotesk',system-ui,sans-serif;font-style:normal;color:var(--ink3);width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.fr-lb .fr-rm{border:1.5px dashed #C48A00;border-radius:12px;padding:6px 2px 8px;background:color-mix(in srgb,#E3A600 10%,transparent)}
.fr-rmt{font:700 10px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--warn)}
/* scope + fixes */
.fr-scp{display:flex;flex-direction:column;gap:14px}
.fr-sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fr-sc{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--e1);transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .75s cubic-bezier(.2,.7,.2,1) var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-sc:hover{transform:translateY(-4px)}
.fr-sc i{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;margin-bottom:4px}
.fr-sc.no i{background:var(--bad);color:#fff}
.fr-sc b{font:600 clamp(18px,1.6vw,21px) 'Space Grotesk',system-ui,sans-serif}
.fr-sc span{font-size:15px;color:var(--ink2)}
.fr-fx{display:flex;flex-direction:column;gap:16px}
.fr-fh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fr-fh i{font-style:normal;color:var(--ink3);font-size:20px}
.fr-pill{border-radius:999px;padding:7px 16px;font:600 14px 'Space Grotesk',system-ui,sans-serif;box-shadow:0 0 0 1px var(--line);background:var(--card);color:var(--ink2)}
.fr-pill.g{background:var(--fill);color:var(--fillink);box-shadow:none}
.fr-fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fr-fc{background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:8px;transition:opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-fc b{font:600 clamp(18px,1.6vw,21px) 'Space Grotesk',system-ui,sans-serif}
.fr-fc p{margin:0;font-size:15.5px;color:var(--ink2)}
.fr-fc p em{font-style:normal;font-weight:700;color:var(--ink);margin-right:6px}
/* research + alignment + crit */
.fr-rp{padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.fr-rh{display:flex;flex-direction:column;gap:6px}
.fr-ng{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.fr-nd{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;font:600 16px 'Space Grotesk',system-ui,sans-serif;transition:opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-nd i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 12px 'Space Grotesk',system-ui,sans-serif;font-style:normal}
.fr-al{display:grid;grid-template-columns:1fr minmax(220px,.8fr) 1fr;gap:18px;align-items:stretch;position:relative}
.fr-ac{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--e1)}
.fr-ac ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:16px;color:var(--ink2)}
.fr-ac li{display:flex;gap:10px;align-items:baseline}
.fr-ac li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);transform:translateY(-1px)}
.fr-am{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:var(--fill);color:var(--fillink);border-radius:999px 999px 999px 999px / 40% 40% 40% 40%;padding:26px 24px;min-height:150px;box-shadow:0 24px 50px -26px var(--glow)}
.fr-am .kick{color:color-mix(in srgb,var(--fillink) 80%,transparent)}
.fr-am b{font:600 clamp(18px,1.7vw,22px)/1.2 'Space Grotesk',system-ui,sans-serif}
.fr-ct{padding:28px;display:flex;flex-direction:column;gap:22px}
.fr-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.fr-ch>div{display:flex;flex-direction:column;gap:6px}
.fr-gr{display:flex;gap:8px;flex-wrap:wrap}
.fr-gr i{font:600 12.5px 'Space Grotesk',system-ui,sans-serif;font-style:normal;border-radius:999px;padding:5px 12px;box-shadow:0 0 0 1px var(--line);background:var(--card2);color:var(--ink2)}
.fr-vt{display:flex;flex-direction:column;gap:12px}
.fr-vr{display:grid;grid-template-columns:90px 1fr 36px;align-items:center;gap:14px}
.fr-vr b{font:600 17px 'Space Grotesk',system-ui,sans-serif}
.fr-vr span{font:700 22px 'Space Grotesk',system-ui,sans-serif;text-align:right}
.fr-vb{height:26px;border-radius:13px;background:var(--card2);overflow:hidden}
.fr-vb i{display:block;height:100%;border-radius:13px;background:var(--ink3);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1) .3s}
.fr-vb i.win{background:var(--fill)}
.rv-on .fr-ct:not([data-in]) .fr-vb i{transform:scaleX(0)}
.fr-nt{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.fr-no{border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;transform:rotate(-.6deg)}
.fr-no.r{transform:rotate(.7deg)}
.fr-no.g{background:color-mix(in srgb,var(--acc) 15%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line))}
.fr-no.r{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 28%,var(--line))}
.fr-no ul{margin:0;padding-left:18px;font-size:16px;color:var(--ink);line-height:1.5}
.fr-apr{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:18px}
.fr-apr>div{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fr-apr>div>i{font-style:normal;color:var(--ink3);font-size:20px}
.fr-apr>div>span{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:10px 16px;background:var(--card2);box-shadow:0 0 0 1px var(--line)}
.fr-apr>div>span.w{background:color-mix(in srgb,var(--acc) 12%,var(--card));box-shadow:0 0 0 1.5px var(--acc)}
.fr-apr small{font:600 11px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fr-apr b{font:600 17px 'Space Grotesk',system-ui,sans-serif}
.fr-apr p{margin:0;font-size:15px;color:var(--ink2)}
/* decision */
.fr-fbg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fr-fb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--e1);transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-fb:hover{transform:translateY(-4px)}
.fr-fb .n{position:absolute;top:16px;right:18px;font:700 12px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-fb b{font:600 18px 'Space Grotesk',system-ui,sans-serif}
.fr-fb div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.fr-fb s{color:var(--ink3)}
.fr-fb i{font-style:normal;color:var(--ink3)}
.fr-fb div span{font-weight:600;color:var(--acc)}
/* outcome */
.fr-wcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fr-wc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--e1);transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-wc:hover{transform:translateY(-5px);box-shadow:var(--e2)}
.fr-wc i{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--acc) 11%,var(--card));color:var(--acc);display:grid;place-items:center;margin-bottom:8px}
.fr-wc b{font:600 clamp(18px,1.6vw,21px)/1.2 'Space Grotesk',system-ui,sans-serif}
.fr-wc p{margin:0;font-size:15px;color:var(--ink2)}
.fr-lps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fr-lpw{display:flex;flex-direction:column;gap:10px;min-width:0}
.fr-lp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--e2);font-size:10.5px}
.fr-hero{background:#0B6FD6;color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.fr-hero b{font:600 15px/1.2 'Space Grotesk',system-ui,sans-serif;max-width:60%}
.fr-hero span{align-self:flex-start;background:#fff;color:#0B6FD6;border-radius:4px;padding:3px 10px;font-weight:700;font-size:10px}
.fr-mid{padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.fr-mid b{font:600 12px 'Space Grotesk',system-ui,sans-serif}
.fr-tl{display:grid;gap:8px;width:100%}
.fr-tl.n2{grid-template-columns:repeat(2,1fr)}
.fr-tl.n4{grid-template-columns:repeat(2,1fr)}
.fr-tl span{border-top:2px solid var(--line);padding:8px 6px;font-size:10px;color:var(--ink2);background:var(--card2);border-radius:0 0 8px 8px}
.fr-ex{padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fr-ex>b{font:600 12px 'Space Grotesk',system-ui,sans-serif;text-align:center;padding-bottom:4px}
.fr-ex div{display:flex;align-items:center;gap:10px}
.fr-ex i{flex:none;width:18px;height:18px;border-radius:50%;background:#0B6FD6}
.fr-ex div b{font-size:10.5px;font-weight:600}
.fr-lp.poa em{position:absolute;right:8px;font-style:normal;font:700 10px 'Space Grotesk',system-ui,sans-serif;background:#0B6FD6;color:#fff;border-radius:999px;padding:3px 10px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.fr-lp.poa em.a1{top:10px}
.fr-lp.poa em.a2{top:112px}
.fr-lp.poa em.a3{bottom:90px}
.fr-lp.poa{outline:2px dashed #0B6FD6;outline-offset:-2px}
/* grouped chart */
.fr-gc{padding:28px;display:flex;flex-direction:column;gap:16px}
.fr-lg{display:flex;gap:18px;font:600 13px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2)}
.fr-lg span{display:inline-flex;align-items:center;gap:8px}
.fr-lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.fr-lg i.pod,.fr-gb.pod i{background:var(--ink3)}
.fr-lg i.poa,.fr-gb.poa i{background:var(--fill)}
.fr-gg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:300px;align-items:end;overflow-x:auto}
.fr-g{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:10px;min-width:64px}
.fr-g em{font-style:normal;font-size:12.5px;color:var(--ink2);text-align:center;line-height:1.2;min-height:30px}
.fr-gp{display:flex;align-items:flex-end;gap:5px;flex:1;width:100%;justify-content:center}
.fr-gb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;width:42%;max-width:44px}
.fr-gb span{font:600 11.5px 'Space Grotesk',system-ui,sans-serif;color:var(--ink2)}
.fr-gb.poa span{color:var(--acc)}
.fr-gb i{display:block;width:100%;border-radius:6px 6px 0 0;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,.8,.2,1) calc(var(--d,0s) + var(--i) * .08s + .2s)}
.rv-on .fr-gc:not([data-in]) .fr-bar{transform:scaleY(0)}
.fr-dcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fr-dc{padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.fr-dn{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.fr-dn span{font:600 clamp(22px,2.2vw,30px) 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-dn i{font-style:normal;color:var(--ink3);font-size:22px}
.fr-dn b{font-size:clamp(34px,3.6vw,52px);line-height:1;color:var(--acc)}
.fr-dl{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);padding-top:10px;font-size:15.5px;color:var(--ink2)}
.fr-dl b{font:700 17px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3)}
.fr-dl.g b{color:var(--acc)}
.fr-lad{padding:26px 28px;display:flex;flex-direction:column;gap:6px}
.fr-lad>div{display:flex;flex-direction:column;margin-top:8px}
.fr-ld{display:grid;grid-template-columns:minmax(150px,1.1fr) 70px 24px 70px minmax(0,1.6fr);align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line2)}
.fr-ld b{font:600 17px 'Space Grotesk',system-ui,sans-serif;display:block}
.fr-ld small{font-size:13px;color:var(--ink3)}
.fr-ld .a{font:600 18px 'Space Grotesk',system-ui,sans-serif;color:var(--ink3);text-align:right;text-decoration:line-through}
.fr-ld i{font-style:normal;color:var(--ink3);text-align:center}
.fr-ld .b{font:700 20px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)}
.fr-ld.w .b{color:var(--ink2)}
.fr-ld em{font-style:normal;font-size:14.5px;color:var(--ink2)}
/* kind words */
.fr-q{margin:0;position:relative;background:var(--card);border:1.5px solid var(--acc);border-radius:32px;padding:clamp(28px,4vw,56px);box-shadow:0 0 0 1px var(--acc),0 30px 80px -34px var(--glow);display:flex;flex-direction:column;gap:28px}
.fr-qm{color:var(--acc);opacity:.9}
.fr-q blockquote{margin:0;font:500 clamp(20px,2.3vw,30px)/1.45 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);max-width:1040px}
.fr-q mark{color:inherit;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--acc) 34%,transparent) 58%);padding:0 2px;border-radius:3px;background-size:0% 100%;background-repeat:no-repeat;transition:background-size .9s cubic-bezier(.2,.8,.2,1) .5s}
.fr-q mark:nth-of-type(2){transition-delay:.9s}.fr-q mark:nth-of-type(3){transition-delay:1.3s}.fr-q mark:nth-of-type(4){transition-delay:1.7s}
.fr-q[data-in] mark,html:not(.rv-on) .fr-q mark{background-size:100% 100%}
.fr-q figcaption{display:flex;align-items:center;gap:14px}
.fr-av{width:48px;height:48px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 14px 'Space Grotesk',system-ui,sans-serif}
.fr-q figcaption b{display:block;font:600 17px 'Space Grotesk',system-ui,sans-serif}
.fr-q figcaption small{font-size:14px;color:var(--ink3)}
.fr-nx{display:flex;flex-direction:column;gap:14px}
.fr-ng2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fr-ng2>div{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 22px;transition:opacity .75s ease var(--d,0s),translate .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s),scale .9s cubic-bezier(.2,.9,.25,1.08) var(--d,0s)}
.fr-ng2 i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--fillink);display:grid;place-items:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;font-style:normal}
.fr-ng2 p{margin:0;font-size:16.5px;color:var(--ink2)}
.fr-oi{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc);font-style:normal}
.fr-dg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.fr-dg .q-conv,.fr-dg .q-conv.rt{max-width:none;margin:0;width:100%}
.fr-dg .fr-ng{grid-template-columns:1fr}
.fr-dg .fr-fbg{grid-template-columns:repeat(2,minmax(0,1fr))}
.fr-dg1 .fr-sg{grid-template-columns:1fr}
.fr-dg1 .fr-sc{flex-direction:row;align-items:center;gap:14px;padding:14px 20px}
.fr-dg1 .fr-sc i{margin:0}
.fr-dg1 .fr-sc span{margin-left:auto;text-align:right}
@media (max-width:980px){.fr-dg{grid-template-columns:1fr}}
.fr-mm{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:14px;align-items:stretch}
.fr-mi{align-self:center;justify-self:center;font-style:normal;font-size:26px;color:var(--ink3)}
.fr-mc{border-radius:24px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--e1)}
.fr-mc.bad{background:color-mix(in srgb,var(--bad) 6%,var(--card));border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.fr-mc.ok{background:color-mix(in srgb,var(--acc) 8%,var(--card));border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 24px 50px -30px var(--glow)}
.fr-mc ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s;font-size:17px;color:var(--ink)}
.fr-mc li{display:flex;gap:12px;align-items:center;counter-increment:s}
.fr-mc li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px 'Space Grotesk',system-ui,sans-serif;background:var(--card2);box-shadow:0 0 0 1px var(--line);color:var(--ink2)}
.fr-mc.ok li::before{background:var(--fill);color:var(--fillink);box-shadow:none}
.fr-mc em{font-style:normal;font:600 16px 'Space Grotesk',system-ui,sans-serif;color:var(--bad)}
.fr-mc.ok em{color:var(--acc)}
.fr-vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr-vs span{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.fr-vs small{font:600 11px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fr-vs b{font:700 18px 'Space Grotesk',system-ui,sans-serif;color:var(--acc)}
@media (max-width:860px){.fr-mm{grid-template-columns:1fr}.fr-mi{transform:rotate(90deg)}}
@media (max-width:1100px){.fr-wcs{grid-template-columns:repeat(2,minmax(0,1fr))}.fr-fbg{grid-template-columns:repeat(2,minmax(0,1fr))}.fr-al{grid-template-columns:1fr}.fr-am{border-radius:28px;min-height:0}}
@media (max-width:760px){.fr-sg,.fr-fg,.fr-lps,.fr-dcs,.fr-ng2,.fr-nt,.fr-fbg,.fr-wcs{grid-template-columns:1fr}.fr-ld{grid-template-columns:1fr 54px 18px 54px}.fr-ld em{grid-column:1/-1}.fr-two{grid-template-columns:1fr}.fr-vr{grid-template-columns:70px 1fr 28px}.fr-wi{flex-basis:100%}.fr-lp.poa em.a2{top:140px}}
@media (max-width:700px){.fr-wf .q-cx{width:auto}}
@media (max-width:760px){.fr-dg .fr-fbg{grid-template-columns:1fr}}

.ud{display:block;height:clamp(240px,30vw,340px);width:auto;overflow:hidden;transform:scaleX(-1)}

sition)</span><ul><li><b>Prescribed by</b>Rarely</li><li><b>Patient pays</b>₹30 (example)</li><li><b>Retailer margin</b>Up to 94%</li><li><b>Composition</b>Same salt</li></ul></div></div></div></div></div><p class="q-xyz reveal" data-rv=""><b>Spotted</b> where retailers and the business could earn more, <b>as measured by</b> margin on generics against allopathy, <b>by</b> studying how retailers order and which products carry the margin <span class="tag">Reported</span></p></div></section><section id="crit" style="background: var(--bg2); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2)"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">02 · The proposal</span><h2 class="h2 hd" style="max-width: 900px">Meet retailers <span class="em">where they search.</span></h2><span class="q-dec"><b>Decision</b>Encourage, never force</span></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>My proposal</b><span class="q-who">With my Product Manager</span></div><div class="ud-stack"><div class="ud-row rt" data-rv style="--hy:.2"><div class="ud-fg"><div class="ud-gr"><figure class="ud-sc pg"><svg class="udsc" viewBox="0 0 960 556.179" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><g transform="translate(-480 -262)"><g transform="translate(480 262)"><path d="M1056.977,597.719H277.44V87.8A28.554,28.554,0,0,1,305.958,59.29h722.5A28.553,28.553,0,0,1,1056.977,87.8Z" transform="translate(-185.731 -59.29)" fill="var(--u-d3)"/><rect width="733.682" height="461.51" transform="translate(113.158 34.761)" fill="var(--u-w)"/><path d="M1118.565,445.838H278.307L224.523,435.6a11.186,11.186,0,0,1-9.083-10.976V413.28h960v11.507a11.218,11.218,0,0,1-8.879,10.932l-48,10.1Z" transform="translate(-215.44 110.341)" fill="var(--u-g3)"/><path d="M632.222,428.083H498.932A12.5,12.5,0,0,1,486.454,415.6V413.29H644.728V415.6a12.5,12.5,0,0,1-12.478,12.478Z" transform="translate(-85.57 110.345)" f cal point.</dd></div><div><dt>What it gives</dt><dd>The reason to switch is visible at a glance.</dd></div></dl></div><div class="card cs-dc" data-rv><span class="tag">Call 3</span><h5>Replace in one tap</h5><dl><div><dt>Why</dt><dd>The cart is the last moment to change a choice.</dd></div><div><dt>The call</dt><dd class="c">A badge on each added product. One tap replaces it with the generic.</dd></div><div><dt>What it gives</dt><dd>The swap costs almost nothing.</dd></div></dl></div></div></div></div></section><section id="ship"><div class="wrap cs-w"><div class="q-ch dv-hd"><div class="dv-hdt"><span class="kick">03 · The experience</span><h2 class="h2 hd" style="max-width: 900px">Three nudges. <span class="em">The retailer still chooses.</span></h2><span class="q-dec"><b>Decision</b>Surface, don’t push</span></div></div><div class="q-sc reveal"><div class="q-sch"><span class="q-sn">1</span><b>Retailer’s cart</b><span class="q-who">Interactive</span></div><div style="display:flex;flex-direction:column;gap:14px"><style>#gmd0:checked~.cs-demo .cs-pick label[for=gmd0]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#gmd0:checked~.cs-demo .cs-o0{display:flex}#gmd0:focus-visible~.cs-demo .cs-pick label[for=gmd0]{outline:2px solid var(--acc);outline-offset:2px}#gmd1:checked~.cs-demo .cs-pick label[for=gmd1]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#gmd1:checked~.cs-demo .cs-o1{display:flex}#gmd1:focus-visible~.cs-demo .cs-pick label[for=gmd1]{outline:2px solid var(--acc);outline-offset:2px}#gmd2:checked~.cs-demo .cs-pick label[for=gmd2]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}#gmd2:checked~.cs-demo .cs-o2{display:flex}#gmd2:focus-visible~.cs-demo .cs-pick label[for=gmd2]{outline:2px solid var(--acc);outline-offset:2px}</style><input class="cs-r" type="radio" name="gmd
