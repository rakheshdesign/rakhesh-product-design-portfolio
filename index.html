How I design AI behaviour <h3>Trust, control and what happens when it is wrong.</h3>
In the SourcX design <b>A human decides</b>
<p>The AI proposes matches. The client compares them and chooses, and the agreement comes last.</p>
In the SourcX design <b>Evidence on screen</b>
<p>A rating alone is hard to trust, so the details behind it sit next to it.</p>
Concept · not yet designed <b>Failure and recovery</b>
<p>Say when no match is strong, explain why a result ranks where it does, and keep manual browsing as the fallback.</p>
Concept <b>Confirm before acting</b>
<p>For agents: interpret the request, show the consequence, then ask for a clear yes.</p>

<section>About <h2>A mechanical engineer who designs products.</h2>
<p>I started in mechanical engineering: CAD, 3D modelling and generative design. It shaped how I work. I begin with the constraint, test an idea against a requirement and ask what a part is really for.</p>
<p>I bring the same habits to product work: find the real problem, make the consequence visible, then measure what happened.</p>
CAD 3D modelling Generative design <a href="/mechanical-design">See the engineering side</a><ul><li><b>Solve the real problem</b>
The ask was to remove the landing page. The real problem was that it taught people. A production test settled it. <a href="/work/manage-credit-limit">Manage Credit Limit</a></li>
<li><b>Show the consequence</b>
Calculated messages, and disclaimers that change with each selection, so nobody does mental math. <a href="/work/canada-experience-gap">Canada Experience Gap</a></li>
<li><b>Design the system, not only the screen</b>
Market strings as variables turn each new market into a small change. <a href="/work/localization-automation">Localization Automation</a></li>
<li><b>Measure after launch</b>
Results are labelled as results, targets as targets and concepts as concepts. <a href="#impact">Product impact</a></li>
</ul>
</section>

.th[data-theme="dark"]{--bg:#07090D;--bg2:#0B0F16;--card:#0F131B;--card2:#151A22;--elev:#141A2E;--ink:#F5F7FA;--ink2:#A9B4C3;--ink3:#8491A3;--line:#1F2733;--line2:#1A212C;--acc:#66F5B2;--fill:#0B8450;--fillink:#FFFFFF;--acc2:#9E9EFF;--warn:#F5C451;--bad:#FF7B7B;--btn:#F5F7FA;--btnink:#07090D;--navbg:rgba(15,19,27,.72);--glow:rgba(102,245,178,.14);--glow2:rgba(158,158,255,.14);--grid:rgba(245,247,250,.045);--e1:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.5);--e2:0 1px 0 rgba(255,255,255,.06) inset,0 14px 30px -12px rgba(0,0,0,.75);--e3:0 1px 0 rgba(255,255,255,.07) inset,0 34px 72px -26px rgba(0,0,0,.9),0 0 0 1px rgba(102,245,178,.05)}
a{color:var(--ink)}
::selection{background:#66F5B2;color:#07090D}
.wrap{max-width:1360px;margin:0 auto;padding-left:40px;padding-right:40px}
.disp{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;letter-spacing:-0.02em;font-kerning:normal;text-rendering:optimizeLegibility}
.h2{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:clamp(30px,4.4vw,64px);line-height:1.08;letter-spacing:-0.025em;text-wrap:balance;font-kerning:normal;text-rendering:optimizeLegibility}
.em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0;color:var(--acc)}
.gt{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.kick{font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.lead{font-size:19px;line-height:1.6;color:var(--ink2)}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--btn);color:var(--btnink);padding:12px 18px;border-radius:12px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes lineUp{from{transform:translateY(112%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(48px) scale(.97)}to{opacity:1;transform:none}}
@keyframes hdIn{from{opacity:0;transform:translateY(34px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(-20% -5% -20% -5%)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes typing{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes strikeIn{from{text-decoration-color:transparent}to{text-decoration-color:var(--acc)}}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes slideL{from{transform:translateX(10%)}to{transform:translateX(-34%)}}
@keyframes slideR{from{transform:translateX(-34%)}to{transform:translateX(10%)}}
@keyframes wd{from{opacity:.16}to{opacity:1}}
@keyframes aurora{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-6%) scale(1.12)}}
@keyframes travel{from{left:0;opacity:0}15%{opacity:1}85%{opacity:1}to{left:calc(100% - 8px);opacity:0}}
@keyframes drawS{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes glowIn{from{box-shadow:0 0 0 0 transparent}to{box-shadow:0 0 0 1px var(--acc),0 0 40px -6px var(--glow)}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.6s}
.mask{display:block;overflow:hidden;padding:0 .04em .14em;margin-bottom:-.14em}
.mask>span{display:block;animation:lineUp 1.1s cubic-bezier(.2,.8,.2,1) both}
.mask.m2>span{animation-delay:.12s}.mask.m3>span{animation-delay:.24s}
.spin{animation:spin 24s linear infinite}
.floaty{animation:floaty 6s ease-in-out infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.aur{animation:aurora 16s ease-in-out infinite}
.sl{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s}
.sl.on{opacity:1;visibility:visible}
.sl.on .type{animation:typing 1.3s steps(22) .3s both}
.sl.on .r1{animation:pop .6s cubic-bezier(.2,.7,.2,1) 1.7s both}
.sl.on .r2{animation:pop .6s cubic-bezier(.2,.7,.2,1) 2.3s both}
.sl.on .r3{animation:pop .6s cubic-bezier(.2,.7,.2,1) 2.9s both}
.sl.on .x{animation:strikeIn .5s ease 1.9s both}
.sl.on .in1{animation:pop .7s cubic-bezier(.2,.7,.2,1) .15s both}
.sl.on .in2{animation:pop .7s cubic-bezier(.2,.7,.2,1) .45s both}
.sl.on .in3{animation:pop .7s cubic-bezier(.2,.7,.2,1) .75s both}
.x{text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px;text-decoration-skip-ink:none}
.hs{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;max-width:100%}
.hc-chip{font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
.hc-bub{display:flex;gap:10px;align-items:flex-end}
.hc-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3)}
.hc-msg{min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:18px 18px 18px 6px;padding:12px 16px}
.hc-chart{position:relative;display:flex;flex-direction:column;gap:16px}
.hc-axis{position:relative;height:20px;margin-top:-6px}
.hc-tl{position:absolute;top:2px;left:66.667%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink2)}
.hc-tl::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:5px solid var(--ink3)}
.hc-row{display:flex;flex-direction:column;gap:8px}
.hc-rh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hc-v{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-align:right}
.hc-track{position:relative;height:42px;border-radius:12px;background:var(--bg2);display:flex;overflow:hidden}
.hc-track::after{content:"";position:absolute;left:66.667%;top:0;bottom:0;margin-left:-1px;border-left:2px dashed var(--ink3);pointer-events:none}
.hc-b{box-sizing:border-box;flex:none;height:100%;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}
.hc-b.g{background:color-mix(in srgb,var(--ink3) 32%,var(--card));color:var(--ink)}
.hc-b.a{background:var(--fill);color:var(--fillink)}
.hc-ok{display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--fillink);font-size:14px;font-weight:600;border-radius:999px;padding:6px 12px}
.sl.on .hc-axis{animation:pop .6s cubic-bezier(.2,.7,.2,1) 3.4s both}
.sl.on .r1 .hc-b{animation:typing .8s cubic-bezier(.2,.7,.2,1) 1.9s both}
.sl.on .r2 .hc-b.g{animation:typing .8s cubic-bezier(.2,.7,.2,1) 2.5s both}
.sl.on .r2 .hc-b.a{animation:typing .6s cubic-bezier(.2,.7,.2,1) 3.2s both}
.caret{display:inline-block;width:3px;height:.9em;background:var(--acc);margin-left:4px;vertical-align:-.08em;animation:caret 1s step-end infinite}
.seg{position:relative;overflow:hidden}
.seg i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--fill);transform:scaleX(0);transform-origin:left;display:block}
.seg.on i{animation:fillbar var(--per,6s) linear both}
.seg.done i{transform:scaleX(1)}
.gp .seg.on i{animation-play-state:paused}
.noview .seg.on i{animation:none;transform:scaleX(0)}
.mfw{opacity:1}
.bar{transform-origin:left}
.sweep{position:relative;overflow:hidden}
.sweep::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-120%);pointer-events:none}
.on .sweep::after,.sweep.go::after{animation:sheen 1.6s ease .4s 1 both}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.hd{animation:hdIn linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
.bar{animation:grow linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
.bary{transform-origin:bottom;animation:growY linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
.readbar{transform-origin:left;animation:grow linear both;animation-timeline:scroll(root)}
.slideL{animation:slideL linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
.slideR{animation:slideR linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
.mf{view-timeline-name:--mf}
.mfw{animation:wd linear both;animation-timeline:--mf;animation-range:cover calc(26% + var(--i) * 0.7%) cover calc(36% + var(--i) * 0.7%)}
.stag{animation:reveal linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 4%) entry calc(46% + var(--i,0) * 4%)}
.draw{stroke-dasharray:var(--len,600);animation:drawS linear both;animation-timeline:view();animation-range:entry 10% cover 50%}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--e2)}
.lift{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease,border-color .3s ease}
.lift:hover{transform:translateY(-4px);box-shadow:var(--e3);border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;font-weight:600;text-decoration:none;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s,transform .25s,box-shadow .25s}
.btn-p{background:var(--btn);color:var(--btnink)}
.btn-p:hover{background:var(--fill);color:var(--fillink);box-shadow:0 10px 30px -8px var(--glow);transform:translateY(-2px)}
.btn-s{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-s:hover{background:var(--card2);color:var(--ink);border-color:var(--acc)}
.pill{transition:background .25s,color .25s,border-color .25s}
.pill:hover{background:var(--card2);color:var(--ink)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,color .25s}
.ib:hover{background:var(--card2);border-color:var(--acc);color:var(--acc)}
.chip{font-family:inherit;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s}
.chip:hover{border-color:var(--acc)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--e1);transition:background .35s,border-color .35s,transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tile:hover{background:var(--elev);border-color:var(--acc);transform:translateY(-4px);box-shadow:var(--e3)}
.tile-ic{transition:color .35s,transform .45s cubic-bezier(.2,.7,.2,1),background .35s}
.tile:hover .tile-ic{color:var(--fillink);background:var(--fill);transform:rotate(-8deg) scale(1.06)}
.tr{transition:background .4s,border-color .4s,box-shadow .4s}
.tr.on{background:var(--elev);border-color:var(--acc);box-shadow:var(--e3)}
.nd{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.nd.hi{background:var(--elev);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 18px 44px -18px var(--glow)}
.cn{position:relative;height:2px;background:var(--line);align-self:center;min-width:24px;flex:0 0 28px;border-radius:2px}
.cn::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border-top:2px solid var(--acc);border-right:2px solid var(--acc);transform:rotate(45deg)}
.cn b{position:absolute;top:-2px;left:0;width:8px;height:6px;border-radius:3px;background:var(--fill);animation:travel 2.4s ease-in-out infinite}
.tr.on .cn b{animation-duration:1.4s}
.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
.noise{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:60;display:none}
.cd .in{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#FFFFFF;transition:opacity .2s,transform .3s}
.cd.lab .in{opacity:0;transform:scale(0)}
.cr,.cd{mix-blend-mode:difference}
.cr .in{width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:1.5px solid #FFFFFF;transition:width .35s cubic-bezier(.2,.7,.2,1),height .35s cubic-bezier(.2,.7,.2,1),margin .35s cubic-bezier(.2,.7,.2,1),opacity .2s,background .3s}
.cr.hov .in{width:64px;height:64px;margin:-32px 0 0 -32px;background:#FFFFFF}
.cr.lab .in{opacity:0}
.cb .in{width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:#66F5B2;color:#07090D;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;font-weight:600;transform:scale(0);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cb.lab .in{transform:scale(1)}
@media (hover:hover) and (pointer:fine){.cur{display:block}.curroot,.curroot a,.curroot button,.curroot label{cursor:none}}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.cv{width:2px;height:20px;background:var(--line);align-self:center;position:relative;flex:none}
.cv::after{content:"";position:absolute;bottom:-1px;left:-3px;width:8px;height:8px;border-bottom:2px solid var(--acc);border-right:2px solid var(--acc);transform:rotate(45deg)}
@keyframes chipSel{from{background:transparent}to{background:var(--fill);color:var(--fillink)}}
.sl.on .pick{animation:chipSel .4s ease 3.9s both}
.gp .aur,.gp .spin,.gp .pulse,.gp .cn b,.gp .floaty{animation-play-state:paused}
@media (max-width:1000px){.flow{grid-template-columns:1fr!important}.cn{display:none}.ltr{grid-template-columns:1fr!important}}
@media (max-width:900px){.wrap{padding-left:20px;padding-right:20px}}
@media (max-width:900px){.hbar{border-radius:28px!important;padding-left:16px!important}.hnav{display:none!important}.mask{white-space:normal}}
@media (max-width:520px){.hbar .btn span,.hclock{display:none}}

/* illustrations */
.il{width:100%;height:auto;display:block}
.il .ln{fill:none;stroke:var(--ink3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.il .ac{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.il .dash{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 5;stroke-linecap:round}
.il .fc{fill:var(--card2);stroke:var(--line);stroke-width:1.5}
.il .fb{fill:var(--line)}
.il .fa{fill:var(--acc)}
.il .fs{fill:var(--fill)}
.il .note{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.il .tx{fill:var(--ink2);font:600 10.5px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.04em}
@keyframes scan{0%,100%{transform:translateX(-66px)}50%{transform:translateX(52px)}}
@keyframes ilPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ilBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ilStep{0%,12%{opacity:.25}30%,100%{opacity:1}}
@keyframes pinRing{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.il .scan{animation:scan 5.5s ease-in-out infinite}
.il .pls{animation:ilPulse 2.4s ease-in-out infinite}
.il .bob{animation:ilBob 3s ease-in-out infinite}
.il .st1,.il .st2,.il .st3{animation:ilStep 6s ease-in-out infinite}
.il .st2{animation-delay:1.2s}.il .st3{animation-delay:2.4s}
.il .orbit{transform-origin:130px 130px;animation:spin 70s linear infinite}
.il .orbit .nn{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite reverse}
.gp .il .scan,.gp .il .pls,.gp .il .bob,.gp .il .st1,.gp .il .st2,.gp .il .st3,.gp .il .orbit,.gp .il .orbit .nn,.gp .pin::after{animation-play-state:paused}
.hw{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:18px}
.hwc{display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box}
.hwc .ilb{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:10px}
.aichip{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 16px 10px 10px;box-shadow:var(--e1);transition:border-color .3s,transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.aichip strong{display:block;font-weight:600}
.aichip span:nth-child(2){color:var(--ink2)}
.aichip .aic{width:36px;height:36px;border-radius:12px;background:var(--fill);color:var(--fillink);display:flex;align-items:center;justify-content:center;flex:none}
.aichip:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--e3)}
/* world map */
.wmap{position:relative;width:100%;max-width:1100px;margin:0 auto}
.wmap svg{display:block;width:100%;height:auto}
.wmap path{fill:none;stroke:var(--line);stroke-width:4.6;stroke-linecap:round}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:999px;background:var(--card);border:1px solid var(--acc);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink);box-shadow:var(--e2)}
.pin::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1.5px solid var(--acc);animation:pinRing 2.8s ease-out infinite}
.pin .fl{font-size:17px}
@media (max-width:700px){.pin{padding:2px;gap:0}.pin b{display:none}.pin .fl{font-size:12px}}
.flr{display:inline-flex;align-items:center}
.flr .fl{font-size:16px;margin-left:-3px;box-shadow:0 0 0 2px var(--bg)}
.flr .fl:first-child{margin-left:0}
.flr.sm .fl{font-size:14px;margin-left:-4px;box-shadow:0 0 0 2px var(--bg)}.flr.sm .fl:first-child{margin-left:0}

/* industries tracker */
.trk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.ts{position:relative;padding-top:64px;min-width:0;display:flex;flex-direction:column}
.ts .tile{flex:1}
.tn{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s,color .3s,border-color .3s}
.ts:hover .tn{transform:scale(1.1) rotate(-6deg);border-color:var(--acc);color:var(--acc)}
.tl{position:absolute;left:48px;top:23px;height:2px;width:calc(100% + 18px - 48px);background:var(--line);border-radius:2px;z-index:1}
.tl i{position:absolute;inset:0;background:var(--fill);border-radius:2px;transform-origin:right}
.tl b{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkDot 2.6s ease-in-out infinite;box-shadow:0 0 0 4px var(--glow)}
.ts.now .tn{background:var(--fill);color:var(--fillink);border-color:var(--acc)}
.ts.now .tn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--acc);animation:trkRing 2.2s ease-out infinite}
.ts.now .tile{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 22px 50px -22px var(--glow)}
.nowb{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;background:var(--card)}
.nowb::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkBlink 1.4s ease-in-out infinite}
.ts:last-child .tl{display:none}
.ts .yr{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.ts.now .yr{display:none}
@keyframes trkRing{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes trkBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes trkDot{0%{left:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{left:0;opacity:0}}
@keyframes trkFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trkFillY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes trkPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@supports (animation-timeline: view()){
.tl i{animation:trkFill linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 6%) entry calc(70% + var(--i,0) * 6%)}
.tn{animation:trkPop linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 5%) entry calc(40% + var(--i,0) * 5%)}
}
@media (max-width:900px){
.trk{grid-template-columns:1fr;gap:18px}
.ts{padding-top:0;padding-left:68px}
.ts .tile{flex:none;height:auto!important}
.tl{left:23px;top:48px;width:2px;height:calc(100% + 18px - 48px)}
.tl i{transform-origin:bottom}
.tl b{top:0;left:-3px;animation-name:trkDotY}
.nowb,.ts .yr{position:static;margin-bottom:10px;align-self:flex-start}
}
@keyframes trkDotY{0%{top:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{top:0;opacity:0}}
@supports (animation-timeline: view()){@media (max-width:900px){.tl i{animation-name:trkFillY}}}

/* chapter 07 teaser */
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gc.hi{border-color:var(--acc);box-shadow:var(--e3)}
.gimg{background:#EEF1F4;aspect-ratio:4/3;display:flex}
.gimg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.gmeta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.gk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.gc.hi .gk{color:var(--acc)}
.gchip{display:inline-flex;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--fillink)}
.gbig{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.1;color:var(--ink)}
.gbar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;transform-origin:left}
.sl.on .gbar i{animation:gx 1s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tz{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px);align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3.4vw,48px);box-shadow:var(--e3);transition:border-color .35s,transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tz:hover,.tz:focus-visible{border-color:var(--acc);transform:translateY(-4px)}
.tz:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.tz-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.tz-n{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tz-n b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(34px,6vw,88px);line-height:1;color:var(--acc);font-weight:700;letter-spacing:-.03em}
.tz-n span{font-size:16px;color:var(--ink2);max-width:200px;line-height:1.35}
.tz .btn svg{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tz:hover .btn svg{transform:translateX(6px)}
.tz:hover .btn{background:var(--fill);color:var(--fillink)}
.tz-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.gcmp{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1fr);gap:6px;align-items:stretch}
.garr{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.tz .gimg{aspect-ratio:16/11}
.tz .gmeta{padding:12px 14px 14px;gap:6px}
.tz .gbig{font-size:clamp(22px,2vw,28px)}
.tz .gbar i{animation:gx linear both;animation-timeline:view();animation-range:entry 10% entry 90%}
.tz-p{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-top:2px}
.tz-p>span{box-sizing:border-box;display:block;flex:none;width:96px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.tz-p img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tz:hover .tz-p img{transform:scale(1.06)}
.tz-p .tz-more{flex:1 1 200px;width:auto;height:72px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 16px;color:var(--acc);border-style:dashed}
.tz-p .tz-more b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;color:var(--ink);line-height:1.3}
@media (max-width:900px){.tz{grid-template-columns:minmax(0,1fr)}.tz-p .tz-more{flex:1 1 100%;width:auto;height:auto;aspect-ratio:auto;padding:12px 16px;flex-direction:row;align-items:center}}
@media (max-width:480px){.tz-p>span{width:calc((100% - 30px)/4);height:auto;aspect-ratio:4/3}}
@media (max-width:760px){.tz .gcmp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px}.tz .gcmp .gc{flex:none;width:72%;scroll-snap-align:center}.tz .garr{display:none}}
/* mechanical section */
.sheet{position:relative;border:1.5px solid var(--ink3);border-radius:8px;background:var(--card);box-shadow:var(--e2);padding:14px}
.sheet-in{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);border:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.sheet-dr{padding:28px;border-right:1px solid var(--line)}
.crn{position:absolute;width:14px;height:14px;border:2px solid var(--acc);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ca{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:8px}.cb{right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:8px}.cc{left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:8px}.cd{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.sheet:hover .ca{transform:translate(-4px,-4px)}.sheet:hover .cb{transform:translate(4px,-4px)}.sheet:hover .cc{transform:translate(-4px,4px)}.sheet:hover .cd{transform:translate(4px,4px)}
.tb{margin:0;display:flex;flex-direction:column;background:var(--card)}
.tb>div{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line);flex:1}
.tb>div:last-child{border-bottom:0}
.tb dt{padding:14px;border-right:1px solid var(--line);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink3);display:flex;align-items:center}
.tb dd{margin:0;padding:14px;font-size:16px;color:var(--ink);display:flex;align-items:center}
.plate{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .3s,transform .45s cubic-bezier(.2,.7,.2,1)}
.plate:before,.plate:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--acc)}
.plate:before{left:10px;top:10px;border-right:0;border-bottom:0}.plate:after{right:10px;bottom:10px;border-left:0;border-top:0}
.plate svg{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.plate:hover{border-color:var(--acc);transform:translateY(-4px)}.plate:hover svg{transform:rotate(-10deg) scale(1.12)}
.plt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
@media (max-width:900px){.sheet-in{grid-template-columns:1fr}.sheet-dr{border-right:0;border-bottom:1px solid var(--line);padding:18px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink2);background:var(--card)}
.tag.ok{color:var(--acc);border-color:var(--acc)}
/*v5*/.stt{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 11px;line-height:1.3}
.stt::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.stt.ok{color:var(--acc);border-color:var(--acc)}
.stt.dsh{border-style:dashed}
.stt.bd{color:var(--warn);border-color:var(--warn)}
.pp{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pp a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;transition:border-color .25s,background .25s,color .25s}
.pp a:hover,.pp a:focus-visible{border-color:var(--acc);color:var(--acc)}
.hl{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:15px}
.hl a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;padding:8px 0;transition:color .25s,text-decoration-color .25s}
.hl a:hover,.hl a:focus-visible{color:var(--acc);text-decoration-color:var(--acc)}
.sf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.sf{display:flex;flex-direction:column;gap:18px;padding:28px;height:100%;box-sizing:border-box;position:relative}
.sf-top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
.sf-n{font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
.sf-dl{margin:0;display:flex;flex-direction:column;gap:12px}
.sf-dl>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:baseline}

              <span class="disp" style="width: 58px; text-align: right; font-size: 18px">{{b.v}}</span>

<section id="about" style="position: relative">
  <div class="wrap" style="padding-top: 96px; padding-bottom: 112px">
    <div class="ab">
      <div class="ab-l reveal">
        <span class="kick">About</span>
        <h2 class="h2 hd" style="max-width: 560px">A mechanical engineer who <span class="em">designs products.</span></h2>
        <p>I started in mechanical engineering: CAD, 3D modelling and generative design. It shaped how I work. I begin with the constraint, test an idea against a requirement and ask what a part is really for.</p>
        <p>I bring the same habits to product work: find the real problem, make the consequence visible, then measure what happened.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="tag ok">CAD</span><span class="tag ok">3D modelling</span><span class="tag ok">Generative design</span></div>
        <a href="/mechanical-design" class="btn btn-s" data-cur="Open" style="align-self: flex-start">See the engineering side<svg aria-hidden="true" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.arrowRight}}"></path></svg></a>
