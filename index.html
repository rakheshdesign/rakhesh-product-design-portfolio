<section>Projects <h2>Seven projects, and what each was really asking.</h2>
<a href="/work">All work</a><p><strong>Illustrative designs.</strong>
Real American Express screens are confidential, so these recreate the flow and decisions without revealing them.</p>
<article>01 · Lead Designer · Mobile · 10+ markets <h3>Manage Credit Limit</h3>
+44% mobile completion · 2× better than web What it really was The page was teaching people. A 50% production test showed removing it cost completion and raised support calls. <a href="/work/manage-credit-limit">View project</a>Fintech B2C Global</article>
<article>02 · Lead Designer · Mobile · Fraud <h3>Digital Charge Verification</h3>
4 → 3 alert entry points to three outcomes What it really was A scared person skims for “me or fraud”. Calm wording mattered as much as the screens. <a href="/work/digital-charge-verification">View project</a>Fintech B2C Fraud</article>
<article>03 · Lead Designer · Web · Enrollment <h3>Financial Relief Program</h3>
+13% enrollment conversion · plans page +14.9% What it really was Spend where the funnel bleeds. The biggest win was deleting a screen nobody needed. <a href="/work/financial-relief-program">View project</a>Fintech B2C Web</article>
<article>04 · Lead Designer · Mobile · Canada <h3>Canada Experience Gap</h3>
Validated in Rapid Lab. A scalable pattern, planned for every global market. What it really was A mental-model clash, not a Canada-only copy fix. I designed a scalable calculated message that does the math for people, planned for all global markets. <a href="/work/canada-experience-gap">View project</a>Fintech B2C Canada</article>
<article>05 · Lead Designer · Web · US + international <h3>Financial Verification</h3>
~15 min to use a higher limit, for eligible instant approvals What it really was People needed a faster way to prove income. Connect to Bank became the recommended path. Upload stays as the fallback. <a href="/work/financial-verification">View project</a>Fintech B2C Underwriting</article>
<article>06 · Lead Designer · Mobile · International <h3>Plan It® Promo Pricing</h3>
4 markets plus Mexico mobile and the payment path What it really was It needed a system, not more screens. Variables turn each new market into a small change. <a href="/work/plan-it-promo-pricing">View project</a>Fintech B2C Localization</article>
<article>07 · Lead Designer · Mobile · Mexico <h3>International Payments, Mexico</h3>
Dynamic disclaimers that follow each selection What it really was Compliance needed disclaimers at the right moment, so they now change with each selection. <a href="/work/payments-mexico">View project</a>Fintech B2C Compliance</article>

<section>About <h2>A little about how I think and work.</h2>
<p>I’m Rakhesh, a Product Designer in Bangalore, at American Express. Mechanical engineering taught me to ask how things work and how parts add up to a system.</p>
<p>That curiosity grew into human-centred digital products: financial services, enterprise, design systems and AI, from strategy to hands-on design.</p>
<p>What drives me: curiosity, careful problem-solving, and the belief that good design makes complex things easier.</p>

.x{text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px;text-decoration-skip-ink:none}

.hc-chart{position:relative;display:flex;flex-direction:column;gap:16px}
.hc-axis{position:relative;height:20px;margin-top:-6px}
.hc-tl{position:absolute;top:2px;left:66.667%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink2)}
.hc-tl::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:5px solid var(--ink3)}
.hc-row{display:flex;flex-direction:column;gap:8px}
.hc-rh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hc-v{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-align:right}
.hc-track{position:relative;height:42px;border-radius:12px;background:var(--bg2);display:flex;overflow:hidden}
.hc-track::after{content:"";position:absolute;left:66.667%;top:0;bottom:0;margin-left:-1px;border-left:2px dashed var(--ink3);pointer-events:none}
.hc-b{box-sizing:border-box;flex:none;height:100%;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}
.hc-b.g{background:color-mix(in srgb,var(--ink3) 32%,var(--card));color:var(--ink)}
.hc-b.a{background:var(--fill);color:var(--fillink)}
.hc-ok{display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--fillink);font-size:14px;font-weight:600;border-radius:999px;padding:6px 12px}
.sl.on .hc-axis{animation:pop .6s cubic-bezier(.2,.7,.2,1) 3.4s both}

.sl.on .r2 .hc-b.a{animation:typing .6s cubic-bezier(.2,.7,.2,1) 3.2s both}
.caret{display:inline-block;width:3px;height:.9em;background:var(--acc);margin-left:4px;vertical-align:-.08em;animation:caret 1s step-end infinite}
.seg{position:relative;overflow:hidden}

.mfw{opacity:1}
.bar{transform-origin:left}

.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 55%}

.bar{animation:grow linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
.bary{transform-origin:bottom;animation:growY linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
.readbar{transform-origin:left;animation:grow linear both;animation-timeline:scroll(root)}
.slideL{animation:slideL linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
.slideR{animation:slideR linear both;animation-timeline:view();animation-range:entry 0% exit 100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--e2)}

.cn b{position:absolute;top:-2px;left:0;width:8px;height:6px;border-radius:3px;background:var(--fill);animation:travel 2.4s ease-in-out infinite}

/* industries tracker */
.trk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative}
.ts{position:relative;padding-top:64px;min-width:0;display:flex;flex-direction:column}
.ts .tile{flex:1}
.tn{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s,color .3s,border-color .3s}
.ts:hover .tn{transform:scale(1.1) rotate(-6deg);border-color:var(--acc);color:var(--acc)}
.tl{position:absolute;left:48px;top:23px;height:2px;width:calc(100% + 18px - 48px);background:var(--line);border-radius:2px;z-index:1}
.tl i{position:absolute;inset:0;background:var(--fill);border-radius:2px;transform-origin:right}
.tl b{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkDot 2.6s ease-in-out infinite;box-shadow:0 0 0 4px var(--glow)}
.ts.now .tn{background:var(--fill);color:var(--fillink);border-color:var(--acc)}
.ts.now .tn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--acc);animation:trkRing 2.2s ease-out infinite}
.ts.now .tile{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 22px 50px -22px var(--glow)}
.nowb{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;background:var(--card)}
.nowb::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:trkBlink 1.4s ease-in-out infinite}
.ts:last-child .tl{display:none}
.ts .yr{position:absolute;left:62px;top:11px;z-index:2;display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.ts.now .yr{display:none}
@keyframes trkRing{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes trkBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes trkDot{0%{left:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{left:0;opacity:0}}
@keyframes trkFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trkFillY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes trkPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@supports (animation-timeline: view()){
.tl i{animation:trkFill linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 6%) entry calc(70% + var(--i,0) * 6%)}
.tn{animation:trkPop linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 5%) entry calc(40% + var(--i,0) * 5%)}
}
@media (max-width:900px){
.trk{grid-template-columns:1fr;gap:18px}
.ts{padding-top:0;padding-left:68px}
.ts .tile{flex:none;height:auto!important}
.tl{left:23px;top:48px;width:2px;height:calc(100% + 18px - 48px)}
.tl i{transform-origin:bottom}
.tl b{top:0;left:-3px;animation-name:trkDotY}
.nowb,.ts .yr{position:static;margin-bottom:10px;align-self:flex-start}
}
@keyframes trkDotY{0%{top:calc(100% - 8px);opacity:0}15%{opacity:1}85%{opacity:1}100%{top:0;opacity:0}}
@supports (animation-timeline: view()){@media (max-width:900px){.tl i{animation-name:trkFillY}}}

/* chapter 07 teaser */
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gc.hi{border-color:var(--acc);box-shadow:var(--e3)}
.gimg{background:#EEF1F4;aspect-ratio:4/3;display:flex}
.gimg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.gmeta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.gk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.gc.hi .gk{color:var(--acc)}
.gchip{display:inline-flex;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--fillink)}
.gbig{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.1;color:var(--ink)}
.gbar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px;transform-origin:left}
.sl.on .gbar i{animation:gx 1s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tz{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px);align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3.4vw,48px);box-shadow:var(--e3);transition:border-color .35s,transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tz:hover,.tz:focus-visible{border-color:var(--acc);transform:translateY(-4px)}
.tz:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.tz-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.tz-n{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tz-n b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(34px,6vw,88px);line-height:1;color:var(--acc);font-weight:700;letter-spacing:-.03em}
.tz-n span{font-size:16px;color:var(--ink2);max-width:200px;line-height:1.35}
.tz .btn svg{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tz:hover .btn svg{transform:translateX(6px)}
.tz:hover .btn{background:var(--fill);color:var(--fillink)}
.tz-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.gcmp{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1fr);gap:6px;align-items:stretch}
.garr{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.tz .gimg{aspect-ratio:16/11}
.tz .gmeta{padding:12px 14px 14px;gap:6px}
.tz .gbig{font-size:clamp(22px,2vw,28px)}
.tz .gbar i{animation:gx linear both;animation-timeline:view();animation-range:entry 10% entry 90%}
.tz-p{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-top:2px}
.tz-p>span{box-sizing:border-box;display:block;flex:none;width:96px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.tz-p img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tz:hover .tz-p img{transform:scale(1.06)}
.tz-p .tz-more{flex:1 1 200px;width:auto;height:72px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 16px;color:var(--acc);border-style:dashed}
.tz-p .tz-more b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;color:var(--ink);line-height:1.3}
@media (max-width:900px){.tz{grid-template-columns:minmax(0,1fr)}.tz-p .tz-more{flex:1 1 100%;width:auto;height:auto;aspect-ratio:auto;padding:12px 16px;flex-direction:row;align-items:center}}
@media (max-width:480px){.tz-p>span{width:calc((100% - 30px)/4);height:auto;aspect-ratio:4/3}}
@media (max-width:760px){.tz .gcmp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px}.tz .gcmp .gc{flex:none;width:72%;scroll-snap-align:center}.tz .garr{display:none}}
/* mechanical section */
.sheet{position:relative;border:1.5px solid var(--ink3);border-radius:8px;background:var(--card);box-shadow:var(--e2);padding:14px}
.sheet-in{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);border:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.sheet-dr{padding:28px;border-right:1px solid var(--line)}
.crn{position:absolute;width:14px;height:14px;border:2px solid var(--acc);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ca{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:8px}.cb{right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:8px}.cc{left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:8px}.cd{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.sheet:hover .ca{transform:translate(-4px,-4px)}.sheet:hover .cb{transform:translate(4px,-4px)}.sheet:hover .cc{transform:translate(-4px,4px)}.sheet:hover .cd{transform:translate(4px,4px)}
.tb{margin:0;display:flex;flex-direction:column;background:var(--card)}
.tb>div{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line);flex:1}
.tb>div:last-child{border-bottom:0}
.tb dt{padding:14px;border-right:1px solid var(--line);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink3);display:flex;align-items:center}
.tb dd{margin:0;padding:14px;font-size:16px;color:var(--ink);display:flex;align-items:center}
.plate{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .3s,transform .45s cubic-bezier(.2,.7,.2,1)}
.plate:before,.plate:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--acc)}
.plate:before{left:10px;top:10px;border-right:0;border-bottom:0}.plate:after{right:10px;bottom:10px;border-left:0;border-top:0}
.plate svg{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.plate:hover{border-color:var(--acc);transform:translateY(-4px)}.plate:hover svg{transform:rotate(-10deg) scale(1.12)}
.plt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
@media (max-width:900px){.sheet-in{grid-template-columns:1fr}.sheet-dr{border-right:0;border-bottom:1px solid var(--line);padding:18px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink2);background:var(--card)}
.tag.ok{color:var(--acc);border-color:var(--acc)}
/*v5*/.stt{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 11px;line-height:1.3}
.stt::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.stt.ok{color:var(--acc);border-color:var(--acc)}
.stt.dsh{border-style:dashed}
.stt.bd{color:var(--warn);border-color:var(--warn)}
.pp{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pp a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;transition:border-color .25s,background .25s,color .25s}
.pp a:hover,.pp a:focus-visible{border-color:var(--acc);color:var(--acc)}
.hl{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:15px}
.hl a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;padding:8px 0;transition:color .25s,text-decoration-color .25s}
.hl a:hover,.hl a:focus-visible{color:var(--acc);text-decoration-color:var(--acc)}
.sf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.sf{display:flex;flex-direction:column;gap:18px;padding:28px;height:100%;box-sizing:border-box;position:relative}
.sf-top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
.sf-n{font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
.sf-dl{margin:0;display:flex;flex-direction:column;gap:12px}
.sf-dl>div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:baseline}
.sf-dl dt{font-size:12px}
.sf-dl dd{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.sf-proof{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:16px;margin-top:auto}
.sf-proof b{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(34px,calc(34px + (100vw - 390px) * 0.0148),48px);line-height:1.05;color:var(--acc);font-weight:700;letter-spacing:-.02em}
.sf-proof span{font-size:14px;color:var(--ink3);line-height:1.4}
.sf-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.lane{display:flex;flex-direction:column;gap:14px;padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--card2);height:100%;box-sizing:border-box}
.lane ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lane li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line2)}
.lane li:first-child{border-top:0}
.lane li a,.lane li>span:first-child{color:var(--ink);text-decoration:none;font-weight:600;font-size:16px}
.lane li a:hover,.lane li a:focus-visible{color:var(--acc)}
.lane li small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:18px}
.ld{display:flex;flex-direction:column;gap:16px;padding:28px;height:100%;box-sizing:border-box}
.ld-h{display:flex;align-items:center;gap:14px}
.ld-h .tile-ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--card2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.ld ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ld li{display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:2px solid var(--line)}
.ld li b{font-size:16px;font-weight:600;color:var(--ink)}
.ld li span{font-size:15px;line-height:1.5;color:var(--ink2)}
.ld li a{color:var(--acc);font-weight:600;font-size:15px;text-decoration:none;margin-top:2px}

<!-- ABOUT -->
<section id="about" style="position: relative">

        <span class="kick">About</span>
        <h2 class="h2 hd" style="max-width: 560px">A little about how I <span class="em">think and work.</span></h2>
        <p>I’m Rakhesh, a Product Designer in Bangalore, at American Express. Mechanical engineering taught me to ask how things work and how parts add up to a system.</p>
        <p>That curiosity grew into human-centred digital products: financial services, enterprise, design systems and AI, from strategy to hands-on design.</p>
        <p>What drives me: curiosity, careful problem-solving, and the belief that good design makes complex things easier.</p>

      <ul class="ab-p" aria-label="Design principles">
        <li class="reveal"><div class="abi"><svg class="il" viewBox="0 0 240 92" aria-hidden="true"><rect class="fc" x="14" y="16" width="62" height="60" rx="10"></rect><rect class="fb" x="24" y="30" width="30" height="5" rx="2.5"></rect><rect class="fb" x="24" y="42" width="40" height="5" rx="2.5"></rect><rect class="fb" x="24" y="54" width="22" height="5" rx="2.5"></rect><path class="ln" d="M20 70L70 22" style="stroke: var(--ink3)"></path><path class="ac" d="M84 46h14m-5-5 5 5-5 5"></path><g class="bob"><circle cx="134" cy="44" r="21" fill="var(--card)" stroke="var(--acc)" stroke-width="3"></circle><path class="ac" d="M149 60l15 15" style="stroke-width: 4"></path><rect class="fa" x="122" y="38" width="24" height="5" rx="2.5"></rect><rect class="fb" x="122" y="49" width="16" height="5" rx="2.5"></rect></g><g class="pls" style="transform-box: fill-box; transform-origin: center"><circle class="fs" cx="206" cy="44" r="15"></circle><path d="M199 44.5l5.2 5.2 9.3-10" fill="none" stroke="var(--fillink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></svg></div><b>Solve the real problem</b><span>The ask was to remove the landing page. The real problem was that it taught people. A production test settled it.</span><a href="/work/manage-credit-limit">Manage Credit Limit</a></li>
        <li class="reveal"><div class="abi"><svg class="il" viewBox="0 0 240 92" aria-hidden="true"><rect class="fc" x="14" y="10" width="140" height="28" rx="14"></rect><rect class="fa" x="18" y="14" width="64" height="20" rx="10"></rect><text class="tx" x="50" y="28" text-anchor="middle" style="fill: var(--fillink); font-size: 9.5px">RAISE</text><text class="tx" x="118" y="28" text-anchor="middle" style="font-size: 9.5px">LOWER</text><rect class="fc" x="14" y="48" width="212" height="36" rx="10"></rect><rect class="fb" x="26" y="58" width="104" height="5" rx="2.5"></rect><rect class="fb" x="26" y="69" width="78" height="5" rx="2.5"></rect><rect class="fs" x="156" y="56" width="58" height="20" rx="10"></rect><text class="tx" x="185" y="70" text-anchor="middle" style="fill: var(--fillink); font-size: 9.5px">$15,000</text></svg></div><b>Show the consequence</b><span>Calculated messages, and disclaimers that change with each selection, so nobody does mental math.</span><a href="/work/canada-experience-gap">Canada Experience Gap</a></li>
